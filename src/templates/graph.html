<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo de casos clínicos — MC896 NLP</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --border: #dfe3e8;
  --ink: #1a1f26;
  --muted: #6b7280;
  --accent: #2563eb;
  --before: #7c3aed;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1, h2, h3 { margin: 0; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- cabeçalho ---------- */
header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
header h1 { font-size: 15px; letter-spacing: .2px; }
header h1 span { color: var(--muted); font-weight: 400; }
.stats { display: flex; gap: 14px; margin-left: auto; color: var(--muted); font-size: 12px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
main { flex: 1 1 auto; display: flex; min-height: 0; }
aside {
  width: 260px;
  flex: 0 0 260px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#detail {
  width: 340px;
  flex: 0 0 340px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px;
}
#center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------- lista de casos ---------- */
.search { padding: 10px; border-bottom: 1px solid var(--border); }
.search input {
  width: 100%; padding: 7px 9px; font: inherit;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#caseList { overflow-y: auto; flex: 1 1 auto; padding: 6px; }
.case-item {
  display: block; width: 100%; text-align: left;
  padding: 7px 9px; margin-bottom: 2px;
  border: 1px solid transparent; border-radius: 6px; background: none;
}
.case-item:hover { background: var(--bg); }
.case-item.active { background: #eaf1ff; border-color: #bcd2ff; }
.case-item .cid { font-weight: 600; font-size: 12.5px; }
.case-item .ctitle {
  color: var(--muted); font-size: 11.5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.case-item .counts { margin-top: 4px; display: flex; gap: 3px; }
.chip {
  font-size: 10px; padding: 0 5px; border-radius: 8px;
  color: #fff; font-variant-numeric: tabular-nums;
}
.case-item.overview { border-color: var(--border); background: var(--bg); margin-bottom: 8px; }

/* ---------- abas e filtros ---------- */
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 2px; background: var(--bg); padding: 2px; border-radius: 7px; }
.tab { padding: 5px 12px; border: 0; background: none; border-radius: 5px; font-size: 13px; }
.tab.active { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.filters { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.toggle {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--panel); font-size: 12px; user-select: none;
}
.toggle.off { opacity: .4; }
.toggle .dot { width: 9px; height: 9px; border-radius: 50%; }
.toolbar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }

/* ---------- área central ---------- */
#stage { flex: 1 1 auto; position: relative; overflow: hidden; min-height: 0; }
#stage.scrollable { overflow: auto; }
svg { display: block; }
#graphSvg { width: 100%; height: 100%; cursor: grab; background:
  radial-gradient(circle at 1px 1px, #dfe3e8 1px, transparent 0) 0 0/22px 22px; }
#graphSvg.dragging { cursor: grabbing; }
.node-shape { stroke: #fff; stroke-width: 1.5; cursor: pointer; }
.node-label { font-size: 10.5px; pointer-events: none; fill: var(--ink); }
.node-label.halo { stroke: rgba(255,255,255,.9); stroke-width: 3; paint-order: stroke; }
.no-labels .node-label { display: none; }
.link { fill: none; stroke: #9aa3af; stroke-width: 1.3; }
.link.BEFORE { stroke: var(--before); stroke-dasharray: 5 3; stroke-width: 1.8; }
.link.INDICATES { stroke: #0891b2; stroke-width: 1.8; }
.dim { opacity: .12; }
.sel { stroke: #111; stroke-width: 3; }
.hint {
  position: absolute; left: 12px; bottom: 10px;
  font-size: 11px; color: var(--muted); background: rgba(255,255,255,.85);
  padding: 3px 8px; border-radius: 5px; pointer-events: none;
}
.zoom-controls { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 4px; }
.zoom-controls button {
  height: 28px; min-width: 28px; border: 1px solid var(--border);
  background: var(--panel); border-radius: 6px; font-size: 15px; line-height: 1;
}

/* ---------- linha do tempo ---------- */
.tl-band-title { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .4px; }
.tl-lane { font-size: 11px; fill: var(--muted); }
.tl-grid { stroke: #e6e9ed; stroke-width: 1; }
.tl-box { cursor: pointer; }
.tl-box text { font-size: 11px; pointer-events: none; }
.tl-time { font-size: 10px; fill: var(--before); font-style: italic; }
.tl-arc { fill: none; stroke: var(--before); stroke-width: 1.6; stroke-dasharray: 5 3; }
.tl-empty { padding: 40px; color: var(--muted); text-align: center; }
.unplaced { padding: 12px 18px; border-top: 1px dashed var(--border); background: var(--panel); }
.unplaced h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
.unplaced .row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.pill {
  border: 1px solid var(--border); background: var(--panel);
  border-radius: 14px; padding: 2px 10px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px;
}
.pill.sel-pill { border-color: #111; box-shadow: 0 0 0 1px #111; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }

/* ---------- texto do caso ---------- */
#textView { padding: 22px 30px; overflow-y: auto; height: 100%; background: var(--bg); }
.text-card {
  max-width: 860px; margin: 0 auto; background: var(--panel);
  border: 1px solid var(--border); border-radius: 10px; padding: 26px 30px;
}
.text-card h2 { font-size: 15px; margin-bottom: 4px; }
.text-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
.case-body { font-size: 15px; line-height: 1.85; white-space: pre-wrap; }
mark {
  background: none; padding: 1px 2px; border-radius: 3px; cursor: pointer;
  border-bottom: 2px solid currentColor;
}
mark:hover { background: rgba(0,0,0,.06); }
mark.suspected { border-bottom-style: dotted; }
mark.marksel { background: #fff3bf; box-shadow: 0 0 0 2px #fde68a; }

/* ---------- painel de detalhes ---------- */
#detail h2 { font-size: 14px; margin-bottom: 2px; }
#detail .placeholder { color: var(--muted); font-size: 13px; padding-top: 30px; text-align: center; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 8px;
}
.kv { margin: 10px 0; }
.kv dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.kv dd { margin: 1px 0 8px; font-size: 13px; word-break: break-word; }
.evidence {
  background: var(--bg); border-left: 3px solid var(--border);
  padding: 9px 11px; font-size: 13px; line-height: 1.6; border-radius: 0 5px 5px 0;
}
.evidence b { background: #fff3bf; padding: 0 2px; border-radius: 2px; }
.rel-list { list-style: none; padding: 0; margin: 6px 0 0; }
.rel-list li { margin-bottom: 4px; }
.rel-list button {
  width: 100%; text-align: left; border: 1px solid var(--border);
  background: var(--panel); border-radius: 6px; padding: 5px 8px; font-size: 12px;
}
.rel-list button:hover { border-color: var(--accent); }
.rel-name { font-size: 10px; color: var(--muted); letter-spacing: .4px; display: block; }
hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
</style>
</head>
<body>

<header>
  <h1>Grafo de casos clínicos <span>— MC896 NLP</span></h1>
  <div class="stats" id="globalStats"></div>
</header>

<main>
  <aside>
    <div class="search"><input id="caseSearch" type="search" placeholder="Buscar caso, título ou entidade…" autocomplete="off"></div>
    <div id="caseList"></div>
  </aside>

  <div id="center">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-view="graph">Grafo</button>
        <button class="tab" data-view="timeline">Linha do tempo</button>
        <button class="tab" data-view="text">Texto do caso</button>
      </div>
      <div class="filters" id="filters"></div>
    </div>
    <div id="stage"></div>
  </div>

  <div id="detail"><div class="placeholder">Selecione um nó ou uma aresta para ver a evidência textual.</div></div>
</main>

<script>
const DATA = /*__GRAPH_DATA__*/ null;

const TYPES = ["Case", "Symptom", "Exam", "Condition", "Treatment"];
const TYPE_COLOR = {
  Case: "#475569", Symptom: "#e11d48", Exam: "#2563eb",
  Condition: "#d97706", Treatment: "#059669",
};
const TYPE_LABEL = {
  Case: "Caso", Symptom: "Sintoma", Exam: "Exame",
  Condition: "Condição", Treatment: "Tratamento",
};
const RELATIONS = ["HAS_SYMPTOM", "UNDERWENT_EXAM", "DIAGNOSED_WITH", "RECEIVED_TREATMENT", "INDICATES", "BEFORE"];
const EVENT_TYPES = ["Symptom", "Exam", "Condition", "Treatment"];
const SVG_NS = "http://www.w3.org/2000/svg";

const nodeById = new Map(DATA.nodes.map((node) => [node.id, node]));
const edgeById = new Map(DATA.edges.map((edge) => [edge.id, edge]));
const caseById = new Map(DATA.cases.map((item) => [item.case_id, item]));
const overviewNodeById = new Map(DATA.overview.nodes.map((node) => [node.id, node]));
const overviewEdgeById = new Map(DATA.overview.edges.map((edge) => [edge.id, edge]));
const nodesByCase = new Map();
const edgesByCase = new Map();
for (const node of DATA.nodes) {
  if (!nodesByCase.has(node.case_id)) nodesByCase.set(node.case_id, []);
  nodesByCase.get(node.case_id).push(node);
}
for (const edge of DATA.edges) {
  if (!edgesByCase.has(edge.case_id)) edgesByCase.set(edge.case_id, []);
  edgesByCase.get(edge.case_id).push(edge);
}

const state = {
  view: "graph",
  caseId: DATA.cases.length ? DATA.cases[0].case_id : "__overview__",
  selected: null,          // {kind: "node" | "edge", id}
  types: new Set(TYPES),
  relations: new Set(RELATIONS),
  hideUncertain: false,
  minCount: 3,             // usado apenas na visão geral
  search: "",
};

const el = (id) => document.getElementById(id);
const svgEl = (name, attrs = {}) => {
  const node = document.createElementNS(SVG_NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
};
const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (ch) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const isOverview = () => state.caseId === "__overview__";
const truncate = (text, max) => (text.length > max ? `${text.slice(0, max - 1)}…` : text);
const lookupNode = (id) => nodeById.get(id) || overviewNodeById.get(id);

/* ================= cabeçalho e lista de casos ================= */

function renderStats() {
  const counts = DATA.summary.types;
  el("globalStats").innerHTML = [
    `<span><b>${DATA.summary.cases}</b> casos</span>`,
    `<span><b>${DATA.summary.nodes}</b> nós</span>`,
    `<span><b>${DATA.summary.edges}</b> arestas</span>`,
    `<span><b>${DATA.summary.before}</b> BEFORE</span>`,
    `<span><b>${counts.Symptom || 0}</b> sintomas · <b>${counts.Exam || 0}</b> exames · ` +
    `<b>${counts.Condition || 0}</b> condições · <b>${counts.Treatment || 0}</b> tratamentos</span>`,
  ].join("");
}

function caseMatchesSearch(item) {
  if (!state.search) return true;
  const term = state.search.toLowerCase();
  if (item.case_id.toLowerCase().includes(term)) return true;
  if ((item.title || "").toLowerCase().includes(term)) return true;
  return (nodesByCase.get(item.case_id) || []).some((node) => node.label.toLowerCase().includes(term));
}

function renderCaseList() {
  const list = el("caseList");
  list.innerHTML = "";

  const overview = document.createElement("button");
  overview.className = "case-item overview" + (isOverview() ? " active" : "");
  overview.innerHTML = `<div class="cid">Visão geral</div>
    <div class="ctitle">Entidades agregadas de todos os casos</div>`;
  overview.onclick = () => selectCase("__overview__");
  list.appendChild(overview);

  for (const item of DATA.cases) {
    if (!caseMatchesSearch(item)) continue;
    const button = document.createElement("button");
    button.className = "case-item" + (item.case_id === state.caseId ? " active" : "");
    button.innerHTML = `<div class="cid">${escapeHtml(item.case_id)}</div>
      <div class="ctitle">${escapeHtml(item.title || "sem título")}</div>
      <div class="counts">${EVENT_TYPES.filter((type) => item.counts[type])
        .map((type) => `<span class="chip" style="background:${TYPE_COLOR[type]}"
          title="${TYPE_LABEL[type]}">${type[0]}${item.counts[type]}</span>`).join("")}</div>`;
    button.onclick = () => selectCase(item.case_id);
    list.appendChild(button);
  }

  const active = list.querySelector(".case-item.active:not(.overview)");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function selectCase(caseId) {
  state.caseId = caseId;
  state.selected = null;
  if (isOverview()) state.view = "graph";
  renderCaseList();
  renderAll();
}

/* ================= filtros ================= */

function renderFilters() {
  const box = el("filters");
  box.innerHTML = "";

  for (const type of (isOverview() ? EVENT_TYPES : TYPES)) {
    const active = state.types.has(type);
    const button = document.createElement("button");
    button.className = "toggle" + (active ? "" : " off");
    button.innerHTML = `<span class="dot" style="background:${TYPE_COLOR[type]}"></span>${TYPE_LABEL[type]}`;
    button.onclick = () => {
      if (active) state.types.delete(type); else state.types.add(type);
      renderFilters();
      renderStage();
    };
    box.appendChild(button);
  }

  if (!isOverview()) {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" ${state.hideUncertain ? "checked" : ""}> ocultar não afirmados`;
    label.querySelector("input").onchange = (event) => {
      state.hideUncertain = event.target.checked;
      renderStage();
    };
    box.appendChild(label);
  } else {
    const label = document.createElement("label");
    label.innerHTML = `mínimo de ocorrências:
      <input type="range" min="1" max="12" value="${state.minCount}" style="width:90px">
      <b id="minCountValue">${state.minCount}</b>`;
    label.querySelector("input").oninput = (event) => {
      state.minCount = Number(event.target.value);
      el("minCountValue").textContent = state.minCount;
      renderStage();
    };
    box.appendChild(label);
  }
}

/* ================= seleção de dados visíveis ================= */

function visibleCaseGraph() {
  const nodes = (nodesByCase.get(state.caseId) || []).filter((node) => {
    if (!state.types.has(node.type)) return false;
    if (state.hideUncertain && node.attrs.assertion && node.attrs.assertion !== "affirmed") return false;
    return true;
  });
  const ids = new Set(nodes.map((node) => node.id));
  const edges = (edgesByCase.get(state.caseId) || []).filter(
    (edge) => state.relations.has(edge.relation) && ids.has(edge.source) && ids.has(edge.target));
  return { nodes, edges };
}

function visibleOverviewGraph() {
  const nodes = DATA.overview.nodes.filter(
    (node) => state.types.has(node.type) && node.count >= state.minCount);
  const ids = new Set(nodes.map((node) => node.id));
  const edges = DATA.overview.edges.filter((edge) => ids.has(edge.source) && ids.has(edge.target));
  return { nodes, edges };
}

const currentGraph = () => (isOverview() ? visibleOverviewGraph() : visibleCaseGraph());

/* ================= grafo com layout dirigido por forças ================= */

let simulation = null;

function stopSimulation() {
  if (simulation) {
    cancelAnimationFrame(simulation.frame);
    simulation = null;
  }
}

function renderGraph() {
  const stage = el("stage");
  stopSimulation();
  stage.className = "";
  stage.innerHTML = "";

  const graph = currentGraph();
  if (!graph.nodes.length) {
    stage.innerHTML = `<div class="tl-empty">Nenhum nó com os filtros atuais.</div>`;
    return;
  }

  const svg = svgEl("svg", { id: "graphSvg" });
  const defs = svgEl("defs");
  for (const [name, color] of [["default", "#9aa3af"], ["BEFORE", "#7c3aed"], ["INDICATES", "#0891b2"]]) {
    const marker = svgEl("marker", {
      id: `arrow-${name}`, viewBox: "0 0 10 10", refX: 10, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse",
    });
    marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color }));
    defs.appendChild(marker);
  }
  svg.appendChild(defs);
  const viewport = svgEl("g");
  const linkLayer = svgEl("g");
  const nodeLayer = svgEl("g");
  viewport.appendChild(linkLayer);
  viewport.appendChild(nodeLayer);
  svg.appendChild(viewport);
  stage.appendChild(svg);

  const width = stage.clientWidth || 900;
  const height = stage.clientHeight || 600;

  // Posição inicial em círculo; o nó Case começa no centro.
  const sim = graph.nodes.map((node, index) => {
    const angle = (index / graph.nodes.length) * Math.PI * 2;
    const radius = node.type === "Case" ? 0 : Math.min(width, height) * 0.3;
    return {
      data: node,
      x: width / 2 + Math.cos(angle) * radius,
      y: height / 2 + Math.sin(angle) * radius,
      vx: 0, vy: 0, fixed: false, r: nodeRadius(node),
    };
  });
  const simById = new Map(sim.map((item) => [item.data.id, item]));
  const links = graph.edges.map((edge) => ({
    data: edge, source: simById.get(edge.source), target: simById.get(edge.target), rest: 0,
  }));

  // Um caso com muitos eventos vira uma estrela: a mola precisa ser longa o
  // bastante para que todos os vizinhos caibam no círculo ao redor do centro.
  const degree = new Map();
  for (const link of links) {
    degree.set(link.source.data.id, (degree.get(link.source.data.id) || 0) + 1);
    degree.set(link.target.data.id, (degree.get(link.target.data.id) || 0) + 1);
  }

  const linkEls = links.map((link) => {
    const marker = link.data.relation === "BEFORE" || link.data.relation === "INDICATES"
      ? link.data.relation : "default";
    const path = svgEl("path", {
      class: `link ${link.data.relation}`, "marker-end": `url(#arrow-${marker})`,
    });
    if (link.data.weight > 1) path.setAttribute("stroke-width", Math.min(6, 1 + link.data.weight * 0.5));
    path.style.cursor = "pointer";
    path.onclick = (event) => { event.stopPropagation(); select({ kind: "edge", id: link.data.id }); };
    path.appendChild(svgEl("title")).textContent =
      link.data.relation + (link.data.weight ? ` (${link.data.weight}×)` : "");
    linkLayer.appendChild(path);
    return path;
  });

  const nodeEls = sim.map((item) => {
    const group = svgEl("g", { class: "node-group" });
    const color = TYPE_COLOR[item.data.type];
    const shape = item.data.type === "Case"
      ? svgEl("rect", {
          class: "node-shape", x: -item.r * 1.6, y: -item.r * 0.8,
          width: item.r * 3.2, height: item.r * 1.6, rx: 6, fill: color,
        })
      : svgEl("circle", { class: "node-shape", r: item.r, fill: color });
    if (item.data.attrs && item.data.attrs.assertion && item.data.attrs.assertion !== "affirmed") {
      shape.setAttribute("stroke", color);
      shape.setAttribute("stroke-dasharray", "3 2");
      shape.setAttribute("fill-opacity", ".35");
    }
    group.appendChild(shape);
    const text = truncate(item.data.label, 26);
    for (const cls of ["node-label halo", "node-label"]) {
      const label = svgEl("text", { class: cls, y: item.r + 12, "text-anchor": "middle" });
      label.textContent = text;
      group.appendChild(label);
    }
    group.appendChild(svgEl("title")).textContent =
      `${TYPE_LABEL[item.data.type]}: ${item.data.label}` +
      (item.data.count ? ` — ${item.data.count} ocorrências` : "");
    group.onclick = (event) => { event.stopPropagation(); select({ kind: "node", id: item.data.id }); };
    enableDrag(group, item);
    nodeLayer.appendChild(group);
    return group;
  });

  function draw() {
    for (let i = 0; i < links.length; i += 1) {
      const { source, target } = links[i];
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.hypot(dx, dy) || 1;
      const endX = target.x - (dx / distance) * (target.r + 6);
      const endY = target.y - (dy / distance) * (target.r + 6);
      const curve = links[i].data.relation === "BEFORE" ? 0.15 : 0;
      const midX = (source.x + endX) / 2 - dy * curve;
      const midY = (source.y + endY) / 2 + dx * curve;
      linkEls[i].setAttribute("d", `M${source.x},${source.y} Q${midX},${midY} ${endX},${endY}`);
    }
    for (let i = 0; i < sim.length; i += 1) {
      nodeEls[i].setAttribute("transform", `translate(${sim[i].x},${sim[i].y})`);
    }
  }

  // Fruchterman-Reingold simplificado: repulsão entre pares e molas nas arestas.
  const ideal = Math.sqrt((width * height) / Math.max(sim.length, 1)) * 0.62;
  for (const link of links) {
    const hub = Math.max(degree.get(link.source.data.id) || 1, degree.get(link.target.data.id) || 1);
    link.rest = Math.max(ideal, (hub * (link.source.r + link.target.r + 20)) / (2 * Math.PI));
  }
  let alpha = 1;
  function tick() {
    for (let iteration = 0; iteration < 2; iteration += 1) {
      for (let i = 0; i < sim.length; i += 1) {
        for (let j = i + 1; j < sim.length; j += 1) {
          const a = sim[i];
          const b = sim[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let distance = Math.hypot(dx, dy);
          if (distance < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; distance = 0.01; }
          const force = ((ideal * ideal) / (distance * distance)) * 0.9;
          const fx = (dx / distance) * force;
          const fy = (dy / distance) * force;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;

          // Separação rígida: evita que os círculos e seus rótulos se sobreponham.
          const minimum = a.r + b.r + 16;
          if (distance < minimum) {
            const push = ((minimum - distance) / distance) * 0.5;
            const px = dx * push;
            const py = dy * push;
            if (!a.fixed) { a.x -= px; a.y -= py; }
            if (!b.fixed) { b.x += px; b.y += py; }
          }
        }
      }
      for (const link of links) {
        const dx = link.target.x - link.source.x;
        const dy = link.target.y - link.source.y;
        const distance = Math.hypot(dx, dy) || 0.01;
        const force = (distance - link.rest) * 0.12;
        const fx = (dx / distance) * force;
        const fy = (dy / distance) * force;
        link.source.vx += fx; link.source.vy += fy;
        link.target.vx -= fx; link.target.vy -= fy;
      }
      for (const item of sim) {
        item.vx += (width / 2 - item.x) * 0.008;
        item.vy += (height / 2 - item.y) * 0.008;
        if (item.fixed) { item.vx = 0; item.vy = 0; continue; }
        const speed = Math.hypot(item.vx, item.vy);
        const maxSpeed = 18 * alpha;
        if (speed > maxSpeed) { item.vx *= maxSpeed / speed; item.vy *= maxSpeed / speed; }
        item.x += item.vx * alpha;
        item.y += item.vy * alpha;
        item.vx *= 0.55;
        item.vy *= 0.55;
      }
    }
    alpha *= 0.985;
  }

  setupZoom(svg, viewport);

  // O layout é resolvido de uma vez, antes do primeiro desenho: requestAnimationFrame
  // é limitado em abas em segundo plano e a estabilização ficaria lenta demais.
  while (alpha > 0.02) tick();
  draw();
  svg.fitTo(sim, width, height);

  // O laço animado só volta a rodar enquanto o usuário arrasta algum nó.
  function step() {
    tick();
    draw();
    if (alpha < 0.02) {
      running.frame = 0;
      return;
    }
    running.frame = requestAnimationFrame(step);
  }

  // `running` identifica esta execução: um render posterior descarta a anterior.
  const running = {
    frame: 0,
    reheat: () => {
      if (simulation !== running) return;
      alpha = Math.max(alpha, 0.25);
      if (!running.frame) running.frame = requestAnimationFrame(step);
    },
  };
  simulation = running;
  svg.onclick = () => select(null);
  stage.insertAdjacentHTML("beforeend",
    `<div class="hint">arraste os nós · roda do mouse para zoom (aproxime para ver os rótulos) · clique para ver a evidência</div>`);
  const zoomBox = document.createElement("div");
  zoomBox.className = "zoom-controls";
  zoomBox.innerHTML = `<button title="Aproximar">+</button><button title="Afastar">−</button>
    <button title="Reenquadrar" style="padding:0 8px;font-size:12px">ajustar</button>`;
  const [zoomIn, zoomOut, fit] = zoomBox.querySelectorAll("button");
  zoomIn.onclick = (event) => { event.stopPropagation(); svg.zoomBy(1.25); };
  zoomOut.onclick = (event) => { event.stopPropagation(); svg.zoomBy(0.8); };
  fit.onclick = (event) => { event.stopPropagation(); svg.fitTo(sim, width, height); };
  stage.appendChild(zoomBox);
}

function nodeRadius(node) {
  if (node.type === "Case") return 16;
  if (node.count) return Math.min(26, 7 + Math.sqrt(node.count) * 3.4);
  return 9;
}

function enableDrag(group, item) {
  let dragging = false;
  group.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    dragging = true;
    item.fixed = true;
    group.setPointerCapture(event.pointerId);
  });
  group.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const point = group.ownerSVGElement.toLocalPoint(event.clientX, event.clientY);
    item.x = point.x;
    item.y = point.y;
    if (simulation) simulation.reheat();
  });
  const stop = (event) => {
    if (!dragging) return;
    dragging = false;
    item.fixed = false;
    group.releasePointerCapture(event.pointerId);
  };
  group.addEventListener("pointerup", stop);
  group.addEventListener("pointercancel", stop);
}

function setupZoom(svg, viewport) {
  const view = { x: 0, y: 0, k: 1 };
  const apply = () => {
    viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
    // Muito afastado os rótulos viram borrão: só as formas e as cores ficam.
    viewport.classList.toggle("no-labels", view.k < 0.72);
  };
  svg.toLocalPoint = (clientX, clientY) => {
    const box = svg.getBoundingClientRect();
    return { x: (clientX - box.left - view.x) / view.k, y: (clientY - box.top - view.y) / view.k };
  };
  const zoomAt = (mx, my, factor) => {
    const next = Math.max(0.15, Math.min(5, view.k * factor));
    const applied = next / view.k;
    view.x = mx - (mx - view.x) * applied;
    view.y = my - (my - view.y) * applied;
    view.k = next;
    apply();
  };
  svg.zoomBy = (factor) => {
    const box = svg.getBoundingClientRect();
    zoomAt(box.width / 2, box.height / 2, factor);
  };
  svg.fitTo = (sim, width, height) => {
    const xs = sim.map((item) => item.x);
    const ys = sim.map((item) => item.y);
    const pad = 110;  // sobra para os rótulos, que ficam mais largos que os nós
    const spanX = Math.max(...xs) - Math.min(...xs) + pad * 2;
    const spanY = Math.max(...ys) - Math.min(...ys) + pad * 2;
    view.k = Math.max(0.15, Math.min(width / spanX, height / spanY, 2.2));
    view.x = width / 2 - ((Math.min(...xs) + Math.max(...xs)) / 2) * view.k;
    view.y = height / 2 - ((Math.min(...ys) + Math.max(...ys)) / 2) * view.k;
    apply();
  };
  svg.addEventListener("wheel", (event) => {
    event.preventDefault();
    const box = svg.getBoundingClientRect();
    zoomAt(event.clientX - box.left, event.clientY - box.top, event.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  let panning = null;
  svg.addEventListener("pointerdown", (event) => {
    panning = { x: event.clientX - view.x, y: event.clientY - view.y };
    svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove", (event) => {
    if (!panning) return;
    view.x = event.clientX - panning.x;
    view.y = event.clientY - panning.y;
    apply();
  });
  const endPan = () => { panning = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", endPan);
  svg.addEventListener("pointerleave", endPan);
  apply();
}

/* ================= linha do tempo ================= */

function renderTimeline() {
  const stage = el("stage");
  stopSimulation();
  stage.className = "scrollable";
  stage.innerHTML = "";

  const events = visibleCaseGraph().nodes.filter((node) => node.type !== "Case");
  const beforeEdges = (edgesByCase.get(state.caseId) || []).filter((edge) => edge.relation === "BEFORE");
  const inBefore = new Set();
  for (const edge of beforeEdges) { inBefore.add(edge.source); inBefore.add(edge.target); }

  // Só entra na linha do tempo o que tem evidência temporal explícita ou aresta BEFORE.
  const placedIds = new Set(events
    .filter((node) => (node.attrs.time && node.attrs.time.length) || inBefore.has(node.id))
    .map((node) => node.id));
  const placed = events.filter((node) => placedIds.has(node.id));
  const unplaced = events.filter((node) => !placedIds.has(node.id));

  if (placed.length) {
    stage.appendChild(buildTimelineSvg(placed, beforeEdges.filter(
      (edge) => placedIds.has(edge.source) && placedIds.has(edge.target))));
  } else {
    stage.insertAdjacentHTML("beforeend",
      `<div class="tl-empty">Nenhuma evidência temporal foi extraída neste caso.</div>`);
  }

  if (unplaced.length) {
    const box = document.createElement("div");
    box.className = "unplaced";
    box.innerHTML = `<h3>Sem posição temporal definida (${unplaced.length})</h3>`;
    for (const type of EVENT_TYPES) {
      const group = unplaced.filter((node) => node.type === type);
      if (!group.length) continue;
      const row = document.createElement("div");
      row.className = "row";
      for (const node of group) {
        const pill = document.createElement("button");
        pill.className = "pill";
        pill.dataset.nodeId = node.id;
        pill.innerHTML = `<span class="dot" style="background:${TYPE_COLOR[type]}"></span>${escapeHtml(node.label)}`;
        pill.onclick = () => select({ kind: "node", id: node.id });
        row.appendChild(pill);
      }
      box.appendChild(row);
    }
    stage.appendChild(box);
  }
}

function buildTimelineSvg(events, beforeEdges) {
  const laneHeight = 84;
  const marginLeft = 130;
  const marginTop = 58;
  const columnWidth = 176;

  // Eixo horizontal: ordem de aparição no texto. Não é uma escala de dias.
  const order = [...new Set(events.map((node) => node.sentence_id))].sort((a, b) => a - b);
  const column = new Map(order.map((sentenceId, index) => [sentenceId, index]));
  const lanes = EVENT_TYPES.filter((type) => events.some((node) => node.type === type));
  const laneIndex = new Map(lanes.map((type, index) => [type, index]));

  const width = marginLeft + Math.max(order.length, 1) * columnWidth + 60;
  const svg = svgEl("svg", { width, style: "min-width:100%" });

  const defs = svgEl("defs");
  const marker = svgEl("marker", {
    id: "tl-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse",
  });
  marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#7c3aed" }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  const title = svgEl("text", { x: 16, y: 20, class: "tl-band-title" });
  title.textContent = "Ordem conhecida — o eixo horizontal é a posição no texto, não uma escala de dias";
  svg.appendChild(title);

  // Empilha eventos que caem na mesma célula (mesma frase e mesmo tipo).
  const used = new Map();
  const layout = new Map();
  for (const node of events) {
    const key = `${node.type}|${node.sentence_id}`;
    const slot = used.get(key) || 0;
    used.set(key, slot + 1);
    layout.set(node.id, {
      x: marginLeft + column.get(node.sentence_id) * columnWidth,
      y: marginTop + laneIndex.get(node.type) * laneHeight + 26 + slot * 30,
    });
  }
  const bottom = Math.max(...[...layout.values()].map((point) => point.y)) + 46;
  const height = Math.max(marginTop + lanes.length * laneHeight + 30, bottom);
  svg.setAttribute("height", height);

  for (const [sentenceId, index] of column) {
    const x = marginLeft + index * columnWidth;
    svg.appendChild(svgEl("line", { class: "tl-grid", x1: x, y1: marginTop - 6, x2: x, y2: height - 12 }));
    const label = svgEl("text", { x, y: marginTop - 14, class: "tl-lane", "text-anchor": "middle" });
    label.textContent = `frase ${sentenceId + 1}`;
    svg.appendChild(label);
  }
  for (const type of lanes) {
    const y = marginTop + laneIndex.get(type) * laneHeight + 30;
    const label = svgEl("text", { x: 16, y, class: "tl-lane", fill: TYPE_COLOR[type] });
    label.textContent = TYPE_LABEL[type];
    svg.appendChild(label);
  }

  const arcLayer = svgEl("g");
  const boxLayer = svgEl("g");
  svg.appendChild(arcLayer);
  svg.appendChild(boxLayer);

  for (const edge of beforeEdges) {
    const from = layout.get(edge.source);
    const to = layout.get(edge.target);
    if (!from || !to) continue;
    const lift = 26 + Math.abs(to.x - from.x) * 0.06;
    const top = Math.min(from.y, to.y) - 11 - lift;
    const path = svgEl("path", {
      class: "tl-arc",
      d: `M${from.x + 8},${from.y - 11} C${from.x + 8},${top} ${to.x - 8},${top} ${to.x - 8},${to.y - 11}`,
      "marker-end": "url(#tl-arrow)",
    });
    path.style.cursor = "pointer";
    path.onclick = () => select({ kind: "edge", id: edge.id });
    path.appendChild(svgEl("title")).textContent = `BEFORE — ${edge.attrs.time_expression || ""}`;
    arcLayer.appendChild(path);
    if (edge.attrs.time_expression) {
      const label = svgEl("text", {
        class: "tl-time", x: (from.x + to.x) / 2, y: top - 3, "text-anchor": "middle",
      });
      label.textContent = edge.attrs.time_expression;
      arcLayer.appendChild(label);
    }
  }

  for (const node of events) {
    const point = layout.get(node.id);
    const color = TYPE_COLOR[node.type];
    const text = truncate(node.label, 20);
    const boxWidth = Math.max(52, text.length * 6.7 + 20);
    const group = svgEl("g", { class: "tl-box", transform: `translate(${point.x},${point.y})` });
    group.dataset.nodeId = node.id;
    const rect = svgEl("rect", {
      x: -boxWidth / 2 + 8, y: -11, width: boxWidth, height: 22, rx: 11,
      fill: "#fff", stroke: color, "stroke-width": 1.5,
    });
    if (node.attrs.assertion && node.attrs.assertion !== "affirmed") {
      rect.setAttribute("stroke-dasharray", "3 2");
    }
    group.appendChild(rect);
    const label = svgEl("text", { x: 8, y: 4, "text-anchor": "middle", fill: color });
    label.textContent = text;
    group.appendChild(label);
    if (node.attrs.time && node.attrs.time.length) {
      const time = svgEl("text", { x: 8, y: 24, "text-anchor": "middle", class: "tl-time" });
      time.textContent = `⏱ ${truncate(node.attrs.time.join(" · "), 26)}`;
      group.appendChild(time);
    }
    group.appendChild(svgEl("title")).textContent = node.evidence;
    group.onclick = () => select({ kind: "node", id: node.id });
    boxLayer.appendChild(group);
  }
  return svg;
}

/* ================= texto do caso ================= */

function renderText() {
  const stage = el("stage");
  stopSimulation();
  stage.className = "";
  stage.innerHTML = "";
  const item = caseById.get(state.caseId);
  if (!item) return;

  const spans = (nodesByCase.get(state.caseId) || [])
    .filter((node) => node.start !== null && state.types.has(node.type))
    .sort((a, b) => a.start - b.start);

  let html = "";
  let cursor = 0;
  for (const node of spans) {
    if (node.start < cursor) continue;
    html += escapeHtml(item.text.slice(cursor, node.start));
    const uncertain = node.attrs.assertion && node.attrs.assertion !== "affirmed";
    html += `<mark data-node-id="${node.id}" class="${uncertain ? "suspected" : ""}"` +
      ` style="color:${TYPE_COLOR[node.type]}"` +
      ` title="${TYPE_LABEL[node.type]}: ${escapeHtml(node.label)}` +
      `${uncertain ? ` (${node.attrs.assertion})` : ""}">` +
      `${escapeHtml(item.text.slice(node.start, node.end))}</mark>`;
    cursor = node.end;
  }
  html += escapeHtml(item.text.slice(cursor));

  const view = document.createElement("div");
  view.id = "textView";
  view.innerHTML = `<div class="text-card">
    <h2>${escapeHtml(item.title || item.case_id)}</h2>
    <div class="meta">${escapeHtml(item.case_id)} · artigo ${escapeHtml(item.article_id)}${
      item.age ? ` · ${escapeHtml(item.age)} anos` : ""}${
      item.gender ? ` · ${escapeHtml(item.gender)}` : ""} · ${spans.length} menções destacadas</div>
    <div class="case-body">${html}</div>
  </div>`;
  view.querySelectorAll("mark").forEach((mark) => {
    mark.onclick = () => select({ kind: "node", id: mark.dataset.nodeId });
  });
  stage.appendChild(view);
}

/* ================= seleção e painel de detalhes ================= */

function select(selection) {
  state.selected = selection;
  applyHighlight();
  renderDetails();
}

function applyHighlight() {
  const selectedId = state.selected && state.selected.kind === "node" ? state.selected.id : null;

  document.querySelectorAll("#stage mark").forEach((mark) => {
    mark.classList.toggle("marksel", mark.dataset.nodeId === selectedId);
  });
  document.querySelectorAll("#stage .pill").forEach((pill) => {
    pill.classList.toggle("sel-pill", pill.dataset.nodeId === selectedId);
  });
  document.querySelectorAll("#stage .tl-box").forEach((box) => {
    box.querySelector("rect").setAttribute("stroke-width", box.dataset.nodeId === selectedId ? 3 : 1.5);
  });

  const groups = document.querySelectorAll("#stage .node-group");
  if (!groups.length) return;
  const graph = currentGraph();
  const edgePool = isOverview() ? DATA.overview.edges : (edgesByCase.get(state.caseId) || []);
  const neighbours = new Set(selectedId ? [selectedId] : []);
  if (selectedId) {
    for (const edge of edgePool) {
      if (edge.source === selectedId) neighbours.add(edge.target);
      if (edge.target === selectedId) neighbours.add(edge.source);
    }
  }

  graph.nodes.forEach((node, index) => {
    const group = groups[index];
    if (!group) return;
    group.classList.toggle("dim", Boolean(selectedId) && !neighbours.has(node.id));
    group.querySelector(".node-shape").classList.toggle("sel", node.id === selectedId);
  });
  const links = document.querySelectorAll("#stage .link");
  graph.edges.forEach((edge, index) => {
    const link = links[index];
    if (!link) return;
    link.classList.toggle("dim",
      Boolean(selectedId) && edge.source !== selectedId && edge.target !== selectedId);
  });
}

function highlightEvidence(sentence, mention) {
  if (!sentence) return "";
  const at = mention ? sentence.toLowerCase().indexOf(mention.toLowerCase()) : -1;
  if (at < 0) return escapeHtml(sentence);
  return escapeHtml(sentence.slice(0, at)) +
    `<b>${escapeHtml(sentence.slice(at, at + mention.length))}</b>` +
    escapeHtml(sentence.slice(at + mention.length));
}

const ATTR_LABEL = {
  assertion: "Asserção", source: "Origem", time: "Expressões temporais",
  dose: "Doses", measurements: "Medidas", trigger: "Gatilho", method: "Método",
  time_expression: "Expressão temporal", article_id: "Artigo",
  age: "Idade", gender: "Sexo", title: "Título",
};

function attrRows(attrs) {
  return Object.entries(attrs || {}).map(([key, value]) => {
    const text = Array.isArray(value) ? value.join(" · ") : String(value);
    return `<dt>${ATTR_LABEL[key] || key}</dt><dd>${escapeHtml(text)}</dd>`;
  }).join("");
}

function renderDetails() {
  const panel = el("detail");
  if (!state.selected) {
    panel.innerHTML = `<div class="placeholder">Selecione um nó ou uma aresta para ver a evidência textual.</div>`;
    return;
  }

  if (state.selected.kind === "edge") {
    const edge = edgeById.get(state.selected.id) || overviewEdgeById.get(state.selected.id);
    if (!edge) { panel.innerHTML = ""; return; }
    const source = lookupNode(edge.source);
    const target = lookupNode(edge.target);
    panel.innerHTML = `
      <span class="badge" style="background:${edge.relation === "BEFORE" ? "#7c3aed" : "#64748b"}">
        ${edge.relation}</span>
      <h2>${escapeHtml(source ? source.label : edge.source)} →
        ${escapeHtml(target ? target.label : edge.target)}</h2>
      <dl class="kv">${attrRows(edge.attrs)}${
        edge.weight ? `<dt>Ocorrências</dt><dd>${edge.weight} casos</dd>` : ""}</dl>
      ${edge.evidence ? `<span class="rel-name">EVIDÊNCIA</span>
        <div class="evidence">${escapeHtml(edge.evidence)}</div>` : ""}
      <div style="margin-top:12px;display:flex;gap:6px">
        ${source ? `<button class="pill" data-goto="${source.id}">← origem</button>` : ""}
        ${target ? `<button class="pill" data-goto="${target.id}">destino →</button>` : ""}
      </div>`;
    bindPanelActions(panel);
    return;
  }

  const node = lookupNode(state.selected.id);
  if (!node) { panel.innerHTML = ""; return; }
  const color = TYPE_COLOR[node.type];

  if (node.aggregate) {
    panel.innerHTML = `
      <span class="badge" style="background:${color}">${TYPE_LABEL[node.type]}</span>
      <h2>${escapeHtml(node.label)}</h2>
      <dl class="kv"><dt>Ocorrências</dt>
        <dd>${node.count} menções em ${node.cases.length} casos</dd></dl>
      <span class="rel-name">CASOS</span>
      <ul class="rel-list">${node.cases.map((caseId) =>
        `<li><button data-case="${caseId}">${escapeHtml(caseId)}</button></li>`).join("")}</ul>`;
    bindPanelActions(panel);
    return;
  }

  const incident = (edgesByCase.get(node.case_id) || []).filter(
    (edge) => edge.source === node.id || edge.target === node.id);

  panel.innerHTML = `
    <span class="badge" style="background:${color}">${TYPE_LABEL[node.type]}</span>
    <h2>${escapeHtml(node.label)}</h2>
    <dl class="kv">
      ${node.mention && node.mention.toLowerCase() !== node.label.toLowerCase()
        ? `<dt>Menção no texto</dt><dd>“${escapeHtml(node.mention)}”</dd>` : ""}
      ${node.sentence_id !== null ? `<dt>Frase</dt><dd>${node.sentence_id + 1}</dd>` : ""}
      ${attrRows(node.attrs)}
    </dl>
    ${node.evidence ? `<span class="rel-name">EVIDÊNCIA</span>
      <div class="evidence">${highlightEvidence(node.evidence, node.mention)}</div>` : ""}
    ${incident.length ? `<hr><span class="rel-name">RELAÇÕES (${incident.length})</span>
      <ul class="rel-list">${incident.map((edge) => {
        const other = nodeById.get(edge.source === node.id ? edge.target : edge.source);
        const arrow = edge.source === node.id ? "→" : "←";
        return `<li><button data-edge="${edge.id}"><span class="rel-name">${edge.relation}</span>
          ${arrow} ${escapeHtml(other ? other.label : "?")}</button></li>`;
      }).join("")}</ul>` : ""}`;
  bindPanelActions(panel);
}

function bindPanelActions(panel) {
  panel.querySelectorAll("[data-goto]").forEach((button) => {
    button.onclick = () => select({ kind: "node", id: button.dataset.goto });
  });
  panel.querySelectorAll("[data-edge]").forEach((button) => {
    button.onclick = () => select({ kind: "edge", id: button.dataset.edge });
  });
  panel.querySelectorAll("[data-case]").forEach((button) => {
    button.onclick = () => selectCase(button.dataset.case);
  });
}

/* ================= orquestração ================= */

function renderStage() {
  if (state.view === "graph") renderGraph();
  else if (state.view === "timeline") renderTimeline();
  else renderText();
  applyHighlight();
}

function renderAll() {
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.classList.toggle("active", tab.dataset.view === state.view);
    tab.disabled = isOverview() && tab.dataset.view !== "graph";
    tab.style.opacity = tab.disabled ? 0.35 : 1;
  });
  renderFilters();
  renderStage();
  renderDetails();
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.onclick = () => {
    state.view = tab.dataset.view;
    renderAll();
  };
});
el("caseSearch").oninput = (event) => {
  state.search = event.target.value.trim();
  renderCaseList();
};
let resizeTimer = null;
window.addEventListener("resize", () => {
  if (state.view !== "graph") return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderStage, 200);
});

renderStats();
renderCaseList();
renderAll();
</script>
</body>
</html>
