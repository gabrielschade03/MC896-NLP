al information database for digital PBL-CBL method. In fifteen cases, 3D printed titanium meshes were fabricated for guided bone regeneration. Four patients received onlay bone block grafting under the assistance of 3D printed surgical guide. Eighteen patients underwent second bone augmentation simultaneously with dental implant placement at T2. Six patients received connective tissue grafting before soft tissue conditioning. These cases can cover all the techniques and theoretical knowledge in courses of esthetic implant therapy. A case of guided bone regeneration under the guidance of 3D printed titanium mesh was displayed below to show the digital workflow in detail.\r\nThe patient was a 26-year-old female patient who had #23 tooth extracted 5 years ago. A clinical exam revealed good oral hygiene and a normal smile line (Figs. 1A, 1B and 1C). The frontal and occlusal view of the residual ridge displayed a severely collapsed contour and gingival recession at #24 tooth (Figs. 1B and 1C). The preoperative CBCT reveals a severely vertical and horizontal bone defect with a bladed alveolar crest (Fig. 1D).","counts":{"Case":1}},{"case_id":"PMC11131390_01","article_id":"PMC11131390","title":"Quitting smoking as a probable trigger for new-onset hypothyroidism after successful medical treatment of Graves' disease: case report","age":"","gender":"Male","text":"A retired male patient - 64 years of age and a heavy smoker - presented in May 2015 with a complaint of weight loss despite good appetite. He was ordered thyroid function tests revealing mild overt hyperthyroidism: TSH = 0.01 microIU/L (Normal 0.27-4.2 microIU/L), free T4 = 3.7 ng/dL (Normal 0.93-1.7 ng/dL), and free T3 = 10.9 (Normal 2.0-4.4 pg/mL). He had no goiter and no evidence of thyroid eye disease. Serological investigations were consistent with a diagnosis of GD: TRAbs = 16.3 IU/L (Normal <1.75 IU/L), TPO antibodies = 268 (Normal <34 IU/mL), and thyroglobulin (Tg) antibodies = 1731 (Normal <115 IU/mL). The patient was counseled about the nature of GD, about the benefits of quitting smoking, and he was offered medical treatment in the form of carbimazole (CBZ) 20 mg/day, given that methimazole is not available in Egypt. The dose of CBZ was then titrated against his laboratory results, to achieve low normal free T4 and free T3, and he maintained euthyroid on a dose of 5 mg/day for a period of 15 months (February 2016-May 2017). In July 2017, CBZ was discontinued after having a TSH result of 22 microIU/L while being on a dose of 2.5 mg/day for 2 months. Celebrating the discontinuation of treatment after more than 2 years of treatment, the patient decided to quit smoking and comply with the repeated advice of quitting smoking that was offered to the patient in almost every follow-up visit. The first follow-up off CBZ in August 2017, the patient was euthyroid with TSH = 3.3 microIU/L, free T4 = 1.17 ng/dL, and TRAbs was 3.3 IU/L. In November 2017, 4 months after stopping CBZ, the patient presented with 4 kg weight gain (67-71 kg) and severe biochemical hypothyroidism, TSH = 73.5 microIU/L and free T4 = 0.35 ng/dL, which was repeatedly confirmed, TSH = 48.9 microIU/L and free T4 = 0.66 ng/dL (Figure 1). Considering the patient age (66 years) and body weight (71 kg), the patient was started on replacement therapy in the form of levothyroxine 75 microg/day (calculated as 1.1 microg/kg/day), and the dose was later titrated to achieve a target TSH of 0.3-3 microIU/L, which was finally achieved using 100 microg/day, and this target was maintained for 45 months (July 2019-April 2023). TRAbs were measured in November 2021, and it was negative at <0.8 IU/L. The coincidence of quitting smoking in July 2017 and the spontaneous development of overt hypothyroidism in November 2017, only 4 months later, urged us to search for a possible link between quitting smoking and new onset hypothyroidism in patients with treated GD.","counts":{"Case":1,"Symptom":2,"Exam":2,"Condition":7,"Treatment":6}},{"case_id":"PMC11259348_01","article_id":"PMC11259348","title":"A method for selecting P antigen-negative red cell units for patients with paroxysmal cold hemoglobinuria","age":"","gender":"Female","text":"A child admitted with fever, loose stools, and dark color urine was diagnosed with PCH after having positive Donath-Landsteiner test. Since hemoglobin level was 4 g/dL, three blood units was ordered. Her blood group was A Rh D-positive and antibody screening was negative. The patient was transfused with group-specific cross-match-compatible blood in three occasions using a blood warmer. Following each blood transfusion, she developed episodes of hemoglobinuria.","counts":{"Case":1,"Symptom":1,"Exam":1,"Treatment":1}},{"case_id":"PMC11259348_02","article_id":"PMC11259348","title":"A method for selecting P antigen-negative red cell units for patients with paroxysmal cold hemoglobinuria","age":"","gender":"Unknown","text":"Transfusion reaction investigations excluded the presence of erythrocyte alloantibodies and ABO incompatibility of the patient with transfused units. Therefore, the exacerbations of hemolysis following blood transfusions were considered as triggered by Donath-Landsteiner antibody present in the patient's serum. P antigen-negative red cell transfusion is an option for such situations to avoid further hemolysis. However, with the absence of specific antisera and molecular typing methods, selecting this type of blood unit was a challenge.\r\nIn Donath-Landsteiner test, Donath-Landsteiner antigen (probably P specificity)-positive red cells are hemolyzed by Donath-Landsteiner antibody in the patient's serum. The hemolysis is detected in the supernatant compared to the color of the patient's serum. I tried to apply the same principle to test the P antigen status of donor red cell packs. When a set of group-specific donor red cell suspensions are mixed in 1:9 ratio with the patient's serum (containing Donath-Landsteiner antibody) and incubated at 0 C followed by 37 C, supernatant of the tubes containing P-positive red cells should appear darker than the patient's serum due to the hemolysis. Necessarily, the tubes without a color change following incubation need to carry P-negative red cells.\r\nIdeally, positive and negative controls should be run in parallel to the test using P-positive and P-negative red cells against the Donath-Landsteiner antibody-positive serum. Since P-negative red cells were not available, only test control was performed as follows. In positive control, P-positive red cells are mixed in 1:9 ratio with the patient's serum expecting hemolysis and a color change of the supernatant following antigen-antibody reaction. In negative control tube, P-positive cells are reacted with fresh serum of a healthy person with the same blood group. Its supernatant color should be similar to the patient's serum. P-positive red cells can be prepared by pooling three randomly selected group-specific blood units.\r\nProcedure was performed as follows.\r\nGroup A-positive ten blood packs were selected, and 50% red cell suspensions were made from each (P1, P2, P3,...)\r\nTen clean test tubes were taken and labeled (T1-T10)\r\nOne volume of P1 cell suspension was added to T1 test tube and followed the same procedure for the rest of cell suspensions (e.g., from P2 to T2, P3 to T3,...)\r\nThen, nine volumes of 37 C separated patient's serum was added to each T1-T10 tubes\r\nPositive control - Nine volumes of 37 C separated patient's serum was added to one volume of 50% cell suspension prepared from pooling three group A blood units\r\nNegative control - Nine volumes of 37 C separated fresh serum of a group A healthy person was added to one volume of 50% cell suspension prepared from pooling three group A blood units\r\nT1-T10 and control tubes were incubated at 0 C in crushed ice for 1 h and then immediately transferred to water bath at 37 C. After 30 min incubation period, all tubes were centrifuged under low spin for 15 s, and the supernatants were inspected compared to the patient's serum color.\r\nThe supernatant color of the positive control was darker compared to the patient's serum, while in the negative control, color was similar to the patient's serum\r\nEnhanced hemolysis was evident in nine out of ten testing samples. Supernatant of the tenth tube did not show color change compared to the patient's serum, indicating the negativity for P antigen in the red cells of that specific donor\r\nWhole test was repeated, and the results were confirmed.","counts":{"Case":1,"Condition":6,"Treatment":1,"Exam":1}},{"case_id":"PMC11345641_01","article_id":"PMC11345641","title":"Intraperitoneal spread in uterine sarcoma following unprotected laparoscopic transvaginal uterine morcellation: a case report and literature review","age":"48.0","gender":"Female","text":"In December 2021, a 48-year-old woman was admitted to our center for a pelvic mass initially identified seven years earlier by transabdominal ultrasonography, which suggested a leiomyoma. Over the last three years, her menstrual cycles have lengthened, and her flow has increased. She has experienced abdominal pain and noticeable abdominal enlargement over the past five months. Following her hospitalization, a comprehensive preoperative evaluation was conducted. All serum tumor markers, including carbohydrate antigen 12-5 (CA12-5), CA19-9, alpha-fetoprotein (AFP), human epididymis protein 4 (HE4), and carcinoembryonic antigen (CEA), were within normal limits. However, her serum lactate dehydrogenase (LDH) level was elevated to 289U/L. Ultrasonography identified a heterogeneously echogenic mass in the anterior wall of the uterus measuring 12.6x12.0x8.4cm with a regular outline and clear boundaries, consistent with a uterine fibroid. It also revealed endometrial thickening to 15mm. MRI imaging displayed two quasi-circular masses within the uterine muscle wall; the larger was located in the anterior wall, measuring approximately 9.9x12.0x12.6cm, with 80% protruding into the subserosal area. The MRI suggested degeneration of the leiomyomas, possibly indicating a cellular leiomyoma ( Figure 1 ). An endometrial biopsy was performed, which indicated a secretory-responsive endometrium.\r\nOn December 14, 2021, we performed a total laparoscopic hysterectomy and bilateral salpingectomy on a patient. During surgery, the uterus resembled that of a five-month pregnancy in size and was irregularly shaped with multiple fibroids, the largest being 12 cm in diameter on the anterior wall. The uterus was removed transvaginally without protective measures. The general picture is as follows ( Figure 2 ). Microscopic examination post-surgery revealed the mass to be a leiomyoma, with most areas infarcted and some showing bizarre nuclei and rare mitotic figures (0-1/10 HPF) ( Figure 3 ). The patient was advised of the need for close follow-up. A month post-operation, transabdominal ultrasonography showed no abnormalities. However, four months later, she developed abdominal distension. Repeat ultrasonography identified several heterogeneous masses of varying sizes in the right pelvic and abdominal regions, the largest measuring 12.5x11.8x7.8 cm. Further MRI revealed multiple abnormal signal shadows involving the vaginal stump, right lower quadrant, omentum, mesentery, intestinal space, pelvic cavity, and areas near the common iliac vessel bifurcation and rectum. A lesion in the right lower quadrant had penetrated the right transversus abdominis muscle, reaching the subcutaneous fat ( Figure 4 ). Serum CA12-5 and LDH levels were elevated to 46.4 U/mL and 340 U/L, respectively, while other markers remained normal. Physical examination revealed significant abdominal distention with a large, palpable mass extending three fingers above the umbilicus and showing limited mobility. A firm, cystic mass approximately 5 cm in diameter was palpable at the vaginal stump, although the vaginal mucosa was intact.\r\nOn April 29, 2022, we performed an exploratory laparotomy, including resections of pelvic, abdominal, and mesenteric tumors, and a palliative resection of the right colon tumor. During surgery, we identified a 20 cm tumor in the abdominal cavity, covered by the greater omentum and prone to bleeding, with complex, primarily mucous internal tissue. The tumor encased parts of the ascending and transverse colon, as well as the ileum, and extended through the right peritoneum to the right rectus abdominis muscle. Additional tumors up to 3 cm in diameter were found on the small intestine and descending colon, and larger tumors up to 7 cm were present in the pelvis. Enlarged retroperitoneal lymph nodes were noted, the largest measuring 4 cm. The bilateral ovaries were not visible. We advised the patient's family of the challenging intraoperative conditions and the impossibility of complete cytoreductive surgery, recommending a palliative approach instead. They consented to this plan. Microscopic analysis confirmed undifferentiated sarcomas in the abdominal and pelvic masses, with tumor involvement noted in the right colon, part of the ileum, mesentery and its lymph nodes, omentum, and appendix ( Figure 5 ). Postoperatively, the patient experienced pleural effusion, right hydronephrosis, and poor incision healing. After symptomatic treatment, her condition improved. Considering her overall status, we recommended follow-up chemotherapy. However, the patient chose to discontinue treatment for personal reasons and was discharged, resulting in unsuccessful follow-up.","counts":{"Case":1,"Exam":9,"Symptom":2,"Treatment":1}},{"case_id":"PMC11420039_01","article_id":"PMC11420039","title":"Case report: Bullous pemphigoid combined with Sjögren's syndrome complicated by central nervous system infection","age":"74.0","gender":"Female","text":"A 74-year-old woman presented with widespread erythematous patches and vesicles on the limbs, which had appeared successively over a period of 2 weeks, and had previously been diagnosed as \"eczema\" at another hospital. Treatment with acyclovir cream was ineffective. Two days before admission, the patient's condition worsened, prompting a visit to our dermatology department. On admission, the patient exhibited erythematous papules, pustules ( Figure 1 ), particularly severe on the buttocks and both lower limbs, which were ulcerated with yellowish crusts. The total area of skin lesions was approximately 1000 cm2, with an exudation area of approximately 200 cm2 ( Figures 2A, B ). The patient had no past medical history, no history of allergies, no history of medication use, and no history of exposure to harmful substances. Laboratory investigations did not reveal any significant abnormalities. For a definitive diagnosis, direct immunofluorescence (DIF) was performed on the skin lesions, showing linear deposits of IgG along the dermoepidermal junction, histological features consistent with HE staining, and significant infiltration of eosinophils ( Figures 3A, B ). Serum anti-bp180 antibody testing was positive, confirming a diagnosis of BP. The patient was treated with methylprednisolone 40 mg orally per day, which was adjusted to methylprednisolone tablets orally after one week, with a dose of 20 mg in the morning and 16 mg in the evening. The patient's overall skin condition significantly improved, and she was discharged after two weeks. The dosage of methylprednisolone tablets was gradually reduced after discharge.\r\nTwo months later, the patient developed a small number of new skin lesions throughout her body, prompting readmission to our dermatology department. The methylprednisolone dosage was adjusted to 16 mg in the morning and 12 mg in the evening, and dupilumab injection was added. Dupilumab was administered subcutaneously, with an initial dose of 600 mg (300 mg injected twice), followed by 300 mg every two weeks. Following treatment, the skin lesions partially crusted over. The patient was discharged after a week of hospitalization and continued to take methylprednisolone tablets orally at the original dosage regimen, with regular subcutaneous injections of dupilumab.\r\nHowever, one month later, the patient developed symptoms of fatigue and dyspnea, leading to admission to our cardiology department. The patient's symptoms worsened gradually, eventually resulting in respiratory failure, necessitating transfer to the intensive care unit. Chest CT revealed patchy changes ( Figure 4 ), while head CT and MRI showed no significant abnormalities ( Figures 5 ). High-throughput pathogenic microorganism sequencing in peripheral blood (Next Generation Sequencing, NGS) suggested the presence of human herpesvirus 3 (VZV), human herpesvirus 5 (CMV), human herpesvirus 1 (HSV1), and human herpesvirus 4 (EBV), with viral sequence counts exceeding 100,000 ( Table 1 ). Therefore, the patient was diagnosed with viral septicemia and treated with acyclovir for antiviral therapy. Since no new skin rash was observed in this instance and considering the severely compromised immune status due to severe infection, the methylprednisolone dosage was reduced to 4 mg, and intravenous immunoglobulin was added to boost immunity after consultation with the dermatology department. However, the patient's autoimmune antibody spectrum indicated positive anti-recombinant RO-52 antibodies, anti-nuclear antibodies, and anti-SSA antibodies ( Table 2 ). Further inquiry into the medical history revealed noticeable symptoms of dry eyes and dry mouth reported by the patient's family over the past two months. To confirm the diagnosis, a Schirmer test showed a positive result. According to diagnostic criteria established by Vitali C, the patient was diagnosed with Secondary Sjogren's Syndrome. Meanwhile, during the course of the illness, the patient gradually developed a decreased level of consciousness. Initial head MRI showed no significant changes. Subsequent lumbar puncture revealed Enterococcus and human herpesvirus 7 in the cerebrospinal fluid. Considering that the patient suffered from severe immunosuppression, with reactivation of several herpesviruses in plasma, before having a microbial CNS infection and succumbing to lung infection. We prescribed broad-spectrum antimicrobial therapy with meropenem, linezolid, and acyclovir. Human immunoglobulin was administered intravenously at a dose of 20 g once daily for 5 consecutive days. Additionally, thymosin alpha-1 was used to boost T cells and the overall immune system, with a daily subcutaneous injection of 1.6 mg for 1 week. During this period, the patient's immune function improved compared to before ( Table 3 ). After active treatment, the patient's condition improved, and she was transferred out of the ICU, but her consciousness level remained incomplete, characterized by the ability to open eyes spontaneously but inability to follow commands. Upon follow-up two months later, the patient succumbed to complications from severe secondary pulmonary infection.","counts":{"Case":1,"Treatment":17,"Symptom":5,"Condition":3,"Exam":5}},{"case_id":"PMC11723754_01","article_id":"PMC11723754","title":"Role of Low-Cost Negative Pressure Dressing in the Management of Sacral Pressure Injuries and its Impact on Functional Recovery in Neuro-rehabilitation: A Retrospective Case Series","age":"0.0","gender":"Male","text":"Seven-month-old elsewhere operated case of traumatic spinal cord injury (cause: fall from height) with neurogenic bowel and bladder with Grade III pressure injury over sacral region. Sensory level T10, motor level T10, NLI: T10. AIS grade A.\r\nDimensions of Grade III PIs over sacral region: 7cmx3cm. Daily cleaning and dressing of the wounds were done under aseptic conditions. During the course of his hospitalisation, three weeks post admission, the patient developed a fall in blood pressure along with increased respiratory rate. The condition of the patient was assessed and fluid resuscitation was started in the ward itself. There was no improvement in his BP despite fluid resuscitation, due to which inotropic drugs were started to maintain BP and to prevent multiple organ dysfunction syndrome (MODS). Renal function tests showed deranged electrolytes and raised creatinine. The patient was assessed and qSOFA was calculated as two. The patient was transferred to the ICU for further care and was diagnosed with septicaemia with septic shock. He underwent PRBC transfusion in view of low Hb 7g/dl. Patient was treated aggressively with fluid resuscitation, with strict input output monitoring, inotropic Noradrenaline. On day 3, inotrope support was weaned off, his condition improved and he was stable. Appropriate antibiotic medication was administered as per sensitivity reports after calculating creatinine clearance. After stabilisation in ICU, he was then managed in the PMR ward during which renal and liver function tests normalised, total count decreased, blood and urine cultures were sterile. NPD was applied over his sacral PI following which considerable improvement was noted which has been shown in Figure 7. Standing with support in walking frame, strengthening exercises were taught to the patient. Patient was discharged with stable vitals, healthy pressure injuries having granulation tissue and a decreased surface area. Patient was given bilateral hip knee ankle foot orthosis (HKAFO) for therapeutic standing and home-based neurorehabilitation program.","counts":{"Case":1,"Condition":1,"Treatment":2}},{"case_id":"PMC11783470_01","article_id":"PMC11783470","title":"Successful Endoscopic Management of Oxyntic Gland Adenoma: A Case Report","age":"22.0","gender":"Female","text":"We are presenting a 22-year-old woman with IDA. Patient denied menorrhagia or family history of gastrointestinal malignancy. She denied dysphagia, odynophagia, heartburn, nausea, vomiting, abdominal pain, altered bowel habits, melena, hematochezia, and unintentional weight loss. Vitals signs were normal. Physical examination was unrevealing with the exception of mild conjunctival pallor. Laboratory data: hemoglobin 11.5 g/dL, transferrin saturation 12.8%, ferritin 200 ng/mL, and iron 76 mcg/dL.\r\nDespite the normal ferritin level, the low transferrin saturation <20% was in favor of iron deficiency and the patient underwent esophagogastroduodenoscopy (EGD) and colonoscopy at a different institution for evaluation of IDA. A 7-mm fundic lesion was identified during EGD; the lesion was biopsied and 2 hemostatic clips were placed due to oozing at the biopsy site (Image 1). Biopsy of the gastric lesion demonstrated well-circumscribed proliferation of chief cells arranged in small, tight tubules, consistent with an OGA. Of note, duodenal biopsies did not show features of celiac disease, and ileocolonoscopy did not identify any bleeding source. Following the identification of the OGA, the patient was referred for endoscopic removal. Patient underwent repeat EGD and endoscopic resection was performed successfully. The excised specimen was consistent with the known diagnosis of OGA (Image 2). Given the absence of menorrhagia and negative bidirectional endoscopy, the patient was advised to follow up at the gastroenterology clinic and discuss video capsule endoscopy to exclude small intestinal causes of anemia. Patient underwent repeat EGD after 3 months, and no evidence of recurrence of the OGA was found.","counts":{"Case":1,"Symptom":2,"Exam":9,"Condition":1}},{"case_id":"PMC12215201_01","article_id":"PMC12215201","title":"Hepatic Angiosarcoma Presenting as Ascites: Case Report of a Rare yet Lethal Disease","age":"56.0","gender":"Male","text":"A 56-year-old Puerto Rican male with no past medical history originally presented to the emergency department with complaints of 2 months of fatigue, swollen abdomen, decreased appetite, and weight loss. He also endorsed pain in his abdomen, which prompted him to seek medical attention. The patient never sought any medical care before this and had no prior similar episodes. His social history was negative for alcohol consumption, smoking tobacco, or use of any intravenous recreational drugs. He used to work as a landscaper at a construction company. His family history was noncontributory.\r\nOn initial assessment, the patient was afebrile, hemodynamically stable, and in no acute distress. Physical examination revealed a diffusely tender and distended abdomen with shifting dullness indicative of ascites. Laboratory results showed hemoglobin 6.1 g/dL, platelet count 63 x 103/mm3, total bilirubin 3.2 mg/dL, alkaline phosphatase 315 IU/L, AST 305 IU/L, ALT 209 IU/L, and albumin 2.6 g/dL. An abdominal ultrasound performed showed multiple solid masses in the liver, the most extensive one measuring 2.5 x 2.7 x 2.1 cm. The spleen was enlarged and infiltrated with various masses, with very little healthy tissue and at least one discrete mass measuring 4.1 x 3.8 x 4.6 cm. He also underwent CT of the abdomen and pelvis with intravenous contrast, which exhibited multiple hypodense lesions in the liver and spleen with the peripheral enhancement of the contrast (Fig. 1) suggestive of metastatic lesions. There was also evidence of involvement of the lung, bilateral kidney, and bones with massive abdominopelvic ascites extending into the presacral region and bilateral pleural effusions.\r\nThe patient received packed red blood cells and platelets for worsening anemia and thrombocytopenia, respectively, during his hospital stay. The patient underwent paracentesis twice with removal of 5.2 L and 6.1 L bloody ascitic fluid. The ascitic fluid protein was 1 g/dL and 2 g/dL with serum ascitic albumin gradient (SAAG) of 1 g/dL and 1.1 g/dL, respectively, indicating exudative ascites. The fluid analysis showed a PMN count >250 with cytology negative for malignant cells. To find the possible primary, a colonoscopy was performed, which was normal. Esophagogastroduodenoscopy demonstrated multiple erythematous nodular lesions in the gastric body (Fig. 2) and duodenum (Fig. 3). However, biopsies from the lesions were inconclusive. Video capsule endoscopy showed numerous metastatic lesions seen throughout the stomach and small bowel. The patient received more platelet transfusions for worsening thrombocytopenia. The patient underwent liver biopsy, which showed small aggregates of anastomosing vascular channels with highly atypical cells suggestive of angiosarcoma (Fig. 4). Tumor cells were positive for CD-34 (Fig. 5) and focally positive for factor VIII (Fig. 6). The patient underwent Pleurx catheter placement for palliative support. He continued to have worsening sanguineous drainage from the catheter. Unfortunately, the patient developed disseminated intravascular coagulation as a complication and suffered a cardiac arrest 2 weeks later following which he could not be revived.","counts":{"Case":1,"Symptom":7,"Exam":7,"Treatment":2,"Condition":4}},{"case_id":"PMC12832199_01","article_id":"PMC12832199","title":"Laparoscopic Sugarbaker Repair of Parastomal Hernia with Gastric Incarceration: A Case Report and Review of the Literature","age":"57.0","gender":"Female","text":"A 57-year-old female with obesity presented to our emergency department with upper abdominal pain and vomiting. She had experienced multiple episodes of vomiting over the preceding 2 days and was unable to maintain adequate oral intake.\r\nShe had a significant medical history of Buerger's disease, which resulted in bilateral below-knee amputations, central adrenal insufficiency managed with corticosteroids, and multiple abdominal surgeries. Three years earlier, she underwent a left hemicolectomy with transverse colostomy for ischemic colitis. Since then, she experienced recurrent stoma prolapse, which required colonic resections and stoma revisions at 1 year and 3 months prior to presentation (Fig. 1).\r\nOn arrival, the abdomen around the stoma was distended with mild tenderness. She was dehydrated and hypoxemic because of aspiration pneumonia. Laboratory investigations revealed leukocytosis (white blood cell count, 26000/muL), anemia (hemoglobin, 9.6 g/dL), hypoalbuminemia (2.8 g/dL), and acute kidney injury (creatinine, 2.2 mg/dL). CT revealed marked gastric distention secondary to incarceration within the parastomal hernial sac, with evidence of gastric outlet obstruction (Fig. 2). The hernial orifice measured 6.5 cm in the craniocaudal direction and 5.5 cm transversely. In addition, pulmonary consolidation consistent with aspiration pneumonia was observed.\r\nAfter stabilization of the patient's general condition with intravenous fluids, nasogastric decompression was achieved via gastric tube placement, and she was started on antibiotic therapy and a proton pump inhibitor. The tube initially drained a large amount of fluid, but the output decreased to a small volume of non-bloody, normal gastric fluid immediately. Her abdominal pain and distension improved, and no peritoneal signs were observed. Laboratory data showed no progression of anemia and improvement in inflammatory markers. Based on these clinical and laboratory findings, we judged that the risk of gastric perforation or ischemic necrosis was low. Therefore, after confirming clinical stability, elective parastomal hernia repair was planned.\r\nGiven her history of multiple colonic resections for stoma prolapse, further colonic resection and relocation of the stoma to the right side would have risked excessive shortening of the colon, potentially leading to a high-output stoma. In addition, we were concerned about the possibility of recurrent stoma prolapse due to sagging of the remaining colon. Considering these factors, the laparoscopic Sugarbaker technique was deemed the most appropriate option to prevent both recurrent parastomal herniation and stoma prolapse. The patient subsequently underwent laparoscopic Sugarbaker repair 18 days after admission.\r\nIntraoperatively, the stomach was drawn into the parastomal hernial sac through traction of the gastrocolic ligament (Fig. 3). Reduction of the incarcerated stomach was challenging; therefore, the left gastrocolic ligament adjacent to the stoma was divided to facilitate reduction. Subsequently, the gastrocolic ligament was further divided, and the stomach was dissected from the mesocolon to maintain a safe distance from the stoma and prevent further traction by the colon. The hernial defect was located on the cranial and medial side of the stoma. The defect was closed using a running barbed suture to eliminate potential space between the abdominal wall and the elevated bowel and mesentery, while avoiding excessive tension to preserve mesenteric perfusion. The closure was performed from the point farthest from the stoma toward the bowel side to allow fine adjustment of tension. Following defect closure, laparoscopic Sugarbaker repair was performed using an intraperitoneal mesh tailored to achieve 5 cm of overlap beyond the suture line and the stoma opening. The mesh also covered the proximal colon, and the portion in contact with the stoma and proximal colon was folded so that the visceral (intraperitoneal) surface faced inward (Fig. 4). Operative time was 191 min with minimal blood loss. Postoperative course was uneventful, and the patient was discharged on POD 12.\r\nEndoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux. The gastric body and antrum also showed impaired distension, which may be related to the effects of incarceration (Fig. 5). On the CT obtained 2 months postoperatively, no gastric herniation was observed (Fig. 6). Only the elevated colon and its mesentery were seen protruding through the abdominal wall as the stoma, and no recurrence of the parastomal hernia was identified. Although the mesh itself was not clearly visualized, the proximal colon ran along the abdominal wall, which likely represents the appearance of abdominal wall-anchoring achieved by the Sugarbaker technique. No hernia recurrence was observed at 10 months of follow-up.","counts":{"Case":1,"Condition":14,"Symptom":3,"Exam":3,"Treatment":6}},{"case_id":"PMC2817501_01","article_id":"PMC2817501","title":"Extended durability of a cloth-covered star-edwards caged ball prosthesis in aortic position","age":"53.0","gender":"Male","text":"A-53-year old man admitted to our institution with exertional dyspnea and angina. He had had aortic valve replacement with Starr-Edwards 2320 model caged ball mechanical valve prosthesis in 1974 and suffered a thromboembolic serebrovascular accident two years ago. His physical examination revealed left hemiparesis with blood pressure 120/80 mmHg, heart rate 92 beats/min and regular. Cardiac auscultation revealed a 4/6 systolic murmur and rales were heard at the base of the lungs. Transesophageal echocardiography showed a functioning Starr-Edwards caged ball mechanical prosthesis with 30 mmHg gradient and rheumatic mitral valve disease with peak transmitral gradient of 20 mmHg and valve area 1.8 cm2 and 3-4 degree mitral insufficiency with a left ventricular ejection fraction of 30% with peak pulmonary artery pressure of 68 mmHg, besides there was a pannus formation in the surrounding valvular tissue. Coronary arteriography showed a 90% stenosis at proximal portion of LAD and well functioning caged ball prosthesis (Figure 1). The patient underwent a reoperation of double valve replacement and one vessel coronary artery bypass grafting through a median sternotomy by the help of cardiopulmonary bypass at mild hypothermia. Macroscopic inspection of the excised Starr-Edwards caged ball significant cloth wear and dislodgement were observed inside the struts, showing bare cage metal (Figure 2).\r\nAt reoperation the mitral valve was replaced with a bileaflet prosthesis, St. Jude Medical 29 mm, and an aortotomy was applied because of the previous serebrovascular accident and to examine the pannus formation in the surrounding tissue. After aortotomy we saw that the cloth surrounding the outside was detached from struts and loosened and the Starr-Edwards caged-ball prosthesis was replaced with St. Jude Medical 21 mm bileaflet valve prosthesis to achieve a better hemodynamic performance and a lower INR ratio in the follow-up period. The postoperative course was uneventful. Echocardiogram before discharge confirmed that the prosthetic valves were functioning normally.","counts":{"Case":1,"Symptom":1,"Exam":3}},{"case_id":"PMC3437073_01","article_id":"PMC3437073","title":"An unusual presentation of tuberculous splenic abscess","age":"55.0","gender":"Male","text":"A 55-year-old male presented with a gradually increasing mass on the left lateral lower chest and upper abdomen over a period of one year. He had no other medical problems and no history of contact with a tuberculous patient. On examination, a lobulated subcutaneous mass measuring about 7 cm in diameter, soft to cystic in consistency, immobile and attached to the skin which was tense and slightly red, tender but not warm, not pulsating, and with no bruit was found on the left lower chest and upper abdomen laterally. The spleen was enlarged 8 cm below the costal margin. Other systems were normal.\r\nChest X-rays showed a calcified lesion near the hilum of the right lung suggestive of an old pulmonary tuberculosis. Abdominal radiographs showed calcified lesions in the left upper quadrant (Figure 1). Ultrasound of the abdomen indicated an enlarged spleen with areas of calcification. CT scan of the abdomen revealed a splenic abscess communicating with another subcutaneous abscess through the lower chest wall (Figure 2). Based on these data, a complicated tuberculous splenic abscess was the most probable diagnosis.\r\nUnder general anesthesia, the subcutaneous abscess was incised and drained, and splenectomy was performed simultaneously. The spleen was found to be enlarged, fibrotic, and adherent to the lower chest wall. There was an abscess cavity within the spleen communicating with the subcutaneous abscess through a small tract in the lower chest wall below the insertion of the diaphragm. The abscesses contained thick pus and necrotic material. Histopathology of the spleen revealed the characteristic tuberculoid granuloma with epithelioid cells, Langhans' multinucleated giant cells, and caseation necrosis (Figure 3). Acid fast bacilli staining, tuberculous and bacterial cultures were all negative.\r\nThe patient was started on Isoniazid (INH) 300 mg OD, Rifampin 600 mg OD, Ethambutol 600 mg OD and Pyrazinamide 500 mg OD for 5 weeks, then maintained on the former two drugs. The patient's condition improved on anti-tuberculous medications and showed good clinical progress at one-year follow-up.","counts":{"Case":1,"Exam":3,"Condition":1,"Treatment":5}},{"case_id":"PMC3859158_01","article_id":"PMC3859158","title":"Pancreatic tail schwannoma in a 44-year-old male: a case report and literature review","age":"44.0","gender":"Male","text":"A 44-year-old man presented with a 4-month history of vague epigastric pain. The pain was gradually increasing in severity and associated with nausea and vomiting. Patient denied any history of physical trauma, gastroesophageal reflux disease, gastritis, peptic ulcer disease, pancreatitis, or hepatobiliary disease. Moreover, patient denied any history of constitutional symptoms such as fever, night sweating, or weight loss. Past medical, surgical, and family history were unremarkable.\r\nOn physical examination, patient was vitally stable. Abdomen was soft, lax, and nondistended. However, the epigastric region was moderately tender to palpation without evidence of a palpable mass.\r\nAll laboratory tests including complete blood count, hepatic, coagulation renal and bone profiles, amylase, lipase, lactate dehydrogenase (LDH), carcinoembryonic antigen (CEA), and cancer antigen 19-9 (CA 19-9) were within normal values.\r\nContrast-enhanced computed tomography (CT) scan showed a 9.2 x 9.5 x 11.5 cm, huge, and well-defined left suprarenal mass arising either from adrenal gland, pancreas, or retroperitoneum. The mass demonstrated mild heterogeneous enhancement with central cystic/necrotic area. No evidence of lymphadenopathy or regional/distant metastasis was identified (Figures 1(a) and 1(b)).\r\nAt laparoscopy, the mass was noticed to originate from pancreatic tail. Patient underwent surgical resection of pancreatic tail, splenectomy, and celiac lymph node dissections. Macroscopic and microscopic examination of spleen and celiac lymph node dissections revealed unremarkable pathological findings and were negative for malignant components.\r\nMacroscopically, the distal pancreatic mass measured 7.1 x 6.2 cm. A cut section showed solid and yellow mass with a central cystic area. Microscopically, the distal pancreatic mass was composed of monomorphic spindle-shaped Schwann cells with poorly defined eosinophilic cytoplasm and pointed basophilic nuclei set in a collagenous stroma. Focal nuclear palisading was noted (Figure 2(a)). Areas characteristic of Antoni B composed of Schwann cells with inconspicuous cytoplasm and nuclei suspended in myxoid matrix were identified. Scattered degenerated nuclei in a hyalinized stroma suggestive of ancient schwannoma were present. No mitosis or necrosis was noted (Figure 2(b)). Immunohistochemically, tumor cells stained diffusely and strongly positive for S100 protein (Figure 3). Conversely, tumor cells stained negative for CD34, CD117, CK, and ALK-1. A final diagnosis of primary ancient schwannoma of pancreatic tail was established.\r\nPatient had an uneventful postoperative course following surgery. Postoperatively, patient received no adjuvant therapy. At a postoperative 6-month followup, patient was completely asymptomatic and CT scan imaging showed no evidence of tumor recurrence.","counts":{"Case":1,"Symptom":3,"Exam":4,"Treatment":2,"Condition":2}},{"case_id":"PMC3897989_01","article_id":"PMC3897989","title":"Concurrent autoimmune pancreatitis and primary biliary cirrhosis: a rare case report and literature review","age":"65.0","gender":"Male","text":"A 65-year-old male was admitted to our hospital complaining of jaundice, pruritus, mild right upper abdominal pain and darkening urine. Past medical history revealed atrial fibrillation and the patient was on intermittent aspirin therapy. And the family history was negative. Physical examination revealed icteric sclera and skin, mild upper abdominal tenderness, arythmia, irregular heart sound and pulse deficit.\r\nThe laboratory test data at admission showed that the serum levels of alanine transaminase (ALT), aspartate transaminase (AST), alkaline phosphatase (ALP), gamma-glutamyltransferase (gamma-GT), total bilirubin (TBil) and direct bilirubin (DBil) were elevated to 79 U/L (5-45 U/L), 51 U/L (5-35 U/L), 540 U/L (30-110 U/L), 197 U/L (7-50 U/L), 408 mumol/L(0-20.5 mumol/L) and 283.7 mumol/L (0-6.8 mumol/L), respectively. Serum IgG and IgM were 3,180 mg/dL (694-1620 mg/dL) and 344 mg/dL (60-263 mg/dL), respectively. The titer of antinuclear antibody (ANA) was 1:320. Screening for antoimmune diseases revealed that the patient was positive for antimitochondrial antibody (AMA), anti-AMA-M2 and anti-Ro antibody. Common tumor markers and viral markers were all negative.\r\nBoth computed tomography (CT) and magnetic resonance image (MRI) revealed diffusive enlargement of the pancreas, capsuled by an armorlike low-density rim and enhanced homogenously (Figure 1). Other abnormalities included significant dilation of intra- and extra-hepatic bile duct, diffusive thickening of the gallbladder wall and atrophy of the right kidney. Endoscopic retrograde cholangio-pancreatography (ERCP) was conducted, revealing similar findings with CT and MRI. No sign of malignancy was observed. Test of tumor markers from the bile showed CEA of 66.89 ng/mL (0-5 ng/mL) and CA199 larger than 4000 U/mL (<37.0 U/mL), but examinations of exfoliated cells proved negative for three consecutive times. The biliary culture was positive for ESBL-producing Klebsiella pneumoniae. Infection was suspected and meropenem (0.5 g per 8 hours) was administered.\r\nBased on the biochemical evidence of cholestasis from the elevation of ALP, gamma-GT and TBil, and the presence of AMA, the patient was clinically diagnosed with PBC and UDCA (250 mg, three times per day) was initiated immediately after nasobiliary drainage, which partially improved the patient's liver function (Figure 2). Since the patient was also suspected of suffering from AIP, the following examinations were conducted. IgG4 was measured and turned out to be 44.36 g/L (0.03-2 g/L). CT-guided pancreatic biopsy was performed, and histopathological evaluation showed dense lymphoplasmacytic infiltration and fibrosis. IgG4+ plasma cell was stained and counted to be as high as 95 per high-power field (HPF) (Figure 3). ECT of salivary gland was normal. So the diagnosis of type I AIP was confirmed in accordance with the diagnostic criteria.\r\nSteroid therapy with intravenous methylprednisolone (MEP) (40 mg per day) was administered promptly. Serum ALP, gamma-GP, TBil and DBil just before steroid therapy were 376 U/L, 38 U/L, 404.9 mumol/L and 289.2 mumol/L, respectively, and one week later were 243 U/L, 47 U/L, 47 U/L, 206.1 mumol/L and 167.1 mumol/L, respectively. Then we stepped down the steroid therapy with oral MEP 32 mg daily, yet the serum liver enzymes and bilirubin bounced up. So we increased the dose to 32 mg in the morning and 16 mg in the afternoon. And then the laboratory values improved. A repeat MRI showed remarkable reduction of the pancreas. 40 days after treatment, the IgG and IgM returned back into the normal range. The serum levels of ALP, gamma-GP, TBil and DBil were 135 U/L, 134 U/L, 82.8 mumol/L and 54.9 mumol/L, respectively. The patient was discharged and followed up at the clinic with MEP tapered off weekly by 5 mg. The clinical course is depicted in Figure 2.\r\nAbout 40 days after discharge, the patient developed red maculopapules on his right chest with prickling-like pain, worsened with erosion and blisters. The patient was diagnosed with herpes zoster and treated with acyclovir (500 mg twice a day) for 9 days. Unfortunately for the patient, a chest X-ray later showed multiple nodules in the right lung. Chest CT displayed multiple patchy shadows with cavity. CT-guided lung biopsy showed neutrophil aggregation and fibrous effusion within the alveoli. The patient was diagnosed with pulmonary abscess and was treated effectively with moxifloxacin (Figure 1). Given the immunosuppressed status of the patient, thymosin was injected twice a week to restore the immune function. The liver function and immunological indices of the patient were normal during the subsequent one-year follow-up period.","counts":{"Case":1,"Symptom":4,"Treatment":5,"Exam":12}},{"case_id":"PMC3917415_01","article_id":"PMC3917415","title":"Ruptured aneurysm at the fenestration of the middle cerebral artery detected by magnetic resonance angiography in a patient with systemic lupus erythematosus and renal failure: a case report","age":"47.0","gender":"Female","text":"A 47-year-old Japanese woman with 23 years' history of SLE had sudden onset of severe headache and was referred to our hospital. She had been treated as an out-patient with a daily prednisolone dose of 7.5mg and cyclophosphamide of 50mg/day before the onset. Her glomerular filtration rate (GFR) was 5.6mL/minute /1.73m2 and the stage was classified as G5 (end stage) of chronic kidney disease (CKD) on admission. Laboratory examinations revealed hypocomplementemia (complement C3: 66mg/dL, C4: 14mg/dL). Her anti-double-stranded deoxyribonucleic acid (DNA) antibody (IgG) was 6.5IU/mL (normal range <20). Computed tomography (CT) demonstrated SAH in her right Sylvian fissure (Figure 1a). Considering that she had SLE and had developed chronic renal failure without renal dialysis, MRA was used to identify her ruptured aneurysm. MRA was performed using a 1.5T magnetic resonance system (Signa HDxt, GE, USA). Contrast material was not used. The volume rendering (VR) method with three-dimensional time-of-flight (TOF) MRA was performed (Figure 1c,d) in addition to the usual maximum intensity projection (MIP) image (Figure 1b). MRA revealed a fenestration at the M1 portion of her right MCA and a small saccular aneurysm at the proximal end of the fenestration (Figure 1c,d). This was consistent with a ruptured aneurysm. A left frontotemporal craniotomy was performed to clip the neck of her aneurysm on the same day. The fenestration and ruptured aneurysm were confirmed under surgical microscopy, and the aneurysm was successfully occluded (Figure 2a,b). Intraoperative indocyanine green videoangiography confirmed this result (Figure 2c). The present patient was carefully managed avoiding cerebral vasospasm and general complications during the perioperative period and renal dialysis was initiated after the acute phase and had a favorable outcome. Postoperatively, she developed normal pressure hydrocephalus, requiring placement of a ventriculoperitoneal shunt. She was ultimately discharged home in good condition.","counts":{"Case":1,"Condition":2,"Symptom":1,"Exam":5}},{"case_id":"PMC4073451_01","article_id":"PMC4073451","title":"Anatomical variation of mandibular canal simulating a recurrence of odontogenic tumor","age":"14.0","gender":"Female","text":"In April of 2008, a 14-year-old girl was referred to department of Surgery and Oral Pathology to investigate a multilocular radiolucent lesion involving body and ramus of right mandible that was discovered, incidentally, in orthodontic documentation [Figure 1a]. The extraoral view showed slight swelling in region of right mandible and the intraoral examination showed no alterations in oral mucosa. In addition, computerized tomography (CT) with axial and 3-dimensional (3D) reconstruction was performed to define the extension of lesion and the views showed hypodense expansive lesion with buccal and lingual cortical expansion that pushed the mandibular canal to the base. Incisional biopsy was performed under local anesthesia revealing a cystic lesion, it was then marsupialized. The histological examination of the specimen diagnosed a keratocystic odontogenic tumor.\r\nIn June of 2009, 14 months after decompression was performed, the cyst was enucleated through an intraoral approach under general anesthesia. The patient was lost to follow-up returning in October of 2011, during which an oblique mandibular radiograph was done, revealing a small radiolucent lesion with radiopaque borders in same region of the keratocystic odontogenic tumor [Figure 1b]. It was confirmed on panoramic radiograph [Figure 1c]. A CT scan was done and it revealed a hypodense lesion that caused the expansion of cortical bone suggesting bone repair. Moreover, two parallel hyperdense lines in posterior region of right body of mandible were seen, compatible with bifid mandibular canal [Figure 1d]. In addition, a multislice CT scan was performed which revealed an ascendant bifurcation of the mandibular canal from nearly the angle to the superior border of mandible, surrounding the bone repair, simulating sclerotic margins of a possible recurrence [Figure 2].","counts":{"Case":1,"Exam":6}},{"case_id":"PMC4782471_01","article_id":"PMC4782471","title":"Infective endocarditis following coil occlusion of perimembranous ventricular septal defect with the Nit-Occlud((®)) Le device","age":"10.0","gender":"Female","text":"A 10-year-old female patient presented with perimembranous VSD measuring 5 mm, no aortic regurgitation, mild left ventricular dilatation, and no pulmonary hypertension. She was scheduled for device closure after her parents reported breathlessness on exertion and were advised that the defect was unlikely to close spontaneously at her age. She also had a small patent ductus arteriosus which was scheduled for intervention at a later date.\r\nThe patient underwent device closure using a 10 x 6 \"PFM NiT-Occlud\" device under general anesthesia following procedural guidelines. New hardware was used as the hospital ceased its re-sterilization policy in 2011.\r\nShe was given 50 mg/Kg of cefatoxime before the procedure and a similar dose 12 h later. The procedure was successful with no residual shunt, intraoperative or postoperative complications.\r\nTen days later, the patient developed a persistent fever of up to 40 C which failed to respond to a 1-week course of co-amoxyclav. The patient was admitted to the pediatric ward for additional investigation. The temperature was 39 C, heart rate was 140/m, respiratory rate was 30/min, and blood pressure was 100/60 mm Hg on admission. A new systolic murmur (3/6) was detected in the lower left sternal border with no organomegaly, no splinter hemorrhages or Roth's spots detected. Laboratory investigations showed an elevated erythrocyte sedimentation rate of 120 mm/h, C-reactive protein of 91 mg/dl, a white blood cell count of 28,000/mm3 and normal platelet count as well as hemoglobin of 6 g% for which she received blood transfusion. Three sets of blood cultures were taken, and all grew Pseudomonas aeuroginosa.\r\nEchocardiography revealed vegetation of 5 mm x 6 mm attached to the tricuspid valve, a flail tricuspid valve, and severe tricuspid regurgitation. It also showed moderate to severe dilatation of the right ventricle, but no pulmonary hypertension. The VSD was completely closed by the coil with no residual shunt. The patient was diagnosed with infective endocarditis and started empirically on the sensitivity results showed resistance to ceftazidime and sensitive to ciprofloxacin. Vancomycin was continued due to the high incidence of methicillin-resistant Staphylococcus aureus in the unit. She showed no improvement for 3 weeks and continued to develop intermittent fever; blood tests showed persistent leucocytosis, a high sedimentation rate, and high C-reactive protein.\r\nThe patient then underwent surgical intervention on cardiopulmonary bypass. Opening the right atrium revealed a destroyed tricuspid valve with vegetations and necrotic tissues around the coil [Figure 1]. The coil was removed, and the VSD was closed by an autologous pericardial patch using a continuous prolene suture [Figure 2]. The tricuspid valve could not be repaired and was replaced with a size 31 tissue valve [Figure 3]. The bypass and cross clamp time were 35 and 12 min, respectively. The patient developed heart block immediately and was paced, however, she continued to deteriorate with heart failure and ongoing sepsis. She required high doses of inotropes (adrenaline, dopamine, and dobutamine) and was continued on antibiotics. Cultures obtained from surgical specimens were negative. She died 2 days after surgery.","counts":{"Case":1,"Symptom":2,"Treatment":1,"Exam":2,"Condition":2}},{"case_id":"PMC4828947_01","article_id":"PMC4828947","title":"Long-term drug-resistant temporal lobe epilepsy associated with a mixed ganglioglioma and dysembryoplastic neuroepithelial tumor in an elderly patient","age":"61.0","gender":"Male","text":"A 61-year-old man presented with chronic drug-resistant seizures since the age of four. After video-electroencephalogram (EEG) analysis, he was found to have complex partial seizures arising from the left temporal lobe. The seizures started with an unforced, nonversive head turning to the left, followed by a dystonic posturing of the right hand. Impairment of consciousness and apprehension together with dysphasia occurred. Postictally, the dysphasia continued and frequently there was nose wiping with the left hand. When he was considered a candidate for surgery, the patient had 1-2 seizures per month with a duration of 1 min. The seizures were treated with oxcarbazepine 1200 mg/day and valproic acid 1500 mg/day. The medical history was negative for epilepsy-associated risk factors such as febrile seizures, meningitis, and head trauma. The family history was negative with regard to epilepsy. Neurological examination demonstrated no abnormalities. A 3-Tesla magnetic resonance imaging (MRI) scan showed a cortical lesion in the medial and superior temporal gyrus of the anterior left temporal lobe, which appeared partially cystic and partially solid.\r\nThe solid part and the cyst wall enhanced after gadolinium administration. Signs of calcification or hemosiderin products were seen in the cyst wall [Figures 1 and 2]. Ictal and interictal EEG showed an epileptiform focus in the left temporal lobe, congruent with the clinical semiology and the lesion on MRI. The surgical treatment consisted of an awake craniotomy (Penfield procedure) with a maximal left-sided temporal lobectomy plus amygdalohippocampectomy and gross-total lesionectomy. The histological diagnosis was a mixed ganglioglioma-DNET, WHO Grade I. One part of the lesion [Figure 3] had a nodular myxoid, mucinous aspect with axonal bundles surrounded by oligodendrocyte-like cells. Between these bundles, an eosinophil matrix with neurons was found. The lesion stained positive with synaptophysin and S100, but was negative for glial fibrillary acidic protein (GFAP). A Ki-67-staining showed no elevated proliferative activity. This part of the lesion matched the diagnosis of a DNET, WHO Grade I. The other part of the lesion [Figure 4] had a clear neuronal and glial component and showed large and polymorph ganglion cells in a fibrillary matrix with glial cells and perivascular lymphocytic infiltrates. The neuronal part stained positive with synaptophysin and some ganglion cells were CD34 positive. Glial cells stained positive with GFAP, and Ki-67-staining was negative. Hence, this part of the lesion was compatible with a ganglioglioma.\r\nIn the first two postoperative weeks, the patient had mixed speech disturbances most probably due to manipulation-induced edema. Three weeks after operation, these disturbances had disappeared completely. Until now (60 months after operation), the patient is seizure-free.","counts":{"Case":1,"Exam":3,"Treatment":2,"Symptom":1}},{"case_id":"PMC5137649_01","article_id":"PMC5137649","title":"Gastric duplication cyst masquerading as a mucinous pancreatic cyst: case report and literature review","age":"44.0","gender":"Female","text":"A 44-year-old woman presented with a 3-day history of right flank and lower quadrant abdominal pain associated with nausea and constipation. Her past medical, family and medication history were otherwise non-contributory and her physical examination was unremarkable. She underwent contrast enhanced computed tomography, demonstrating a 6cm cystic lesion between the stomach and body/tail of the pancreas (Fig 1). She subsequently underwent EUS-FNA, which revealed normal pancreatic echotexture and a cyst measuring 6cm x 9cm that was free of internal septations or associated masses (Fig 2) but compressed the stomach. FNA of the cyst demonstrated no evidence of malignancy but did show the presence of extracellular mucin as well as a carcinoembryonic antigen (CEA) level of 12,476.5ng/ml and a carbohydrate antigen (CA) 19-9 level of 6iu/ml, suggesting the diagnosis of a mucinous pancreatic cystic neoplasm. The patient was therefore referred for surgical resection.   \r\nA laparoscopic distal pancreatectomy was planned. At the time of the laparoscopic exploration, entrance to the lesser sac was first obtained and, on mobilising the posterior wall of the stomach, the lesion was noted to be tightly adherent to both the stomach and pancreas. The pancreas was mobilised free of the cyst and it was evident that the lesion originated from the stomach. Intraoperative endoscopy was performed and no mucosal abnormalities of the stomach were noted.\r\nOn further mobilisation, the cyst was adherent to the coeliac axis and the procedure was converted to an open resection. The stomach was fully mobilised and the gastric duplication cyst was noted to be arising from the posterior wall. It was dissected off the coeliac vessels and an enbloc resection of the cyst along with a portion of the posterior wall of the stomach with a surgical stapler was performed. Repeat oesophagogastroduodenoscopy revealed the presence of an intact staple line on the posterior stomach wall and no evidence of bleeding or leak. The gross margins were uninvolved.\r\nFinal pathology revealed a 9.5cm x 4.5cm x 2.0cm cyst with a smooth internal cyst wall consistent with a GDC (Figs 3-5). The patient was discharged home on postoperative day 4, doing well and tolerating a regular diet without any complications. On follow-up, she had complete resolution of her pain and nausea, and a return to regular bowel function and activity.","counts":{"Case":1,"Symptom":3,"Exam":6,"Condition":2,"Treatment":1}},{"case_id":"PMC5804616_01","article_id":"PMC5804616","title":"A case of unexpected impaired oxygenation due to intraoperative pneumothorax: an adverse event associated with respiratory management with spontaneous respiration in a patient with esophagobronchial fistulae","age":"77.0","gender":"Male","text":"Esophageal bypass surgery with gastric tube was planned for a 77-year-old man with esophagobronchial fistulae. He had undergone chemotherapy and radiotherapy for esophageal cancer with possible invasions to the descending aorta and left main bronchus at another hospital, resulting in the formation of fistulae. Since clip plication was unsuccessful and the fistulae remained, he was referred to our hospital for surgical treatment.\r\nThe patient had a past history of hypertension, diabetes mellitus, bladder cancer, and cerebral infarction. Preoperative arterial blood gas analysis showed a partial oxygen tension (PaO2) of 80.5 mmHg, partial carbon dioxide tension (PaCO2) of 38.8 mmHg, and pH of 7.44. Preoperative computed tomography showed two esophagobronchial fistulae, with diameters of 7 and 3 mm, located in the proximal part of the left main bronchus, and also demonstrated pleural effusion in the left thoracic cavity (Fig. 1). No bullae were evident in the lungs. \r\nAfter the patient entered the operating room, an epidural catheter was inserted at the eighth and ninth thoracic interspace. Because no endoscopic images were available, we confirmed the exact location of the esophagobronchial fistulae at the proximal part of the left main bronchus using bronchoscopy after intravenously administering 35 mg of pethidine. Tracheal intubation was performed nasally under bronchoscopic guidance using a long spiral tube with a short cuff (6.0 mm internal diameter, 400 mm length; Phycon, Tokyo, Japan) to a depth of 26 cm. The tip of the tracheal tube was confirmed to be above the carina on bronchoscopy. One-lung ventilation with this tube was planned as an emergency backup by advancing the tube into the right main bronchus in case spontaneous respiration ceased. We chose respiratory management with spontaneous respiration rather than one-lung ventilation in this case since we believed that further damage to the tissue around the fistulae should be avoided. Thus, we decided not to attempt to insert a double-lumen tube into the right main bronchus as a first-line therapy but only for backup plan. We assumed that the tissue around the fistulae may be very fragile after radiotherapy. We also had a jet ventilator and bronchoscope on hand in case hypoxemia developed during one-lung ventilation, so that high-frequency jet ventilation could be performed selectively to the distal part of the left main bronchus beyond the esophagobronchial fistulae. Cardiac surgeons were ready to apply a veno-venous extracorporeal membrane oxygenator in case of severe pulmonary insufficiency as one of the backup plans. After tracheal intubation, anesthesia was induced with 4% sevoflurane and maintained with 1.5-2% sevoflurane. Spontaneous respiration was maintained and was assisted with 3 cmH2O of pressure support. Tidal volume and respiratory rate were around 250-400 ml and 10-20 breaths per minute throughout surgery, respectively. Before the abdominal incision was made, 6 ml of 1% lidocaine was injected epidurally, followed by continuous infusion of 0.3% ropivacaine at a rate of 4-6 ml/h to obtain abdominal muscle relaxation. Arterial blood gas analysis showed a PaO2 of 252.4 mmHg, a PaCO2 of 36.9 mmHg, and a pH of 7.424 with an inspiratory fraction of oxygen (FiO2) of 0.6. With an FiO2 of 0.4, percutaneous arterial oxygen saturation (SpO2) was maintained above 98% during the former part of the surgical procedure.\r\nApproximately 60 min into the surgery, SpO2 suddenly dropped from 98 to 89% with an FiO2 of 0.4. We assumed that lung atelectasis associated with airway secretion or pulmonary soiling through the fistulae was the most likely reason for the impaired oxygenation. Bronchofiberscopic examination showed obstruction of the orifice of the left main bronchus with secretion. This secretion was suctioned, and FiO2 was increased to 0.6, and pressure support level was increased to 5 cmH2O. However, oxygenation only improved partially and arterial blood gas analysis showed a PaO2 of 101.7 mmHg with an FiO2 of 0.6. After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2). After a chest drainage tube was inserted, right pneumothorax was ameliorated, and then SpO2 returned to the baseline (99%) with an FiO2 of 0.4. The patient was extubated uneventfully in the operating room. The postoperative course was mostly uneventful, except that 650 ml of pleural effusion in the left thoracic cavity was aspirated on postoperative day (POD) 1. The chest tube in the right thoracic cavity was withdrawn on POD 1, and the patient was discharged from hospital on POD 18. \r\nOur management plan, comprising combination of general and epidural anesthesia and maintenance of spontaneous respiration during the surgical procedure, according to our previous report, went relatively well except for the unexpected hypoxemia due to intraoperative pneumothorax. The collapse of the right lung may have been facilitated by the spontaneous respiration strategy resulting in impaired oxygenation. Since no bullae were evident on preoperative computed tomography, spontaneous pneumothorax was considered unlikely to have occurred. We believe that this represents the first case report to describe an adverse event associated with maintaining spontaneous respiration in a case of esophagobronchial fistulae.\r\nOptimal respiratory management may differ depending on the site and size of the fistulae between the digestive and respiratory tracts. For example, PPV may be possible with a tracheal fistula with sufficient distance between the fistula and carina, because a tube cuff can easily block the fistula. In a patient with a giant fistula at the carina, one-lung ventilation with a small tracheal tube, independent ventilation of each lung with two tracheal tubes, or high-frequency jet ventilation may be useful. A veno-venous extracorporeal membrane oxygenator can also be used to improve oxygenation in patients with a fistula between the respiratory and digestive tracts. In this case, we chose respiratory management with spontaneous respiration since we believed that tissues close to the esophagobronchial fistula should not be damaged. Thus, we decided not to attempt to insert a double-lumen tube into the right main bronchus as a first-line therapy but only for backup plan. We assumed that the tissue around the fistulae may be very fragile after radiotherapy. If the fistula had been located in the distal part of the left main bronchus, far from the carina, we may have chosen using a right-sided double-lumen tube.\r\nMaintaining spontaneous respiration is one of the methods of respiratory management chosen in patients with esophagobronchial fistulae during general anesthesia. In the present case, arterial oxygenation and gas exchange were well maintained during the first 60 min with spontaneous respiration. We assume that right pneumothorax occurred during the surgical procedure when SpO2 suddenly dropped from 98 to 89%. The collapse of the right lung may have been facilitated with the occurrence of pneumothorax due to spontaneous respiration, while the atelectasis may have been less severe if the lungs had been ventilated with PPV. One of the lessons we learned from this case was that while spontaneous respiration may be useful in a patient with esophagobronchial fistulae, patients may be at higher risk of impaired oxygenation in the event of injury to the parietal pleura during surgery.\r\nAlthough the exact mechanisms underlying the pneumothorax that occurred in this case during esophageal bypass surgery have not been proven, we assume that the parietal pleura was injured while surgical manipulations were being performed close to the thoracic cavity. Before the present case, our university hospital had treated 48 cases of esophageal bypass surgery and postoperative pneumothorax was encountered in only one case (2.1%) (personal communication with Dr. Nakajima, Department of Surgery of Tokyo Medical and Dental University). Taking the fact that pneumothorax can occur (albeit rarely) into account, spontaneous respiration may have needed to be converted to PPV as soon as feasible after closing both the proximal and distal stumps of the esophagus. Having another backup plan to convert spontaneous respiration to PPV on suspicion of pneumothorax may be important for patients undergoing non-thoracic surgery being performed close to the thoracic cavity. We assume that one-lung ventilation rather than spontaneous respiration should be chosen in hospitals with higher incidence of pneumothorax after esophageal bypass surgery.","counts":{"Case":1,"Treatment":3,"Condition":13,"Exam":2}},{"case_id":"PMC5833205_01","article_id":"PMC5833205","title":"Protein-Losing Enteropathy in the Setting of Severe Iron Deficiency Anemia","age":"0.0","gender":"Male","text":"A previously healthy 20-month-old boy presented for evaluation of progressive generalized swelling. His parents had first noticed a mild periorbital edema 2 weeks prior, and they reported that the swelling had progressed steadily over time, eventually resulting in worsening abdominal distension and bilateral lower extremity edema. Clinical history obtained in the office revealed that shortly after the edema was noted, the patient began passing up to 5 to 6 loose to watery, grossly nonbloody stools per day. Additional history revealed that the boy routinely drank more than 28 ounces of cow milk per day. Laboratory studies obtained at his pediatrician's office revealed an albumin of 1.8 g/dL, and a urinalysis that was negative for protein. The patient was referred for further evaluation.\r\nLaboratory studies obtained in the emergency department were consistent with a microcytic anemia (hemoglobin of 6.4 mg/dL with mean corpuscular volume of 69 fL), iron deficiency (ferritin of 4.9 ng/L), and hypoproteinemia (albumin of 1.6 g/dL, total protein of 3.0 g/dL). His fecal alpha-1-antitrypsin level was markedly elevated beyond the quantifiable upper limit of our testing (>1.13 mg/g), and his stool tested positive for occult blood. Workup included performance of upper endoscopy and colonoscopy, and these studies revealed grossly normal appearing mucosa lining the upper and lower gastrointestinal tract. Subsequent histologic examination revealed only a mild increase in the number of eosinophils in the gastric antrum and otherwise normal-appearing mucosa without the presence of acute or chronic inflammation in his esophagus, duodenum, colon, and rectum.\r\nThe patient received 1 transfusion (20 mL/kg) of packed red blood cells and was treated with oral iron replacement at a dose of 6 mg/kg of elemental iron/day. Cow milk was empirically eliminated from his diet, and he was instead placed on an amino acid-based formula as an intervention to address the possibility of an unusually late presentation of cow milk protein intolerance. He responded favorably to this combination of therapy. He has had no subsequent episodes of edema and his diarrhea resolved.\r\nHis albumin normalized within 1 week and his edema resolved completely. After 3 months of oral iron therapy, his hemoglobin had risen to 11.8 g/dL and his ferritin was 29.4 ng/L.","counts":{"Case":1,"Symptom":4,"Exam":4,"Condition":1,"Treatment":2}},{"case_id":"PMC5875137_01","article_id":"PMC5875137","title":"An Unusual Left Atrial Mass in a Woman with Active Breast Cancer and Recent Cardiothoracic Surgery","age":"83.0","gender":"Female","text":"An 83-year-old woman, during the diagnostic assessments for a breast cancer, was diagnosed by chest computed tomography (CT) scan as having an asymptomatic ascending aortic aneurysm (maximum diameter 6.5 cm), susceptible of surgical correction.\r\nAfter 3 weeks, she underwent elective replacement of ascending aorta with 30 mm Hemashield platinum prosthesis and anastomosis of the left internal mammary artery to the descending anterior coronary artery that had a tight stenosis.\r\nShe underwent cardiac rehabilitation in our department, and no complications occurred during the hospital stay.\r\nA routine after surgery, TTE showed good biventricular systolic function, normal appearance of the visible aortic prosthesis, and an unclear LA image, looking hyperechoic, especially in the four-chamber view [Figure 1a-d].\r\nTherefore, a new chest CT scan was performed focusing to the heart and aorta, which showed no intracardiac masses.\r\nConsequently, the mass visible during echocardiography was referred to a pseudomass due to the tortuous and \"C-shaped\" descending thoracic aorta, which had, at this level, an horizontal trait [Figures 2 and 3].","counts":{"Case":1,"Condition":3,"Exam":4}},{"case_id":"PMC6083636_01","article_id":"PMC6083636","title":"Absent Foveal Pit, Also Known as Fovea Plana, in a Child without Associated Ocular or Systemic Findings","age":"9.0","gender":"Male","text":"This report complies with all local laws and institutional review boards and with the principles of the Declaration of Helsinki. Informed written consent was obtained from parents. The patient was a healthy Caucasian male, aged 9 years. There was no history of amblyopia, strabismus or other eye disorders in the family and there was no parental consanguinity. As shown in Figure 1, external physical examination did not reveal obvious signs of cutaneous or ocular albinism. Parents reported that glasses were first prescribed at age 4 due to \"poor vision\". Cycloplegic refraction (Cicloplegicedol 10 mg/ml) in the right eye (RE) was plano/-2.50 x 10  and in the left eye (LE) plano/-3.50 x 180 .","counts":{"Case":1,"Exam":1}},{"case_id":"PMC6083636_02","article_id":"PMC6083636","title":"Absent Foveal Pit, Also Known as Fovea Plana, in a Child without Associated Ocular or Systemic Findings","age":"","gender":"Unknown","text":"Slit-lamp examination of the anterior segment was unremarkable, but the fundus examination revealed a blunt foveal reflex. OCT images shown in Figure 2 (patient's images labeled as \"case\"), obtained with a Topcon 3D OCT-2000, confirmed the absence of the foveal pit at the expected location of the anatomical fovea. There was no lateral displacement of the inner retinal layers, particularly of the inner nuclear (INL) and ganglion cell (GCL) layers, which appeared as a continuous band crossing the anatomical fovea. Of interest, there was a variation of thickness of the GCL and the ONL with a gradual increase in thickness from nasal-to-temporal macula and greatest thickness near the location of the anatomical fovea. Our patient showed a significantly thicker macula when compared with an age and gender matched control (Figure 2). In the central ring the retinal thickness of our case was 270 mum and 272 mum for the right and left eye, respectively. The thickness of the control was 227 mum in the right eye and 239 mum in the left. Of note, the overall thickness of the retina in all other rings and sectors seems to be reduced when compared with the control. Biometry, performed with a Sonomed PacScan 300A biometer, revealed and axial length in our case of 23.5 mm in both eyes.\r\nFundus photographs, taken with a Topcon TRC 50DX fundus camera, are shown in Figure 3. The patient's images (Figure 3, top panel) show a poorly defined foveal zone in the left eye as well as vascular branches crossing the location of the anatomic fovea. Only one retina of the case is shown to allow the addition of the control retina (bottom panel of the figure) for comparison nonetheless both eyes of our case have similar morphological properties in images obtained from fundus camera. Four multiple raster cuts through the anatomical position of the foveal centre clearly show evidence of fovea plana (Figure 4).","counts":{"Case":1,"Exam":2}},{"case_id":"PMC6083636_03","article_id":"PMC6083636","title":"Absent Foveal Pit, Also Known as Fovea Plana, in a Child without Associated Ocular or Systemic Findings","age":"","gender":"Unknown","text":"Best corrected visual acuity was 0.50 logMAR in the RE and 0.40 logMAR in the LE. Colour vision was assessed with Ishihara isochromatic plates and with the Farnsworth Munsell 100-Hue tests. The patient identified correctly 14 out of 15 Ishihara plates with the RE and 15 out of 15 with the LE. The Farnsworth Munsell 100-Hue showed a total error score of 127 for the RE and 106 for the LE, classified as \"probably normal\" colour discrimination for both eyes, although these error scores are expected in less than 20% of the population. Cover-test at near showed an intermittent exotropia that is shown in Figure 1; horizontal nystagmus was manifest only at extreme positions of gaze, likely representing end-gaze physiologic saccades. A good evidence that nystagmus was not present in primary position of gaze is the quality of the OCT and fundus images acquired.","counts":{"Case":1,"Exam":1}},{"case_id":"PMC6134951_01","article_id":"PMC6134951","title":"Hypersensitivity in ALK-positive lung cancers exposed to ALK inhibitors: a case of successful switch to an alternative ALK inhibitor and systematic review of the literature","age":"49.0","gender":"Female","text":"A 49-year-old Hispanic never-smoking female, with a history of asthma and resected atrial myxoma, was found to have a left upper lobe perihilar lung nodule, mediastinal lymphadenopathy, and a large left pleural effusion. Cytology of the pleural effusion was consistent with TTF1-positive pulmonary adenocarcinoma. Further testing revealed EGFR wild type, no ALK rearrangement (by fluorescence in situ hybridization), and no ROS1 fusion. The PD-L1 TPS score was 40%. She was treated initially with four cycles of carboplatin and pemetrexed and subsequently eight cycles of pembrolizumab with the progression of disease. At the same time, EML4-ALK fusion was identified by NGS-based circulating tumor DNA analysis (FoundationACT). It is unclear why the ALK rearrangement was not detected by the FISH test at initial diagnosis. The quality, quantity, and process of tumor specimen may affect the FISH test and occasionally lead to false-negative results. In our case, the initial pleural effusion specimen might not be suitable for the FISH test.\r\nThe patient started on alectinib 600 mg twice a day and had a rapid improvement of her left-sided chest pain. However, 10 days later, she developed a non-pruritic morbilliform rash spreading from trunk to the entire body, including palms, soles, and face with mild lip and eye swelling (Figure 1A). She had recurrent fevers with a maximum temperature of 105 degrees F and was hospitalized. A right arm lesion was punch biopsied, showing spongiotic and interface dermatitis with eosinophils, consistent with drug eruption (delayed type IV hypersensitivity, Figure 1B). She had no hematologic (eosinophilia), hepatic, renal, or pulmonary abnormality to suggest drug reaction with eosinophilia and systemic symptoms. Infectious disease workup was negative for streptococcal pharyngitis, HIV, parvovirus, herpes, syphilis, strongyloidiasis, and bacteremia. Alectinib was the only medication she was taking and was therefore withheld. Oral prednisone was started at 30 mg on day 1 and was tapered to 20 mg on the next day. She then continued at 10 mg daily for the next 5 days with a total course of 7 days. She also received one dose of diphenhydramine 50 mg intravenously prior to oral prednisone and topical triamcinolone cream. No antibiotics were administered. The rash improved rapidly, and the patient's febrile episodes resolved following 1 day of prednisone administration. Desensitization was not instituted because of the perceived potentially serious nature of this delayed hypersensitivity reaction, in light of the presence of eosinophils in the skin biopsy, and high fevers. She was started with brigatinib 1 week after completion of prednisone taper. She tolerated the oral inhibitor well without rash and fever. Eight weeks later, rescanning showed markedly improved pleural effusion and tumor response (Figure 1C).","counts":{"Case":1,"Condition":1,"Treatment":6,"Symptom":2,"Exam":1}},{"case_id":"PMC6343374_01","article_id":"PMC6343374","title":"Bronchial compression as adverse effect of right pulmonary artery stenting in a patient with truncus arteriosus communis and interrupted aortic arch","age":"0.0","gender":"Male","text":"A 6-day-old twin male infant weighing 2760 g was born in our institution at gestational age 38 weeks. Echocardiography allowed the diagnosis of TAC 4A, with interrupted aortic arch (IAA) and trivial truncal valve regurgitation. The truncal valve appeared to be more than 75% committed to the right ventricular side of the ventricular septal defect (VSD). It was IAA Type B [Figure 1].\r\nSurgical correction was performed on day 6
