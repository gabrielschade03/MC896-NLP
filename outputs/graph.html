<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo de casos clínicos — MC896 NLP</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --border: #dfe3e8;
  --ink: #1a1f26;
  --muted: #6b7280;
  --accent: #2563eb;
  --before: #7c3aed;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1, h2, h3 { margin: 0; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- cabeçalho ---------- */
header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
header h1 { font-size: 15px; letter-spacing: .2px; }
header h1 span { color: var(--muted); font-weight: 400; }
.stats { display: flex; gap: 14px; margin-left: auto; color: var(--muted); font-size: 12px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- estrutura ---------- */
main { flex: 1 1 auto; display: flex; min-height: 0; }
aside {
  width: 260px;
  flex: 0 0 260px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#detail {
  width: 340px;
  flex: 0 0 340px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px;
}
#center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------- lista de casos ---------- */
.search { padding: 10px; border-bottom: 1px solid var(--border); }
.search input {
  width: 100%; padding: 7px 9px; font: inherit;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#caseList { overflow-y: auto; flex: 1 1 auto; padding: 6px; }
.case-item {
  display: block; width: 100%; text-align: left;
  padding: 7px 9px; margin-bottom: 2px;
  border: 1px solid transparent; border-radius: 6px; background: none;
}
.case-item:hover { background: var(--bg); }
.case-item.active { background: #eaf1ff; border-color: #bcd2ff; }
.case-item .cid { font-weight: 600; font-size: 12.5px; }
.case-item .ctitle {
  color: var(--muted); font-size: 11.5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.case-item .counts { margin-top: 4px; display: flex; gap: 3px; }
.chip {
  font-size: 10px; padding: 0 5px; border-radius: 8px;
  color: #fff; font-variant-numeric: tabular-nums;
}
.case-item.overview { border-color: var(--border); background: var(--bg); margin-bottom: 8px; }

/* ---------- abas e filtros ---------- */
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 2px; background: var(--bg); padding: 2px; border-radius: 7px; }
.tab { padding: 5px 12px; border: 0; background: none; border-radius: 5px; font-size: 13px; }
.tab.active { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.filters { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.toggle {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--panel); font-size: 12px; user-select: none;
}
.toggle.off { opacity: .4; }
.toggle .dot { width: 9px; height: 9px; border-radius: 50%; }
.toolbar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }

/* ---------- área central ---------- */
#stage { flex: 1 1 auto; position: relative; overflow: hidden; min-height: 0; }
#stage.scrollable { overflow: auto; }
svg { display: block; }
#graphSvg { width: 100%; height: 100%; cursor: grab; background:
  radial-gradient(circle at 1px 1px, #dfe3e8 1px, transparent 0) 0 0/22px 22px; }
#graphSvg.dragging { cursor: grabbing; }
.node-shape { stroke: #fff; stroke-width: 1.5; cursor: pointer; }
.node-label { font-size: 10.5px; pointer-events: none; fill: var(--ink); }
.node-label.halo { stroke: rgba(255,255,255,.9); stroke-width: 3; paint-order: stroke; }
.no-labels .node-label { display: none; }
.link { fill: none; stroke: #9aa3af; stroke-width: 1.3; }
.link.BEFORE { stroke: var(--before); stroke-dasharray: 5 3; stroke-width: 1.8; }
.link.INDICATES { stroke: #0891b2; stroke-width: 1.8; }
.dim { opacity: .12; }
.sel { stroke: #111; stroke-width: 3; }
.hint {
  position: absolute; left: 12px; bottom: 10px;
  font-size: 11px; color: var(--muted); background: rgba(255,255,255,.85);
  padding: 3px 8px; border-radius: 5px; pointer-events: none;
}
.zoom-controls { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 4px; }
.zoom-controls button {
  height: 28px; min-width: 28px; border: 1px solid var(--border);
  background: var(--panel); border-radius: 6px; font-size: 15px; line-height: 1;
}

/* ---------- linha do tempo ---------- */
.tl-band-title { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .4px; }
.tl-lane { font-size: 11px; fill: var(--muted); }
.tl-grid { stroke: #e6e9ed; stroke-width: 1; }
.tl-box { cursor: pointer; }
.tl-box text { font-size: 11px; pointer-events: none; }
.tl-time { font-size: 10px; fill: var(--before); font-style: italic; }
.tl-arc { fill: none; stroke: var(--before); stroke-width: 1.6; stroke-dasharray: 5 3; }
.tl-empty { padding: 40px; color: var(--muted); text-align: center; }
.unplaced { padding: 12px 18px; border-top: 1px dashed var(--border); background: var(--panel); }
.unplaced h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
.unplaced .row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.pill {
  border: 1px solid var(--border); background: var(--panel);
  border-radius: 14px; padding: 2px 10px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px;
}
.pill.sel-pill { border-color: #111; box-shadow: 0 0 0 1px #111; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }

/* ---------- texto do caso ---------- */
#textView { padding: 22px 30px; overflow-y: auto; height: 100%; background: var(--bg); }
.text-card {
  max-width: 860px; margin: 0 auto; background: var(--panel);
  border: 1px solid var(--border); border-radius: 10px; padding: 26px 30px;
}
.text-card h2 { font-size: 15px; margin-bottom: 4px; }
.text-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
.case-body { font-size: 15px; line-height: 1.85; white-space: pre-wrap; }
mark {
  background: none; padding: 1px 2px; border-radius: 3px; cursor: pointer;
  border-bottom: 2px solid currentColor;
}
mark:hover { background: rgba(0,0,0,.06); }
mark.suspected { border-bottom-style: dotted; }
mark.marksel { background: #fff3bf; box-shadow: 0 0 0 2px #fde68a; }

/* ---------- painel de detalhes ---------- */
#detail h2 { font-size: 14px; margin-bottom: 2px; }
#detail .placeholder { color: var(--muted); font-size: 13px; padding-top: 30px; text-align: center; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 8px;
}
.kv { margin: 10px 0; }
.kv dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.kv dd { margin: 1px 0 8px; font-size: 13px; word-break: break-word; }
.evidence {
  background: var(--bg); border-left: 3px solid var(--border);
  padding: 9px 11px; font-size: 13px; line-height: 1.6; border-radius: 0 5px 5px 0;
}
.evidence b { background: #fff3bf; padding: 0 2px; border-radius: 2px; }
.rel-list { list-style: none; padding: 0; margin: 6px 0 0; }
.rel-list li { margin-bottom: 4px; }
.rel-list button {
  width: 100%; text-align: left; border: 1px solid var(--border);
  background: var(--panel); border-radius: 6px; padding: 5px 8px; font-size: 12px;
}
.rel-list button:hover { border-color: var(--accent); }
.rel-name { font-size: 10px; color: var(--muted); letter-spacing: .4px; display: block; }
hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
</style>
</head>

<header>

<main>

</main>

 chest pain and chest tightness for two weeks, worsening for the past 2 h.\" She reported that the chest pain that started 2 weeks before she attended the ER involved intermittent retrosternal pain occurring at midnight at rest, accompanied by tightness in her throat without shortness of breath, palpitations, or diaphoresis."},{"id":"event:PMC10106591_01:000249","case_id":"PMC10106591_01","type":"Symptom","label":"chest tightness","mention":"chest tightness","sentence_id":0,"start":130,"end":145,"attrs":{"assertion":"affirmed","source":"case_text","time":["for two weeks"]},"evidence":"A 44-year-old female patient presented to the emergency room (ER) of our hospital with complaints of \"intermittent chest pain and chest tightness for two weeks, worsening for the past 2 h.\" She reported that the chest pain that started 2 weeks before she attended the ER involved intermittent retrosternal pain occurring at midnight at rest, accompanied by tightness in her throat without shortness of breath, palpitations, or diaphoresis."},{"id":"event:PMC10106591_01:000250","case_id":"PMC10106591_01","type":"Symptom","label":"chest pain","mention":"chest pain","sentence_id":0,"start":212,"end":222,"attrs":{"assertion":"affirmed","source":"case_text","time":["2 weeks before"]},"evidence":"A 44-year-old female patient presented to the emergency room (ER) of our hospital with complaints of \"intermittent chest pain and chest tightness for two weeks, worsening for the past 2 h.\" She reported that the chest pain that started 2 weeks before she attended the ER involved intermittent retrosternal pain occurring at midnight at rest, accompanied by tightness in her throat without shortness of breath, palpitations, or diaphoresis."},{"id":"event:PMC10106591_01:000251","case_id":"PMC10106591_01","type":"Condition","label":"hypertension","mention":"hypertension","sentence_id":3,"start":607,"end":619,"attrs":{"assertion":"affirmed","source":"case_text","time":["for 7 years"]},"evidence":"Her medical history included hypertension for 7 years and noncompliance with antihypertensives (irbesartan, 150 mg/day)."},{"id":"event:PMC10106591_01:000252","case_id":"PMC10106591_01","type":"Exam","label":"physical examination","mention":"Physical examination","sentence_id":6,"start":802,"end":822,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Physical examination upon admission revealed that vitals were all within normal limits: blood pressure 105/51 mmHg (1 mm Hg = 0.133 kPa), heart rate (HR) 56 beats/min, respiratory rate 20 /min, and oxygen saturation level at 99% (room air)."},{"id":"event:PMC10106591_01:000253","case_id":"PMC10106591_01","type":"Exam","label":"electrocardiogram","mention":"electrocardiogram","sentence_id":10,"start":1293,"end":1310,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The electrocardiogram (ECG) performed at rest showed normal sinus rhythm with no significant ST-T changes (Figure 1A); echocardiography completed in the ER showed a mildly thickened ventricular septum and left ventricular posterior wall, mild tricuspid regurgitation, and slightly reduced left ventricular ejection fraction (LVEF 50%, normal range: 55%-75%) (Figures 1B,C)."},{"id":"event:PMC10106591_01:000254","case_id":"PMC10106591_01","type":"Exam","label":"echocardiography","mention":"echocardiography","sentence_id":10,"start":1408,"end":1424,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The electrocardiogram (ECG) performed at rest showed normal sinus rhythm with no significant ST-T changes (Figure 1A); echocardiography completed in the ER showed a mildly thickened ventricular septum and left ventricular posterior wall, mild tricuspid regurgitation, and slightly reduced left ventricular ejection fraction (LVEF 50%, normal range: 55%-75%) (Figures 1B,C)."},{"id":"event:PMC10106591_01:000255","case_id":"PMC10106591_01","type":"Exam","label":"laboratory testing","mention":"laboratory tests","sentence_id":11,"start":1666,"end":1682,"attrs":{"assertion":"affirmed","source":"case_text","measurements":["0.016 ng/mL","0.04 ng/mL","0.7 ng/mL","5.0 ng/mL","14.1 ng/mL","70.0 ng/mL"]},"evidence":"ER laboratory tests indicated normal troponin I of 0.016 ng/mL (normal range, 0-0.04 ng/mL), creatine kinase MB isoenzyme of 0.7 ng/mL (normal range, 0-5.0 ng/mL), and myoglobin of 14.1 ng/mL (normal range, 0-70.0 ng/mL) levels."},{"id":"event:PMC10106591_01:000256","case_id":"PMC10106591_01","type":"Condition","label":"acute coronary syndrome","mention":"acute coronary syndrome","sentence_id":12,"start":1898,"end":1921,"attrs":{"assertion":"suspected","source":"case_text"},"evidence":"Since acute coronary syndrome (ACS) cannot be excluded, a loading dose of aspirin (300 mg) + clopidogrel (300 mg) was prescribed and coronary angiography (CAG) was suggested but was refused by the patient and her family members."},{"id":"event:PMC10106591_01:000257","case_id":"PMC10106591_01","type":"Condition","label":"acute coronary syndrome","mention":"ACS","sentence_id":13,"start":2199,"end":2202,"attrs":{"assertion":"suspected","source":"case_text"},"evidence":"The patient was then admitted to the cardiac care unit (CCU) for suspicion of ACS."},{"id":"event:PMC10106591_01:000258","case_id":"PMC10106591_01","type":"Symptom","label":"chest pain","mention":"chest pain","sentence_id":14,"start":2246,"end":2256,"attrs":{"assertion":"affirmed","source":"case_text","time":["Twelve minutes after"]},"evidence":"Twelve minutes after hospitalization, her chest pain recurred, and monitoring ECG revealed ST-segment elevation in lead II and complete AV-B with HR at 41 beats/min accompanied by hypotension (BP at 96/51 mmHg) (Figures 2A,B)."},{"id":"event:PMC10106591_01:000259","case_id":"PMC10106591_01","type":"Exam","label":"electrocardiogram","mention":"ECG","sentence_id":14,"start":2282,"end":2285,"attrs":{"assertion":"affirmed","source":"case_text","time":["Twelve minutes after"]},"evidence":"Twelve minutes after hospitalization, her chest pain recurred, and monitoring ECG revealed ST-segment elevation in lead II and complete AV-B with HR at 41 beats/min accompanied by hypotension (BP at 96/51 mmHg) (Figures 2A,B)."},{"id":"event:PMC10106591_01:000260","case_id":"PMC10106591_01","type":"Condition","label":"complete atrioventricular block","mention":"complete AV-B","sentence_id":14,"start":2331,"end":2344,"attrs":{"assertion":"affirmed","source":"case_text","time":["Twelve minutes after"]},"evidence":"Twelve minutes after hospitalization, her chest pain recurred, and monitoring ECG revealed ST-segment elevation in lead II and complete AV-B with HR at 41 beats/min accompanied by hypotension (BP at 96/51 mmHg) (Figures 2A,B)."},{"id":"event:PMC10106591_01:000261","case_id":"PMC10106591_01","type":"Exam","label":"electrocardiogram","mention":"ECG","sentence_id":15,"start":2493,"end":2496,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"According to the characteristics of the patient's chest pain, ECG (near normal when chest pain was relieved), and biomarker (normal troponin I) obtained in ER, the diagnosis of CAS was highly suspected."},{"id":"event:PMC10106591_01:000262","case_id":"PMC10106591_01","type":"Treatment","label":"diltiazem","mention":"diltiazem","sentence_id":16,"start":2676,"end":2685,"attrs":{"assertion":"affirmed","source":"case_text","dose":"5 mg"},"evidence":"With a possible diagnosis of CAS, 5 mg of diltiazem was administered intravenously with prompt relief of chest pain, and complete AV-B was converted back to sinus rhythm (HR at 59 beats/min) (Figure 2C)."},{"id":"event:PMC10106591_01:000263","case_id":"PMC10106591_01","type":"Treatment","label":"diltiazem","mention":"diltiazem","sentence_id":17,"start":2866,"end":2875,"attrs":{"assertion":"affirmed","source":"case_text","dose":"50 mg"},"evidence":"The patient was on 50 mg of diltiazem hydrochloride intravenously (at 5 mL/h) for maintenance."},{"id":"event:PMC10106591_01:000264","case_id":"PMC10106591_01","type":"Exam","label":"coronary angiography","mention":"CAG","sentence_id":18,"start":2946,"end":2949,"attrs":{"assertion":"affirmed","source":"case_text","time":["second day after"]},"evidence":"She received CAG the second day after a repeated suggestion by the physician, which revealed normal left main branch, 20%-30% stenosis at the opening and middle segment of the left anterior descending artery (LAD), 30% stenosis at the first diagonal branch (D1), 30% stenosis at the beginning of the circumflex branch (LCX), and 20% stenosis at the middle of the right coronary artery (RCA) (Figures 2D,E,F, Supplementary Videos S1-S3)."},{"id":"event:PMC10106591_01:000265","case_id":"PMC10106591_01","type":"Exam","label":"electrocardiogram","mention":"ECG","sentence_id":20,"start":3699,"end":3702,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Based on the patient's symptoms, ECG, and CA findings, a diagnosis of CAS was made."},{"id":"event:PMC10106591_01:000266","case_id":"PMC10106591_01","type":"Condition","label":"coronary artery spasm","mention":"CAS","sentence_id":20,"start":3736,"end":3739,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Based on the patient's symptoms, ECG, and CA findings, a diagnosis of CAS was made."},{"id":"event:PMC10106591_01:000267","case_id":"PMC10106591_01","type":"Exam","label":"electrocardiogram","mention":"ECG","sentence_id":21,"start":3786,"end":3789,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Repeated troponin (0.031 ng/mL) and ECG were normal (Figure 3)."},{"id":"event:PMC10106591_01:000268","case_id":"PMC10106591_01","type":"Treatment","label":"diltiazem","mention":"diltiazem","sentence_id":22,"start":3846,"end":3855,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The patient was then prescribed diltiazem sustained-release capsules (90 mg, twice per day), an antiplatelet medication (aspirin, 100 mg per day), and lipid-regulating medication (atorvastatin, 20 mg per day)."},{"id":"event:PMC10106591_01:000269","case_id":"PMC10106591_01","type":"Treatment","label":"aspirin","mention":"aspirin","sentence_id":22,"start":3935,"end":3942,"attrs":{"assertion":"affirmed","source":"case_text","dose":"100 mg"},"evidence":"The patient was then prescribed diltiazem sustained-release capsules (90 mg, twice per day), an antiplatelet medication (aspirin, 100 mg per day), and lipid-regulating medication (atorvastatin, 20 mg per day)."},{"id":"event:PMC10106591_01:000270","case_id":"PMC10106591_01","type":"Treatment","label":"atorvastatin","mention":"atorvastatin","sentence_id":22,"start":3994,"end":4006,"attrs":{"assertion":"affirmed","source":"case_text","dose":"20 mg"},"evidence":"The patient was then prescribed diltiazem sustained-release capsules (90 mg, twice per day), an antiplatelet medication (aspirin, 100 mg per day), and lipid-regulating medication (atorvastatin, 20 mg per day)."},{"id":"case:PMC4073451_01","case_id":"PMC4073451_01","type":"Case","label":"PMC4073451_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC4073451","age":"14.0","gender":"Female","title":"Anatomical variation of mandibular canal simulating a recurrence of odontogenic tumor"},"evidence":""},{"id":"event:PMC4073451_01:000271","case_id":"PMC4073451_01","type":"Exam","label":"pathology examination","mention":"Pathology","sentence_id":0,"start":84,"end":93,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"In April of 2008, a 14-year-old girl was referred to department of Surgery and Oral Pathology to investigate a multilocular radiolucent lesion involving body and ramus of right mandible that was discovered, incidentally, in orthodontic documentation [Figure 1a]."},{"id":"event:PMC4073451_01:000272","case_id":"PMC4073451_01","type":"Exam","label":"computed tomography","mention":"CT","sentence_id":2,"start":439,"end":441,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"In addition, computerized tomography (CT) with axial and 3-dimensional (3D) reconstruction was performed to define the extension of lesion and the views showed hypodense expansive lesion with buccal and lingual cortical expansion that pushed the mandibular canal to the base."},{"id":"event:PMC4073451_01:000273","case_id":"PMC4073451_01","type":"Exam","label":"biopsy","mention":"biopsy","sentence_id":3,"start":688,"end":694,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Incisional biopsy was performed under local anesthesia revealing a cystic lesion, it was then marsupialized."},{"id":"event:PMC4073451_01:000274","case_id":"PMC4073451_01","type":"Exam","label":"histological examination","mention":"histological examination","sentence_id":4,"start":790,"end":814,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The histological examination of the specimen diagnosed a keratocystic odontogenic tumor."},{"id":"event:PMC4073451_01:000275","case_id":"PMC4073451_01","type":"Exam","label":"computed tomography","mention":"CT scan","sentence_id":8,"start":1321,"end":1328,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"A CT scan was done and it revealed a hypodense lesion that caused the expansion of cortical bone suggesting bone repair."},{"id":"event:PMC4073451_01:000276","case_id":"PMC4073451_01","type":"Exam","label":"computed tomography","mention":"CT scan","sentence_id":10,"start":1615,"end":1622,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"In addition, a multislice CT scan was performed which revealed an ascendant bifurcation of the mandibular canal from nearly the angle to the superior border of mandible, surrounding the bone repair, simulating sclerotic margins of a possible recurrence [Figure 2]."},{"id":"case:PMC6083636_01","case_id":"PMC6083636_01","type":"Case","label":"PMC6083636_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC6083636","age":"9.0","gender":"Male","title":"Absent Foveal Pit, Also Known as Fovea Plana, in a Child without Associated Ocular or Systemic Findings"},"evidence":""},{"id":"event:PMC6083636_01:000277","case_id":"PMC6083636_01","type":"Exam","label":"physical examination","mention":"physical examination","sentence_id":4,"start":392,"end":412,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"As shown in Figure 1, external physical examination did not reveal obvious signs of cutaneous or ocular albinism."},{"id":"case:PMC6083636_02","case_id":"PMC6083636_02","type":"Case","label":"PMC6083636_02","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC6083636","age":"","gender":"Unknown","title":"Absent Foveal Pit, Also Known as Fovea Plana, in a Child without Associated Ocular or Systemic Findings"},"evidence":""},{"id":"event:PMC6083636_02:000278","case_id":"PMC6083636_02","type":"Exam","label":"optical coherence tomography","mention":"OCT","sentence_id":1,"start":123,"end":126,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"OCT images shown in Figure 2 (patient's images labeled as \"case\"), obtained with a Topcon 3D OCT-2000, confirmed the absence of the foveal pit at the expected location of the anatomical fovea."},{"id":"event:PMC6083636_02:000279","case_id":"PMC6083636_02","type":"Exam","label":"optical coherence tomography","mention":"OCT","sentence_id":1,"start":216,"end":219,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"OCT images shown in Figure 2 (patient's images labeled as \"case\"), obtained with a Topcon 3D OCT-2000, confirmed the absence of the foveal pit at the expected location of the anatomical fovea."},{"id":"case:PMC6083636_03","case_id":"PMC6083636_03","type":"Case","label":"PMC6083636_03","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC6083636","age":"","gender":"Unknown","title":"Absent Foveal Pit, Also Known as Fovea Plana, in a Child without Associated Ocular or Systemic Findi PMC5804616_01","type":"Case","label":"PMC5804616_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC5804616","age":"77.0","gender":"Male","title":"A case of unexpected impaired oxygenation due to intraoperative pneumothorax: an adverse event associated with respiratory management with spontaneous respiration in a patient with esophagobronchial fistulae"},"evidence":""},{"id":"event:PMC5804616_01:000331","case_id":"PMC5804616_01","type":"Treatment","label":"chemotherapy","mention":"chemotherapy","sentence_id":1,"start":128,"end":140,"attrs":{"assertion":"suspected","source":"case_text"},"evidence":"He had undergone chemotherapy and radiotherapy for esophageal cancer with possible invasions to the descending aorta and left main bronchus at another hospital, resulting in the formation of fistulae."},{"id":"event:PMC5804616_01:000332","case_id":"PMC5804616_01","type":"Condition","label":"hypertension","mention":"hypertension","sentence_id":3,"start":468,"end":480,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The patient had a past history of hypertension, diabetes mellitus, bladder cancer, and cerebral infarction."},{"id":"event:PMC5804616_01:000333","case_id":"PMC5804616_01","type":"Condition","label":"diabetes mellitus","mention":"diabetes mellitus","sentence_id":3,"start":482,"end":499,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The patient had a past history of hypertension, diabetes mellitus, bladder cancer, and cerebral infarction."},{"id":"event:PMC5804616_01:000334","case_id":"PMC5804616_01","type":"Exam","label":"computed tomography","mention":"computed tomography","sentence_id":5,"start":718,"end":737,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Preoperative computed tomography showed two esophagobronchial fistulae, with diameters of 7 and 3 mm, located in the proximal part of the left main bronchus, and also demonstrated pleural effusion in the left thoracic cavity (Fig. 1)."},{"id":"event:PMC5804616_01:000335","case_id":"PMC5804616_01","type":"Treatment","label":"intubation","mention":"intubation","sentence_id":9,"start":1344,"end":1354,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Tracheal intubation was performed nasally under bronchoscopic guidance using a long spiral tube with a short cuff (6.0 mm internal diameter, 400 mm length; Phycon, Tokyo, Japan) to a depth of 26 cm."},{"id":"event:PMC5804616_01:000336","case_id":"PMC5804616_01","type":"Treatment","label":"intubation","mention":"intubation","sentence_id":17,"start":2641,"end":2651,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"After tracheal intubation, anesthesia was induced with 4% sevoflurane and maintained with 1.5-2% sevoflurane."},{"id":"event:PMC5804616_01:000337","case_id":"PMC5804616_01","type":"Exam","label":"chest X-ray","mention":"chest X-ray","sentence_id":28,"start":4082,"end":4093,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2)."},{"id":"event:PMC5804616_01:000338","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":28,"start":4109,"end":4121,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2)."},{"id":"event:PMC5804616_01:000339","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":29,"start":4180,"end":4192,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"After a chest drainage tube was inserted, right pneumothorax was ameliorated, and then SpO2 returned to the baseline (99%) with an FiO2 of 0.4."},{"id":"event:PMC5804616_01:000340","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":33,"start":4889,"end":4901,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Our management plan, comprising combination of general and epidural anesthesia and maintenance of spontaneous respiration during the surgical procedure, according to our previous report, went relatively well except for the unexpected hypoxemia due to intraoperative pneumothorax."},{"id":"event:PMC5804616_01:000341","case_id":"PMC5804616_01","type":"Condition","label":"esophagobronchial fistula","mention":"esophagobronchial fistula","sentence_id":41,"start":6134,"end":6159,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"In this case, we chose respiratory management with spontaneous respiration since we believed that tissues close to the esophagobronchial fistula should not be damaged."},{"id":"event:PMC5804616_01:000342","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":47,"start":6886,"end":6898,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"We assume that right pneumothorax occurred during the surgical procedure when SpO2 suddenly dropped from 98 to 89%."},{"id":"event:PMC5804616_01:000343","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":48,"start":7061,"end":7073,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The collapse of the right lung may have been facilitated with the occurrence of pneumothorax due to spontaneous respiration, while the atelectasis may have been less severe if the lungs had been ventilated with PPV."},{"id":"event:PMC5804616_01:000344","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":50,"start":7504,"end":7516,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Although the exact mechanisms underlying the pneumothorax that occurred in this case during esophageal bypass surgery have not been proven, we assume that the parietal pleura was injured while surgical manipulations were being performed close to the thoracic cavity."},{"id":"event:PMC5804616_01:000345","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":51,"start":7843,"end":7855,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Before the present case, our university hospital had treated 48 cases of esophageal bypass surgery and postoperative pneumothorax was encountered in only one case (2.1%) (personal communication with Dr."},{"id":"event:PMC5804616_01:000346","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":53,"start":8023,"end":8035,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Taking the fact that pneumothorax can occur (albeit rarely) into account, spontaneous respiration may have needed to be converted to PPV as soon as feasible after closing both the proximal and distal stumps of the esophagus."},{"id":"event:PMC5804616_01:000347","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":54,"start":8312,"end":8324,"attrs":{"assertion":"suspected","source":"case_text"},"evidence":"Having another backup plan to convert spontaneous respiration to PPV on suspicion of pneumothorax may be important for patients undergoing non-thoracic surgery being performed close to the thoracic cavity."},{"id":"event:PMC5804616_01:000348","case_id":"PMC5804616_01","type":"Condition","label":"pneumothorax","mention":"pneumothorax","sentence_id":55,"start":8560,"end":8572,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"We assume that one-lung ventilation rather than spontaneous respiration should be chosen in hospitals with higher incidence of pneumothorax after esophageal bypass surgery."},{"id":"case:PMC3897989_01","case_id":"PMC3897989_01","type":"Case","label":"PMC3897989_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC3897989"," ":"event:PMC2817501_01:000370","case_id":"PMC2817501_01","type":"Symptom","label":"dyspnea","mention":"dyspnea","sentence_id":0,"start":62,"end":69,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"A-53-year old man admitted to our institution with exertional dyspnea and angina."},{"id":"event:PMC2817501_01:000371","case_id":"PMC2817501_01","type":"Exam","label":"physical examination","mention":"physical examination","sentence_id":2,"start":269,"end":289,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"His physical examination revealed left hemiparesis with blood pressure 120/80 mmHg, heart rate 92 beats/min and regular."},{"id":"event:PMC2817501_01:000372","case_id":"PMC2817501_01","type":"Exam","label":"transesophageal echocardiography","mention":"Transesophageal echocardiography","sentence_id":4,"start":485,"end":517,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Transesophageal echocardiography showed a functioning Starr-Edwards caged ball mechanical prosthesis with 30 mmHg gradient and rheumatic mitral valve disease with peak transmitral gradient of 20 mmHg and valve area 1.8 cm2 and 3-4 degree mitral insufficiency with a left ventricular ejection fraction of 30% with peak pulmonary artery pressure of 68 mmHg, besides there was a pannus formation in the surrounding valvular tissue."},{"id":"event:PMC2817501_01:000373","case_id":"PMC2817501_01","type":"Exam","label":"echocardiography","mention":"Echocardiogram","sentence_id":13,"start":1995,"end":2009,"attrs":{"assertion":"affirmed","source":"case_text","time":["before discharge"]},"evidence":"Echocardiogram before discharge confirmed that the prosthetic valves were functioning normally."},{"id":"case:PMC11131390_01","case_id":"PMC11131390_01","type":"Case","label":"PMC11131390_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC11131390","age":"","gender":"Male","title":"Quitting smoking as a probable trigger for new-onset hypothyroidism after successful medical treatment of Graves' disease: case report"},"evidence":""},{"id":"event:PMC11131390_01:000374","case_id":"PMC11131390_01","type":"Symptom","label":"weight loss","mention":"weight loss","sentence_id":0,"start":104,"end":115,"attrs":{"assertion":"affirmed","source":"case_text","time":["May 2015"]},"evidence":"A retired male patient - 64 years of age and a heavy smoker - presented in May 2015 with a complaint of weight loss despite good appetite."},{"id":"event:PMC11131390_01:000375","case_id":"PMC11131390_01","type":"Exam","label":"thyroid function testing","mention":"thyroid function tests","sentence_id":1,"start":154,"end":176,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"He was ordered thyroid function tests revealing mild overt hyperthyroidism: TSH = 0.01 microIU/L (Normal 0.27-4.2 microIU/L), free T4 = 3.7 ng/dL (Normal 0.93-1.7 ng/dL), and free T3 = 10.9 (Normal 2.0-4.4 pg/mL)."},{"id":"event:PMC11131390_01:000376","case_id":"PMC11131390_01","type":"Condition","label":"hyperthyroidism","mention":"hyperthyroidism","sentence_id":1,"start":198,"end":213,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"He was ordered thyroid function tests revealing mild overt hyperthyroidism: TSH = 0.01 microIU/L (Normal 0.27-4.2 microIU/L), free T4 = 3.7 ng/dL (Normal 0.93-1.7 ng/dL), and free T3 = 10.9 (Normal 2.0-4.4 pg/mL)."},{"id":"event:PMC11131390_01:000377","case_id":"PMC11131390_01","type":"Exam","label":"serological testing","mention":"Serological investigations","sentence_id":3,"start":410,"end":436,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Serological investigations were consistent with a diagnosis of GD: TRAbs = 16.3 IU/L (Normal <1.75 IU/L), TPO antibodies = 268 (Normal <34 IU/mL), and thyroglobulin (Tg) antibodies = 1731 (Normal <115 IU/mL)."},{"id":"event:PMC11131390_01:000378","case_id":"PMC11131390_01","type":"Condition","label":"Graves disease","mention":"GD","sentence_id":3,"start":473,"end":475,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Serological investigations were consistent with a diagnosis of GD: TRAbs = 16.3 IU/L (Normal <1.75 IU/L), TPO antibodies = 268 (Normal <34 IU/mL), and thyroglobulin (Tg) antibodies = 1731 (Normal <115 IU/mL)."},{"id":"event:PMC11131390_01:000379","case_id":"PMC11131390_01","type":"Condition","label":"Graves disease","mention":"GD","sentence_id":4,"start":665,"end":667,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The patient was counseled about the nature of GD, about the benefits of quitting smoking, and he was offered medical treatment in the form of carbimazole (CBZ) 20 mg/day, given that methimazole is not available in Egypt."},{"id":"event:PMC11131390_01:000380","case_id":"PMC11131390_01","type":"Treatment","label":"carbimazole","mention":"carbimazole","sentence_id":4,"start":761,"end":772,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The patient was counseled about the nature of GD, about the benefits of quitting smoking, and he was offered medical treatment in the form of carbimazole (CBZ) 20 mg/day, given that methimazole is not available in Egypt."},{"id":"event:PMC11131390_01:000381","case_id":"PMC11131390_01","type":"Treatment","label":"carbimazole","mention":"CBZ","sentence_id":5,"start":852,"end":855,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The dose of CBZ was then titrated against his laboratory results, to achieve low normal free T4 and free T3, and he maintained euthyroid on a dose of 5 mg/day for a period of 15 months (February 2016-May 2017)."},{"id":"event:PMC11131390_01:000382","case_id":"PMC11131390_01","type":"Treatment","label":"carbimazole","mention":"CBZ","sentence_id":6,"start":1065,"end":1068,"attrs":{"assertion":"affirmed","source":"case_text","time":["July 2017"]},"evidence":"In July 2017, CBZ was discontinued after having a TSH result of 22 microIU/L while being on a dose of 2.5 mg/day for 2 months."},{"id":"event:PMC11131390_01:000383","case_id":"PMC11131390_01","type":"Treatment","label":"carbimazole","mention":"CBZ","sentence_id":8,"start":1442,"end":1445,"attrs":{"assertion":"affirmed","source":"case_text","time":["August 2017"]},"evidence":"The first follow-up off CBZ in August 2017, the patient was euthyroid with TSH = 3.3 microIU/L, free T4 = 1.17 ng/dL, and TRAbs was 3.3 IU/L."},{"id":"event:PMC11131390_01:000384","case_id":"PMC11131390_01","type":"Treatment","label":"carbimazole","mention":"CBZ","sentence_id":9,"start":1602,"end":1605,"attrs":{"assertion":"affirmed","source":"case_text","time":["November 2017","4 months after"]},"evidence":"In November 2017, 4 months after stopping CBZ, the patient presented with 4 kg weight gain (67-71 kg) and severe biochemical hypothyroidism, TSH = 73.5 microIU/L and free T4 = 0.35 ng/dL, which was repeatedly confirmed, TSH = 48.9 microIU/L and free T4 = 0.66 ng/dL (Figure 1)."},{"id":"event:PMC11131390_01:000385","case_id":"PMC11131390_01","type":"Symptom","label":"weight gain","mention":"weight gain","sentence_id":9,"start":1639,"end":1650,"attrs":{"assertion":"affirmed","source":"case_text","time":["November 2017","4 months after"]},"evidence":"In November 2017, 4 months after stopping CBZ, the patient presented with 4 kg weight gain (67-71 kg) and severe biochemical hypothyroidism, TSH = 73.5 microIU/L and free T4 = 0.35 ng/dL, which was repeatedly confirmed, TSH = 48.9 microIU/L and free T4 = 0.66 ng/dL (Figure 1)."},{"id":"event:PMC11131390_01:000386","case_id":"PMC11131390_01","type":"Condition","label":"hypothyroidism","mention":"hypothyroidism","sentence_id":9,"start":1685,"end":1699,"attrs":{"assertion":"affirmed","source":"case_text","time":["November 2017"]},"evidence":"In November 2017, 4 months after stopping CBZ, the patient presented with 4 kg weight gain (67-71 kg) and severe biochemical hypothyroidism, TSH = 73.5 microIU/L and free T4 = 0.35 ng/dL, which was repeatedly confirmed, TSH = 48.9 microIU/L and free T4 = 0.66 ng/dL (Figure 1)."},{"id":"event:PMC11131390_01:000387","case_id":"PMC11131390_01","type":"Treatment","label":"levothyroxine","mention":"levothyroxine","sentence_id":10,"start":1964,"end":1977,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"Considering the patient age (66 years) and body weight (71 kg), the patient was started on replacement therapy in the form of levothyroxine 75 microg/day (calculated as 1.1 microg/kg/day), and the dose was later titrated to achieve a target TSH of 0.3-3 microIU/L, which was finally achieved using 100 microg/day, and this target was maintained for 45 months (July 2019-April 2023)."},{"id":"event:PMC11131390_01:000388","case_id":"PMC11131390_01","type":"Condition","label":"hypothyroidism","mention":"hypothyroidism","sentence_id":12,"start":2383,"end":2397,"attrs":{"assertion":"affirmed","source":"case_text","time":["November 2017"]},"evidence":"The coincidence of quitting smoking in July 2017 and the spontaneous development of overt hypothyroidism in November 2017, only 4 months later, urged us to search for a possible link between quitting smoking and new onset hypothyroidism in patients with treated GD."},{"id":"event:PMC11131390_01:000389","case_id":"PMC11131390_01","type":"Condition","label":"hypothyroidism","mention":"hypothyroidism","sentence_id":12,"start":2515,"end":2529,"attrs":{"assertion":"suspected","source":"case_text","time":["4 months later"]},"evidence":"The coincidence of quitting smoking in July 2017 and the spontaneous development of overt hypothyroidism in November 2017, only 4 months later, urged us to search for a possible link between quitting smoking and new onset hypothyroidism in patients with treated GD."},{"id":"event:PMC11131390_01:000390","case_id":"PMC11131390_01","type":"Condition","label":"Graves disease","mention":"GD","sentence_id":12,"start":2555,"end":2557,"attrs":{"assertion":"affirmed","source":"case_text"},"evidence":"The coincidence of quitting smoking in July 2017 and the spontaneous development of overt hypothyroidism in November 2017, only 4 months later, urged us to search for a possible link between quitting smoking and new onset hypothyroidism in patients with treated GD."},{"id":"case:PMC10710131_01","case_id":"PMC10710131_01","type":"Case","label":"PMC10710131_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC10710131","age":"26.0","gender":"Female","title":"Digital PBL-CBL teaching method improves students' performance in learning complex implant cases in atrophic anterior maxilla"},"evidence":""},{"id":"case:PMC10488652_01","case_id":"PMC10488652_01","type":"Case","label":"PMC10488652_01","mention":"","sentence_id":null,"start":null,"end":null,"attrs":{"article_id":"PMC10488652","age":"22.0","gender":"Female","title":"Autoimmune Hemolytic Anemia Caused by Cold Agglutinin Antibodies in Systemic Lupus erythematosus-a Rare Association: Case Report"},"evidence":""},{"id":"event:PMC10488652_01:000391","case_id":"PMC10488652_01","type":"Symptom","label":"fever","mention":"fever","sentence_id":0,"start":203,"end":208,"attrs":{"assertion":"affirmed","source":"case_text","time":["10 days before admission"]},"evidence":"A 22-year-old female patient with no relevant medical history was admitted to the emergency room of a third-level clinic for clinical symptoms that began 10 days before admission, including intermittent fever up to 39 C, general malaise, headache, myalgia, a mild self-limiting rash episode, diarrhea, and occasional emesis."},{"id":"event:PMC10488652_01:000392","case_id":"PMC10488652_01","type":"Symptom","label":"headache","mention":"headache","sentence_id":0,"start":238,"end":246,"attrs":{"assertion":"affirmed","source":"case_text","time":["10 days before admission"]},"evidence":"A 22-year-old female patient with no relevant medical history was admitted to the emergency room of a third-level clinic for clinical symptoms that began 10 days lting in the formation of fistulae."},{"id":"edge_000358","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000332","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"The patient had a past history of hypertension, diabetes mellitus, bladder cancer, and cerebral infarction."},{"id":"edge_000359","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000333","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"The patient had a past history of hypertension, diabetes mellitus, bladder cancer, and cerebral infarction."},{"id":"edge_000360","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000334","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Preoperative computed tomography showed two esophagobronchial fistulae, with diameters of 7 and 3 mm, located in the proximal part of the left main bronchus, and also demonstrated pleural effusion in the left thoracic cavity (Fig. 1)."},{"id":"edge_000361","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000335","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Tracheal intubation was performed nasally under bronchoscopic guidance using a long spiral tube with a short cuff (6.0 mm internal diameter, 400 mm length; Phycon, Tokyo, Japan) to a depth of 26 cm."},{"id":"edge_000362","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000336","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"After tracheal intubation, anesthesia was induced with 4% sevoflurane and maintained with 1.5-2% sevoflurane."},{"id":"edge_000363","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000337","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2)."},{"id":"edge_000364","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000338","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2)."},{"id":"edge_000365","case_id":"PMC5804616_01","source":"event:PMC5804616_01:000337","target":"event:PMC5804616_01:000338","relation":"INDICATES","attrs":{"trigger":"revealed"},"evidence":"After the completion of surgery, chest X-ray revealed right pneumothorax (Fig. 2)."},{"id":"edge_000366","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000339","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"After a chest drainage tube was inserted, right pneumothorax was ameliorated, and then SpO2 returned to the baseline (99%) with an FiO2 of 0.4."},{"id":"edge_000367","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000340","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Our management plan, comprising combination of general and epidural anesthesia and maintenance of spontaneous respiration during the surgical procedure, according to our previous report, went relatively well except for the unexpected hypoxemia due to intraoperative pneumothorax."},{"id":"edge_000368","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000341","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"In this case, we chose respiratory management with spontaneous respiration since we believed that tissues close to the esophagobronchial fistula should not be damaged."},{"id":"edge_000369","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000342","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"We assume that right pneumothorax occurred during the surgical procedure when SpO2 suddenly dropped from 98 to 89%."},{"id":"edge_000370","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000343","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"The collapse of the right lung may have been facilitated with the occurrence of pneumothorax due to spontaneous respiration, while the atelectasis may have been less severe if the lungs had been ventilated with PPV."},{"id":"edge_000371","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000344","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Although the exact mechanisms underlying the pneumothorax that occurred in this case during esophageal bypass surgery have not been proven, we assume that the parietal pleura was injured while surgical manipulations were being performed close to the thoracic cavity."},{"id":"edge_000372","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000345","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Before the present case, our university hospital had treated 48 cases of esophageal bypass surgery and postoperative pneumothorax was encountered in only one case (2.1%) (personal communication with Dr."},{"id":"edge_000373","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000346","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Taking the fact that pneumothorax can occur (albeit rarely) into account, spontaneous respiration may have needed to be converted to PPV as soon as feasible after closing both the proximal and distal stumps of the esophagus."},{"id":"edge_000374","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000347","relation":"DIAGNOSED_WITH","attrs":{"assertion":"suspected","method":"lexicon"},"evidence":"Having another backup plan to convert spontaneous respiration to PPV on suspicion of pneumothorax may be important for patients undergoing non-thoracic surgery being performed close to the thoracic cavity."},{"id":"edge_000375","case_id":"PMC5804616_01","source":"case:PMC5804616_01","target":"event:PMC5804616_01:000348","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"We assume that one-lung ventilation rather than spontaneous respiration should be chosen in hospitals with higher incidence of pneumothorax after esophageal bypass surgery."},{"id":"edge_000376","case_id":"PMC3897989_01","source":"case:PMC3897989_01","target":"event:PMC3897989_01:000349","relation":"HAS_SYMPTOM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"A 65-year-old male was admitted to our hospital complaining of jaundice, pruritus, mild right upper abdominal pain and darkening urine."},{"id":"edge_000377","case_id":"PMC3897989_01","source":"case:PMC3897989_01","target":"event:PMC3897989_01:000350","relation":"HAS_SYMPTOM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"A 65-year-old male was admitted to our hospital complaining of jaundice, pruritus, mild right upper abdominal pain and darkening urine."},{"id":"edge_000378","case_id":"PMC3897989_01","source":"case:PMC3897989_01","target":"event:PMC3897989_01:000351","relation":"HAS_SYMPTOM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"A 65-year-old male was admitted to our hospital complaining of jaundice, pruritus, mild right upper abdominal pain and darkening urine."},{"id":"edge_000379","case_id":"PMC3897989_01","source":"case:PMC3897989_01","target":"event:PMC3897989_01:000352","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"lexicon"} _WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"In positive control, P-positive red cells are mixed in 1:9 ratio with the patient's serum expecting hemolysis and a color change of the supernatant following antigen-antibody reaction."},{"id":"edge_000477","case_id":"PMC11259348_02","source":"case:PMC11259348_02","target":"event:PMC11259348_02:000444","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Enhanced hemolysis was evident in nine out of ten testing samples."},{"id":"edge_000478","case_id":"PMC11345641_01","source":"case:PMC11345641_01","target":"event:PMC11345641_01:000445","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"In December 2021, a 48-year-old woman was admitted to our center for a pelvic mass initially identified seven years earlier by transabdominal ultrasonography, which suggested a leiomyoma."},{"id":"edge_000479","case_id":"PMC11345641_01","source":"case:PMC11345641_01","target":"event:PMC11345641_01:000446","relation":"HAS_SYMPTOM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"She has experienced abdominal pain and noticeable abdominal enlargement over the past five months."},{"id":"edge_000480","case_id":"PMC11345641_01","source":"case:PMC11345641_01","target":"event:PMC11345641_01:000447","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Ultrasonography identified a heterogeneously echogenic mass in the anterior wall of the uterus measuring 12.6x12.0x8.4cm with a regular outline and clear boundaries, consistent with a uterine fibroid."},{"id":"edge_000481","case_id":"PMC11345641_01","source":"case:PMC11345641_01","target":"event:PMC11345641_01:000448","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"MRI imaging displayed two quasi-circular masses within the uterine muscle wall; the larger was located in the anterior wall, measuring ap ntion secondary to incarceration within the parastomal hernial sac, with evidence of gastric outlet obstruction (Fig. 2)."},{"id":"edge_000542","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000505","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"CT revealed marked gastric distention secondary to incarceration within the parastomal hernial sac, with evidence of gastric outlet obstruction (Fig. 2)."},{"id":"edge_000543","case_id":"PMC12832199_01","source":"event:PMC12832199_01:000504","target":"event:PMC12832199_01:000505","relation":"INDICATES","attrs":{"trigger":"revealed"},"evidence":"CT revealed marked gastric distention secondary to incarceration within the parastomal hernial sac, with evidence of gastric outlet obstruction (Fig. 2)."},{"id":"edge_000544","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000506","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"In addition, pulmonary consolidation consistent with aspiration pneumonia was observed."},{"id":"edge_000545","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000507","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"trigger+lexicon","trigger":"started on"},"evidence":"After stabilization of the patient's general condition with intravenous fluids, nasogastric decompression was achieved via gastric tube placement, and she was started on antibiotic therapy and a proton pump inhibitor."},{"id":"edge_000546","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000508","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"trigger+lexicon","trigger":"started on"},"evidence":"After stabilization of the patient's general condition with intravenous fluids, nasogastric decompression was achieved via gastric tube placement, and she was started on antibiotic therapy and a proton pump inhibitor."},{"id":"edge_000547","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000509","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"trigger+lexicon","trigger":"started on"},"evidence":"After stabilization of the patient's general condition with intravenous fluids, nasogastric decompression was achieved via gastric tube placement, and she was started on antibiotic therapy and a proton pump inhibitor."},{"id":"edge_000548","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000510","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"trigger+lexicon","trigger":"started on"},"evidence":"After stabilization of the patient's general condition with intravenous fluids, nasogastric decompression was achieved via gastric tube placement, and she was started on antibiotic therapy and a proton pump inhibitor."},{"id":"edge_000549","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000511","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"The patient subsequently underwent laparoscopic Sugarbaker repair 18 days after admission."},{"id":"edge_000550","case_id":"PMC12832199_01","source":"event:PMC12832199_01:000510","target":"event:PMC12832199_01:000511","relation":"BEFORE","attrs":{"time_expression":"18 days after admission","method":"explicit_relative_time"},"evidence":"The patient subsequently underwent laparoscopic Sugarbaker repair 18 days after admission."},{"id":"edge_000551","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000512","relation":"RECEIVED_TREATMENT","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Following defect closure, laparoscopic Sugarbaker repair was performed using an intraperitoneal mesh tailored to achieve 5 cm of overlap beyond the suture line and the stoma opening."},{"id":"edge_000552","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000513","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"trigger+lexicon","trigger":"performed"},"evidence":"Endoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux."},{"id":"edge_000553","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000514","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Endoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux."},{"id":"edge_000554","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000515","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Endoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux."},{"id":"edge_000555","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000516","relation":"DIAGNOSED_WITH","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"Endoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux."},{"id":"edge_000556","case_id":"PMC12832199_01","source":"event:PMC12832199_01:000513","target":"event:PMC12832199_01:000514","relation":"INDICATES","attrs":{"trigger":"revealed"},"evidence":"Endoscopy performed on day 27 revealed chronic gastritis and linear duodenal ulceration, likely ischemic in origin, and severe esophagitis secondary to reflux."},{"id":"edge_000557","case_id":"PMC12832199_01","source":"case:PMC12832199_01","target":"event:PMC12832199_01:000517","relation":"UNDERWENT_EXAM","attrs":{"assertion":"affirmed","method":"lexicon"},"evidence":"On the CT obtained 2 months postoperatively, no gastric herniation was observed (Fig. 6)."}],"cases":[{"case_id":"PMC10106591_01","article_id":"PMC10106591","title":"Diltiazem is a useful and effective medication for reversal of coronary artery spasm-induced complete atrioventricular block: A case report","age":"44.0","gender":"Female","text":"A 44-year-old female patient presented to the emergency room (ER) of our hospital with complaints of \"intermittent chest pain and chest tightness for two weeks, worsening for the past 2 h.\" She reported that the chest pain that started 2 weeks before she attended the ER involved intermittent retrosternal pain occurring at midnight at rest, accompanied by tightness in her throat without shortness of breath, palpitations, or diaphoresis. The symptoms lasted for a few minutes and were relieved spontaneously. Her symptoms were recurring and became increasingly more frequent. Her medical history included hypertension for 7 years and noncompliance with antihypertensives (irbesartan, 150 mg/day). She also reported abnormal glucose tolerance for the past year. She denied taking any other medicines. Physical examination upon admission revealed that vitals were all within normal limits: blood pressure 105/51 mmHg (1 mm Hg = 0.133 kPa), heart rate (HR) 56 beats/min, respiratory rate 20 /min, and oxygen saturation level at 99% (room air). Cardiac and pulmonary examination revealed normal heart sounds without murmur and clear lungs to auscultation. The abdomen was soft and nontender to palpation, without rebound tenderness. There was no appreciable bilateral lower extremity edema. The electrocardiogram (ECG) performed at rest showed normal sinus rhythm with no significant ST-T changes (Figure 1A); echocardiography completed in the ER showed a mildly thickened ventricular septum and left ventricular posterior wall, mild tricuspid regurgitation, and slightly reduced left ventricular ejection fraction (LVEF 50%, normal range: 55%-75%) (Figures 1B,C). ER laboratory tests indicated normal troponin I of 0.016 ng/mL (normal range, 0-0.04 ng/mL), creatine kinase MB isoenzyme of 0.7 ng/mL (normal range, 0-5.0 ng/mL), and myoglobin of 14.1 ng/mL (normal range, 0-70.0 ng/mL) levels. Since acute coronary syndrome (ACS) cannot be excluded, a loading dose of aspirin (300 mg) + clopidogrel (300 mg) was prescribed and coronary angiography (CAG) was suggested but was refused by the patient and her family members. The patient was then admitted to the cardiac care unit (CCU) for suspicion of ACS. Twelve minutes after hospitalization, her chest pain recurred, and monitoring ECG revealed ST-segment elevation in lead II and complete AV-B with HR at 41 beats/min accompanied by hypotension (BP at 96/51 mmHg) (Figures 2A,B). According to the characteristics of the patient's chest pain, ECG (near normal when chest pain was relieved), and biomarker (normal troponin I) obtained in ER, the diagnosis of CAS was highly suspected. With a possible diagnosis of CAS, 5 mg of diltiazem was administered intravenously with prompt relief of chest pain, and complete AV-B was converted back to sinus rhythm (HR at 59 beats/min) (Figure 2C). The patient was on 50 mg of diltiazem hydrochloride intravenously (at 5 mL/h) for maintenance. She received CAG the second day after a repeated suggestion by the physician, which revealed normal left main branch, 20%-30% stenosis at the opening and middle segment of the left anterior descending artery (LAD), 30% stenosis at the first diagonal branch (D1), 30% stenosis at the beginning of the circumflex branch (LCX), and 20% stenosis at the middle of the right coronary artery (RCA) (Figures 2D,E,F, Supplementary Videos S1-S3). Routine lab work during hospitalization revealed that white blood cell count, lipids, liver function, renal function, glycosylated hemoglobin, electrolytes, thyroid function, coagulation function, erythrocyte sedimentation rate, D-dimers, cytokines, and urinalysis were all within normal limits. Based on the patient's symptoms, ECG, and CA findings, a diagnosis of CAS was made. Repeated troponin (0.031 ng/mL) and ECG were normal (Figure 3). The patient was then prescribed diltiazem sustained-release capsules (90 mg, twice per day), an antiplatelet medication (aspirin, 100 mg per day), and lipid-regulating medication (atorvastatin, 20 mg per day). With other in-patient treatments and improving myocardial ischemia, the patient no longer had chest pain or discomfort during hospitalization. The patient was followed up on an outpatient basis without recurrence of chest pain or other reported symptoms. At her last follow-up appointment, she had remained symptom-free for the past 3 months and was in good clinical condition. The timeline of this case report is provided in Table 1.","counts":{"Case":1,"Symptom":4,"Condition":5,"Exam":9,"Treatment":5}},{"case_id":"PMC10405809_01","article_id":"PMC10405809","title":"Rare Association of Killian-Jamieson Diverticulum and Peptic Stricture of the Esophagus: Is It Causal or Casual?","age":"55.0","gender":"Female","text":"A 55-year-old female presented with progressive dysphagia to solids and lost 10 kg weight over two years. She had heartburn and epigastric burning pain during the past 5 years, for which she took over-the-counter acid-suppressive medications. She denied a history of ingesting a caustic substance, radiotherapy, atopy, and other comorbid illnesses. None of her family members had any gastrointestinal disease. She was neither an alcoholic nor a smoker. On examination, she was pale and ill-nourished. She did not have significant lymph node enlargement. Examination of the abdomen, cardiovascular and respiratory systems was unremarkable. Blood investigations showed hemoglobin 8.8 gm/dL, total leukocyte count 6.4 x 109/L, platelet counts 510 x 109/L, and serum ferritin 8.1 microg/L. Peripheral smear showed microcytic and hypochromic red blood cells. Barium swallow showed a 3 cm x 2 cm sized diverticulum from the right lateral wall of the cervical esophagus and a short segment narrowing in the distal esophagus with upstream dilation (Fig. 1). We initially suspected gastroesophageal reflux disease (GERD) with peptic stricture of the esophagus; however, we wanted to rule out underlying malignancy because of profound weight loss and anemia. Hence a computed tomography (CT) scan of the neck and thorax was done, which confirmed KJD and showed a homogenous circumferential wall thickening in the lower esophagus with no significant periesophageal lymph nodes (Fig. 2).\r\nEsophagogastroduodenoscopy revealed KJD at 20 cm from incisors and a tight stricture at the lower esophagus beyond which the endoscope was not negotiable (Fig. 3). The stricture was dilated with a controlled radial expansion (CRE) balloon up to 12 mm (Fig. 3). Biopsies from the stricture site were negative for malignancy. We considered peptic stricture and malignancy of the distal esophagus in the differential diagnosis. Though profound weight loss and anemia raised suspicion of malignancy, the long duration of symptoms, benign CT scan characteristics, and biopsy from the stricture site confirmed peptic stricture in this case. The upper esophageal diverticulum in barium swallow and endoscopy prompted us to consider ZD, KJD, and LD. However, the CT scan confirmed the origin of the diverticulum from the anterolateral wall of the esophagus below the cricopharyngeus muscle. Hence, a final diagnosis of KJD and peptic stricture was made. The patient underwent three CRE balloon dilatation sessions from 12 to 15 mm at 4-weeks intervals. Post dilatation, she was started on capsule omeprazole 20 mg twice daily along with hematinics. After 6 months, she gained 7 kg weight, could take feeds normally, and her repeat hemoglobin was 10.9 gm/dL. She is currently doing well during follow-up.","counts":{"Case":1,"Symptom":4,"Condition":2,"Exam":6,"Treatment":1}},{"case_id":"PMC10434843_01","article_id":"PMC10434843","title":"Contactin-associated protein 2 autoantibodies can be associated with multifocal motor-like neuropathy: a case report","age":"49.0","gender":"Male","text":"A 49-year-old male presented to our clinic for further diagnostic evaluation of right arm paresis. The patient reported an increasing weakness of the right hand in the preceding months. He could no longer carry objects with his outstretched right arm and had an increasing difficulty in his fine motor skills such as buttoning shirts. The patient initially noticed dysaesthesia of his fingertips in his right hand 2 years ago, which had not bothered him significantly and did not, in contrast to his motor deficits, progress over time. Magnetic resonance imaging (MRI) of the head and cervical spine showed no abnormalities while initial treatments with physiotherapy and oral cortisone had been performed, without any improvement.\r\nThe clinical neurological examination on admission revealed a paresis dominantly of the right distal arm but no atrophy. Specifically, he displayed motor deficits (Medical Research Council grading system) in his wrist flexion [right (r): 4-/5, left (l): 5/5], wrist extension (r: 4/5, l: 5/5), wrist abduction [ulnar: (r: 4/5, l: 5/5), radial: (r: 4+/5, l: 5/5)], finger extension and flexion (r: 4+/5, l: 5/5) in addition to his finger spread (r: 4/5, l: 5/5). His thumb abduction, opposition (r: 4/5, l: 5/5), and extension (r: 4-/5, l: 5/5) showed deficits on the right side. There was a paresis in the external shoulder rotation on both sides (l, r: 4+/5) but no deficits in any other muscles (l/r: 5/5). The patient also presented an isolated hypoesthesia in the fingertips (one third of distal phalanx) of his first three fingers on both sides with an exclusion of the thumb pad and palm without thermdysesthesia and pallhypesthesia. Cramps and fasciculations were not observed. Reflexes were weak but equal on both sides. The neurological exam was otherwise unremarkable.\r\nA diagnostic lumbar puncture and subsequent cerebrospinal fluid (CSF) analysis showed a normal cell count and slightly increased total protein levels (603 mg/l) with a blood-CSF barrier dysfunction as quantified by the albumin quotient, but no intrathecal immunoglobulin synthesis (Figure 1). Flow cytometry analysis revealed an increase of activated HLA-DR expressing CD4+ T cells (33.7%) in the CSF compared to age-matched non-inflammatory controls [Figure 1(b)]. Furthermore, increased proportions of natural killer cells (NK cells) with a CD56bright to CD56dim shift were observed in the blood of the patient compared to both non-inflammatory controls and other inflammatory neuropathy patients. Both blood and CSF displayed higher levels of NKT cells compared to the non-inflammatory controls. Interestingly, we detected antibodies against CASPR2 in the CSF (1:32) and in the serum of the patient (1:320) (Table 1) (indirect immunofluorescence assay). Serum ganglioside antibody determination showed negative Immunoglobulin (Ig)G antibodies and a borderline positive result for IgM antibodies against GM3 and GQ1b in the serum, which, based on the assay guidelines, was considered negative (Table 1) (enzyme immunoassay).\r\nFurther diagnostics showed a motor nerve conduction block at Erb's point-axilla with area reduction of >50% (Table 2) in the right ulnar nerve. Nerve conduction velocity showed normal values in the median and ulnar nerve. F-wave latencies of the ulnar nerves were prolonged and the right median nerve was not measurable. The radial and tibial nerve on both sides showed normal functions. The sensory nerve conduction was normal in all of the above-mentioned nerves suggestive of an isolated motoric axonal and demyelinating neuropathy. The needle electromyography showed chronic neurogenic changes in the abductor pollicis brevis muscle, with no abnormal activity at rest. We diagnosed a MMN as the patient fulfilled the diagnostic criteria.   A peripheral nerve ultrasonography (Figure 2) showed an enlargement of the cross-sectional areas of the right median nerve and discontinuous swelling of individual fascicles of the right median and ulnar nerve in the upper arm supporting the MMN-like phenotype.\r\nA neuropsychiatric consultation showed a normal neurocognitive performance profile with no indication of an autoimmune encephalitis profile. In context with the clinical presentation and his normal brain MRI we thus ruled out an autoimmune encephalitis. Due to the CASPR2 antibodies, which can be associated with malignancy,   we initiated a tumor search with an abdomen and thyroid sonography as well as an urologic consultation and Positron emission tomography-computed tomography (PET-CT) which showed no indication of a tumor.\r\nIn a follow-up visit the patient showed signs of additional deficits on the left side. Specifically, he had motor deficits in his right finger extension (r: 4/5, l: 4+/5), his thumb abduction (r: 4/5, l: 4+/5), as well as thumb extension (r: 4-/5, l: 4/5). We started treatment with IVIG every 4 weeks. Three months later he reported a clinical improvement in his daily activities as he was now able to open drawers again. Objective parameters included an improvement of his finger extension (r: 4/5; l: 5/5) and his wrist extension (r: 5/5; l: 4+/5) and grip strength (Martin-Vigorimeter) (l: 0.6 bar; r: not measurable; 3-month follow-up = l: 0.86 bar, r: 0.36 bar). We also measured an improved electroneurography, with improved conduction velocity and amplitude as well as a decreased area reduction in the conduction block (Table 2) but a new motor nerve conduction block with an area reduction of >50% on the median nerve at the elbow on both sides. In the follow-up, CASPR2 antibodies were confirmed in the serum (1:10) with an indirect immunofluorescence assay but not measured in the CSF, therefore also presenting a treatment response.\r\nFurther differential diagnosis included Lewis-Sumner syndrome and amyotrophic lateral sclerosis as well as other more common causes of CASPR2 antibodies.\r\nWe could not find any signs of the first motor neuron in the clinical examination. While the patient described sensory symptoms in the innervation area of the median nerve bilaterally, they did not extend to the rest of its innervation area (thumb pad, lower arm) and did not progress over time. In addition, we could not find deficits in other sensory qualities or the sensory nerve conduction to objectify these deficits, indicating a Lewis-Sumner syndrome.\r\nHowever, we do acknowledge that the inflammatory neuropathies are most likely an overlapping disease spectrum, which is why we also call it MMN-like disease. Further diagnostics in our case also showed no indication of more common diseases associated with CASPR2 antibodies.","counts":{"Case":1,"Symptom":1,"Exam":5,"Treatment":1}},{"case_id":"PMC10488652_01","article_id":"PMC10488652","title":"Autoimmune Hemolytic Anemia Caused by Cold Agglutinin Antibodies in Systemic Lupus erythematosus-a Rare Association: Case Report","age":"22.0","gender":"Female","text":"A 22-year-old female patient with no relevant medical history was admitted to the emergency room of a third-level clinic for clinical symptoms that began 10 days before admission, including intermittent fever up to 39 C, general malaise, headache, myalgia, a mild self-limiting rash episode, diarrhea, and occasional emesis. On physical examination, the patient had mild pallor, icteric sclerae, supraclavicular and cervical adenopathies, synovitis in bilateral metacarpophalangeal joints, and grade II edema in the lower limbs. Paraclinical testing was performed (Table 1), and infectious etiology and hematological neoplasia were ruled out. The classification criteria for SLE were met. The patient was anti-DNA negative, a kidney biopsy was recommended because of the presence of proteinuria, which was consistent with class II mesangial lupus nephritis.  \r\nAutoimmune hemolytic anemia was also confirmed, with laboratory data revealing a cold agglutinin titer Positive dilution 1/128 at 4 C, hemoglobin 6.2 g/dl, hematocrit 18.1% and monospecific direct antiglobulin strongly positive for C3d and negative for IgG, leading to the diagnosis of cold agglutinin syndrome. The patient was transferred to the intensive care unit because of severe hematological involvement, as demonstrated by pancytopenia. Treatment was initiated with dexamethasone at a dose of 40 mg intravenously daily for 4 days and hydroxychloroquine at a dose of 200 mg daily orally, and the three cell lines showed clinical improvement and hematological recovery without the need for blood transfusions. Renal function remained stable and I did not present any other complications. The patient was discharged from the hospital after receiving outpatient treatment with prednisone at a dose of 5 mg daily orally, hydroxychloroquine at a dose of 200 mg daily orally and mycophenolate mofetil at a dose of 500 mg every 12 hours for one week and thereafter at a dose of 500 mg every 8 hours. She made steady progress to her rheumatology follow-up in the outpatient department with no new relapses.\r\nIn this case report, all procedures were performed according to the ethical and bioethical standards of the Scientific Committee of the Clinica de Occidente and the Declaration of Helsinki of 1964 and its later versions. Informed consent was obtained from the study subject prior to her participation and the publication of this study.","counts":{"Case":1,"Symptom":6,"Exam":2,"Condition":2,"Treatment":3}},{"case_id":"PMC10710131_01","article_id":"PMC10710131","title":"Digital PBL-CBL teaching method improves students' performance in learning complex implant cases in atrophic anterior maxilla","age":"26.0","gender":"Female","text":"Twenty-six cases with one to six teeth missing in the anterior maxilla were included as the clinic
