 through a median sternotomy. Myocardial protection was achieved with antegrade cold blood cardioplegia at a core temperature of 28 C.\r\nRight ventriculotomy was carried out, and VSD was closed with Dacron patch to reroute blood flow from left ventricle to truncal valve. Both right and left PAs separately originated from the posterior side of the main PA and were excised en bloc, and this area was patched with homograft. The ductal tissue was carefully removed, and the subclavian artery and the descending aorta were sewn to the homograft augmented main PA trunk rather than the relatively small ascending aorta to avoid potential bronchial obstruction. Twelve millimeters pulmonic homograft was used as RV-PA conduit. The postoperative course was uneventful. The postoperative echocardiography revealed no pressure gradient at the homograft site. Follow-up echo revealed progressive worsening of pressure gradient across the proximal right PA (peak PG 70 mmHg). He underwent self-expandable stent insertion at the proximal side of the right PA at 2 months after surgery, but this caused progressive narrowing of the left main bronchus. Therefore at 7 months of life, he underwent stent removal and PA repair under cardiopulmonary bypass. The patient's postoperative course was complicated with bronchomalacia, which required prolonged intubation. The patient was discharged from the hospital after 54-day hospital stay. Most recent follow-up echocardiography at 36 months of life showed almost no right PA stenosis, mild truncal valve regurgitation, and mild homograft regurgitation and excellent cardiac function.\r\nTAC with IAA is a very rare cardiac anomaly. The previous study about patients with TAC-IAA showed 12.5% early deaths among 16 patients after surgery. More recent report showed no mortality among 9 such patients.\r\nA number of issues need to be addressed during the repair of TAC-IAA such as aortic arch repair, right ventricular outflow tract reconstruction, and often truncal valve repair. Despite good early results, recurrent arch obstructions still develop in some patients during follow-up. The aortic arch reoperation rate in the congenital heart surgery study was 13.2% (5 of 38), with the arch in most of the patients being initially repaired by direct anastomosis. Another possible major complication from the direct end-to-side aortic arch anastomosis is bronchial compression. TAC-IAA has large main PA truncal segment. If the area, where the both pulmonary arteries were excised, were patched, then this main PA segment becomes a good conduit reaching to the descending aorta. Based on this idea, we used patch augmentation technique rather than direct anastomosis to the ascending aorta to avoid possible bronchial compression. This worked well; however, the patient developed proximal PA stenosis, which was away from the suturing line and required a balloon dilatation without success, followed by stenting. We believed that stent insertion might relief his symptom and self-expandable stent (5 mm x 20 mm) could be a possible better solution because it has high radial force and tends to take the shape of the vessel. It has also been reported to have lower incidence of edge tears, which is related to less thromboembolic events. Follow-up intravascular ultrasound analysis showed that the minimum stent area of the self-expandable stent increased by 33% at 6 months, whereas no change occurred in the balloon expandable stents, This was accompanied by a greater degree of intimal proliferation in the SE stents compared with BE stents. Strut malapposition can be another potential drawback, particularly if it happens in small vessels and small babies. In adult patient with acute ST-segment elevation myocardial infraction, strut malapposition at 3 days is significantly lower in SE stents than in BE stents. Based on these evidences, we chose SE stent in our patient. However, these benefits created a problem in this infant with bronchomalacia. We are not sure if it would not have occured with balloon expandable stent. He developed bronchial compression due to the stent with progressive worsening [Figure 2]. He eventually underwent surgical removal of the stent and PA repair. Postoperatively, we found this patient had bronchomalacia, which required prolonged mechanical ventilation. Bronchial stent might be a solution instead of surgery, but in a circumstance of proximal PA stenosis, surgical treatment would be the choice, particularly if we know the patient has bronchomalacia.\r\nBased on our experience, PA obstruction should be carefully evaluated. Stent insertion may have priority, particularly in a patient with proximal PA stenosis, but surgical repair may be the better choice in a young infant with congenital heart defect.\r\nThe authors certify that they have obtained all appropriate patient consent forms. In the form the patient(s) has/have given his/her/their consent for his/her/their images and other clinical information to be reported in the journal. The patients understand that their names and initials will not be published and due efforts will be made to conceal their identity, but anonymity cannot be guaranteed.\r\nNil.\r\nThere are no conflicts of interest.","counts":{"Case":1,"Exam":4,"Condition":1,"Treatment":11}},{"case_id":"PMC6354154_01","article_id":"PMC6354154","title":"An Early Diagnosis of an Ovarian Steroid Cell Tumor Not Otherwise Specified in a Woman","age":"30.0","gender":"Female","text":"A 30-year-old nulligravida presented herself in our institution because of the inability to conceive for four years. She was healthy, with no history of previous surgeries. Menarche had occurred at age 14. She had used oral contraceptives for nine years, having stopped taking them four years ago, followed by regular menses. No one in her family had history of infertility or any type of gynecologic cancer.\r\nGeneral examination and body mass index were normal. Analytically she had normal blood count and hormonal assay [FSH, LH, TSH, free T4, testosterone, and dehydroepiandrosterone (DHEA)]. A transvaginal ultrasonography was performed revealing a normed uterus and ovaries slightly enlarged and polycystic with a small echogenic mass in the right ovary of 15 millimeters. The hysterosalpingography was normal.\r\nHer husband was healthy and had no relevant past medical history and his semen analysis was normal.\r\nShe was proposed for a diagnostic laparoscopy and ovarian drilling. In the surgery, both ovaries were polycystic and a yellowish nodular solid and hardened formation of about two centimeters, vascular and friable to touch, was observed in the right ovary. That mass was removed, without rupture, and removed in an endoscopic bag. Tubal patency test confirmed bilateral permeability.\r\nThe removed mass was sent to histological examination. Macroscopically, it was a yellow-colored tumor measuring two centimeters in greatest diameter, with a smooth and well-limited surface. Microscopically, the ovarian parenchyma was almost entirely occupied by a tumor lesion, represented by large polyhedral cells with small nuclei and vacuolated eosinophilic cytoplasm, without mitosis and nuclear atypia. Hemorrhage and necrotic areas were absent (Figure 1). Immunohistochemical study revealed diffuse marking for calretinin, vimentin, and melan-A (Figure 2). These features were consistent with ovarian steroid cell tumor NOS.\r\nIn the postoperative period, the woman is followed up with serial measurements of serum testosterone levels and transvaginal ultrasound. At 24 months, she had no evidence of recurrence and began follow-up in reproductive medicine consultation. She was proposed to in vitro fertilization treatment, but despite gonadotropin therapy (in high doses, 300U) for ovarian stimulation, she had no response. At 36 months postoperatively, she is still not pregnant and no evidence of recurrence too.","counts":{"Case":1,"Condition":2,"Exam":6,"Treatment":2}},{"case_id":"PMC6949661_01","article_id":"PMC6949661","title":"Heterotopic Gastric Mucosa Presenting as Lower Gastrointestinal Bleeding: An Unusual Case Report","age":"23.0","gender":"Male","text":"A 23-year-old male was brought to the emergency of Hamad General Hospital in Doha, after being found on the floor dizzy and confused, with urinary incontinence although no one witnessed convulsions. The patient denied any fever, headache, chest pain, shortness of breath and palpitations, or cardiac diseases.\r\nOn examination, his pulse was 75 beats per minute, blood pressure 125/78, JVP was not raised, S1 and S2 were normal, and no added sounds on the chest examination. The patient was thought to have had a syncopal attack. His complete blood count and biochemical test were within the normal range. Computed tomography (CT) scan of the head was unremarkable and ECG showed left ventricular hypertrophy and early repolarization. Echocardiography, apart from moderate septal hypertrophy, was otherwise unremarkable.\r\nFurther history revealed that the patient had an episode of a large amount of melena before the syncopal attack, associated with nausea and two episodes of vomiting, but denied history of alcohol consumption, analgesic intake, and history of liver disease. In the course of time, the patient developed tachycardia of 122 bpm but blood pressure remained normal. His abdomen was soft, lax, nontender, and not distended. No masses were appreciated and bowel sounds were normal. Digital Rectal Examination (DRE) showed melanotic stool. Laboratory results showed a drop in hemoglobin from 13.2 to 8.4 and a high urea of 7.4. He was kept on intravenous fluids and proton pump inhibitors and transfused 2 units of packed red blood cells, and his hemoglobin level was monitored.\r\nEsophagogastroduodenoscopy (EGD) showed normal examination up to the third part of the duodenum with no active bleeding or altered blood. Colonoscopy was normal, whereas enteroscopy showed a jejunal diverticulum about 50 cms from the pylorus with fresh bleeding (Figure 1). Patient remained hemodynamically stable with no further drop in hemoglobin or another episode of melena. CT angiography was done in an attempt to identify a source of bleeding and for a trial of coil embolization, but it did not reveal vascular blush into the small bowel but an incidental finding of horseshoe kidney.\r\nThe patient underwent diagnostic laparoscopy that did not show any abnormality in the jejunal loops externally. Endoscopy was carried out to localize the jejunal lesion, but it was difficult to pass the scope beyond the duodenojejunal (DJ) junction. Midline laparotomy was performed to guide the enteroscope to the upper jejunum. A small lesion was seen on the serosal surface of the jejunum 30 cm from the DJ junction which endoscopically appeared as a suspicious diverticulum with whitish mucosal plaques. There was no active bleeding or clots. The enteroscope was then pushed further up to 130 cm in the bowel but no pathology was observed. Wedge resection of the suspicious jejunal lesion was carried out. The patient made smooth recovery from the surgery and did not develop further episodes of bleeding. He was last seen in the clinic after 2 years of surgery without any symptoms.\r\nHistology showed a small jejunal diverticulum with gastric heterotopic tissue. The specimen consists of a false diverticulum of the small bowel (jejunum) showing a focal, cystically dilated gland within the muscularis propria which, on deeper sections, showed gastric-type mucosal tissue. Focal crypt rupture was noted with mild reaction. The mucosa was unremarkable, and the specimen was negative for dysplasia and malignancy (Figures 2 and 3)","counts":{"Case":1,"Exam":9,"Symptom":2,"Treatment":2}},{"case_id":"PMC7086412_01","article_id":"PMC7086412","title":"Diabetes, Fetal Demise, and Shoulder Dystocia: The Importance of Glucose Screening to Prevent Catastrophic Obstetric Outcomes","age":"34.0","gender":"Female","text":"A 34-year-old gravida two, abortus one, para zero presented to the Labor and Delivery Unit at 40 weeks and three days estimated gestational age. She had been diagnosed earlier that day with an intrauterine fetal demise by the certified professional midwife who had been managing her pregnancy. The patient had not been seen by a physician nor a certified nurse midwife throughout the gestation. On review of her records, it was noted that the standard 50-gram one-hour glucose tolerance testing (GTT) had been deferred in favor of one day of monitoring of fasting and postprandial blood glucose levels at approximately 25 weeks gestational age. These values were not available for review but were reportedly normal per the patient. No testing of glycated hemoglobin (hemoglobin A1c) was performed while pregnant, and serial blood glucose monitoring was not repeated after 25 weeks gestational age.\r\nThe patient consented to our institution's standard panel of laboratory testing for patients diagnosed with intrauterine fetal demise. This testing includes a complete blood count, prothrombin time, partial thromboplastin time, fibrinogen level, hemoglobin A1c, thyroid stimulating hormone, urine drug screen, Kleihauer-Betke, rapid plasma reagin, parvovirus B19 antibodies, cytomegalovirus antibodies, lupus anticoagulant antibodies, beta-2 glycoprotein antibodies, anticardiolipin antibodies, factor V Leiden mutation, and prothrombin gene mutation G20210A.\r\nThe only abnormality from this set of laboratory results was a hemoglobin A1c value of 6.6%, diagnostic for diabetes based on criteria developed by the American Diabetes Association. No prepregnancy hemoglobin A1c or random glucose values were available for review.\r\nThe patient underwent an induction of labor with serial doses of misoprostol followed by Pitocin augmentation and artificial rupture of membranes. She met criteria for preeclampsia with severe features during her intrapartum course. She progressed to complete dilation and 0 station after approximately 36 hours. Pushing was initiated shortly thereafter, resulting in expeditious descent of the fetal head to +3 station. No further descent was appreciated over the next hour of pushing. Citing exhaustion, the patient requested assistance via an operative vaginal delivery. Forceps were applied and were successful in delivering the fetal head. The anterior shoulder did not deliver with gentle downward traction.\r\nA shoulder dystocia was identified. McRoberts maneuver with suprapubic pressure did not relieve the dystocia. The Rubin II and Wood's Screw maneuvers were similarly unsuccessful. The posterior arm was successfully delivered, but the shoulder remained impacted. McRoberts maneuver with suprapubic pressure was repeated, followed by the rotational maneuvers again without success.\r\nThese maneuvers were not repeated in the delivery room as the fetal head had partially avulsed from the body. The patient was transported to the operating theater due to the possibility of requiring a fragmented delivery. Uterine relaxation was achieved with 100 micrograms of intravenous nitroglycerin. This allowed the anterior shoulder to be disimpacted with Wood's Screw maneuver resulting in the delivery of an infant weighing 4190 grams (85th percentile for gestational age). The total length of the shoulder dystocia was 30 minutes.","counts":{"Case":1,"Exam":1,"Condition":1}},{"case_id":"PMC7086412_02","article_id":"PMC7086412","title":"Diabetes, Fetal Demise, and Shoulder Dystocia: The Importance of Glucose Screening to Prevent Catastrophic Obstetric Outcomes","age":"31.0","gender":"Female","text":"A 31-year-old gravida one, para zero, presented to the Labor and Delivery Unit at 37 weeks and one day estimated gestational age with a complaint of decreased fetal movement. She was found to have an intrauterine fetal demise.\r\nOn review of her records, it was noted that she had undergone a hemoglobin A1c measurement and 50-gram glucose tolerance test at her first obstetric appointment (nine weeks gestational age) per our institutional protocol due to her elevated prepregnancy body mass index of 34. Her hemoglobin A1c was nondiagnostic (5.0%), but her early GTT returned elevated at 160 mg/dL (Table 1). A follow-up three-hour 100-gram GTT was performed with fasting, one-hour, two-hour, and three-hour values of 86, 184, 147, and 135 mg/dL, respectively. No diagnosis of glucose intolerance was made due to having a single elevated value per the Carpenter Coustan criteria. She was advised to undergo a repeat three-hour GTT at 25 weeks gestational age, but deferred testing until 36 weeks gestational age. Her 36-week 100-gram GTT resulted with fasting, one-hour, two-hour, and three-hour values of 89, 216, 153, and 101 mg/dL, respectively. Again, no diagnosis of glucose intolerance was made due to having a single elevated value.\r\nThe patient consented to our institution's standard panel of laboratory testing for patients diagnosed with intrauterine fetal demise as previously described. The only abnormality from this set of laboratory results was a hemoglobin A1c value of 6.6%, diagnostic for diabetes based on criteria developed by the American Diabetes Association.\r\nThe patient underwent an induction of labor with serial doses of misoprostol followed by Pitocin augmentation and artificial rupture of membranes. She met criteria for preeclampsia with severe features during her intrapartum course. She progressed to complete dilation after approximately 24 hours. Pushing was initiated shortly thereafter, resulting in the delivery of the fetal head. However, the anterior shoulder did not deliver with gentle downward traction.\r\nA shoulder dystocia was identified. McRoberts maneuver with suprapubic pressure did not relieve the dystocia. The Rubin II and Wood's Screw maneuvers were similarly unsuccessful. The patient was rotated into the Gaskin position but the shoulder remained impacted. The patient was turned back into McRoberts position where suprapubic pressure was again unsuccessful. The rotational maneuvers were also repeated without success. Delivery of the posterior arm was attempted but could not be accomplished. A posterior axilla sling was placed using a pediatric feeding tube. These devices are available in the delivery rooms of our institution as an adjunct in the treatment of intractable shoulder dystocia. Traction on the sling was not successful in delivering the posterior shoulder. The sling was then used in a rotational manner to assist with a repeat attempt at Wood's Screw maneuver as described by Cluver and Hofmeyr. This was successful in relieving the shoulder dystocia resulting in the delivery of an infant weighing 3590 g (92nd percentile for gestational age). The total length of the shoulder dystocia was 30 minutes.","counts":{"Case":1,"Exam":5,"Condition":1}},{"case_id":"PMC7102447_01","article_id":"PMC7102447","title":"A Case of Acute Massive Bioprosthetic Mitral Valve Thrombosis Leading to Fulminant Heart Failure","age":"65.0","gender":"Male","text":"A 65-year-old male with a past medical history significant for hypertension, asthma, and minimally invasive bioprosthetic mitral valve replacement with a 33 mm mosaic mitral porcine valve one year prior presented with severe respiratory distress requiring emergent intubation. Initial electrocardiogram (EKG) revealed sinus rhythm with left anterior fascicular block, right bundle branch block, and evidence of left atrial enlargement. Initial troponin was normal at 0.04 ng/mL, but CK-MB and total CK were elevated to 21.2 ng/mL and 308 U/L, respectively. Anticoagulation studies revealed an INR of 1.0, a PTT of 28, and a PT of 10.9. Following transfer to the intensive care unit, the patient was started immediately on heparin infusion for suspicion of acute coronary syndrome (ACS); computed tomography angiogram (CTA) of the chest revealed moderate patchy ground-glass and nodular airspace opacities with interstitial edema and cardiomegaly. Transesophageal echocardiogram (TEE) was performed showing an acute thrombosis of the bioprosthetic mitral valve with severe mitral stenosis and regurgitation exhibiting a mean gradient of 20.1 mmHg and valve area of 0.68 cm2 (Figure 1). Of note, the patient had already completed 6 months of anticoagulation following his bioprosthetic mitral valve replacement and was no longer on anticoagulation. He was also found to have near complete leaflet immobility and subsequently underwent emergent redo mitral valve surgery utilizing a 33 mm St. Jude mechanical prosthesis. The valve was noted to have a massive amount of material on the ventricular side of each cusp (Figures 2 and 3) with pathology findings consistent with thrombosis. Following valve replacement, intraoperative TEE showed that the mitral valve mean gradient had improved to 4 mmHg. The procedure was well-tolerated, and the patient was successfully extubated and transitioned to warfarin for anticoagulation. Hypercoagulable workup was negative, and he was doing well on follow-up.","counts":{"Case":1,"Condition":2,"Symptom":2,"Treatment":1,"Exam":5}},{"case_id":"PMC7519975_01","article_id":"PMC7519975","title":"When a Dead Patient Is Not Really Dead: Lazarus Phenomenon","age":"33.0","gender":"Female","text":"A 33-year-old Hispanic, blind, and aphasic female with a history of diabetes mellitus on insulin at home, craniotomy for meningioma status post ventriculoperitoneal (VP) shunt placement, presented to the hospital with a one-day history of drowsiness and emesis. Computed tomography (CT) of the abdomen revealed several loops of small bowel in the right side of the abdomen with thickening immediately adjacent to the VP shunt concerning for inflammation of the bowel (Figure 1). CT head revealed areas of acute infarct seen involving the brain stem as well as the cerebellar hemispheres and moderate enlargement of the ventricular system with left-sided intraventricular hemorrhage (Figures 2 and 3). Due to the acute nature of her abdomen and the concern for a seeded VP shunt from this intra-abdominal infection, neurosurgery was consulted. The patient subsequently underwent externalization of her VP shunt at the neck. Concurrently, general surgery was consulted who decided to perform an explorative laparotomy for her acute abdomen. Preoperative records showed that her mean arterial blood pressure was ranging from 60 to 65 mmHg, heart rate was ranging from 70 to 82 normal sinus rhythm, the temperature was 98.4 F, and oxygen saturation was 96-98 on room air. Her preoperative electrocardiogram (ECG) showed normal sinus rhythm with no acute ST-T wave changes (Figure 4). Her preoperative laboratory values were as follows: white blood cell count 5300 per microliter of blood, hemoglobin 8.2 grams/deciliter, platelet 98000 per microliter of blood, prothrombin time 16.1 seconds, international normalized ratio 1.2, serum sodium 148 meq/liter, serum potassium 3.7 meq/liter, chloride 112 meq/liter, BUN 17 mg/deciliter, creatinine 0.4 mg/deciliter, serum glucose 125 mg/deciliter, serum calcium 8.2 mg/deciliter, magnesium 2.4 gm/deciliter, aspartate transaminase 32 units per liter, and alanine transaminase 43 units per liter. The patient was deemed to be at high risk for the major cardiac event after the surgery defined as death, myocardial infarction, or cardiac arrest within 30 days after noncardiac surgery. The Revised Cardiac Risk Index (RCRI) for preoperative risk was 3 points (class IV risk) based on the proposed intraperitoneal surgery, cerebrovascular disease, and preoperative treatment with insulin. Due to the emergent nature of the required surgery, an extensive discussion was done with the patient's next of kin who agreed to proceed with the surgery. The patient was well monitored intraoperatively in the standard manner under the direct supervision of the attending anesthesiologist. Intraoperatively, the patient suddenly started becoming bradycardic and went into asystole. Immediate cardiopulmonary resuscitative (CPR) efforts were initiated as per the standard advanced cardiovascular life support (ACLS) algorithm. High-quality chest compressions and epinephrine injection were administered every 3 minutes. Appropriate rhythm checks in between the chest compression were done. The patient already had an advanced airway in place for surgery. There were appropriate peripheral intravenous lines, triple lumen central venous catheter, and arterial line that was placed preoperatively for access and hemodynamic monitoring. The patient did not have a shockable rhythm throughout the cardiac arrest. After 30 minutes of CPR, the patient did not have any signs of the return of spontaneous circulation (ROSC). Thus, the patient was pronounced dead and all resuscitation efforts were ceased. The abdominal cavity was closed. The patient was disconnected from the ventilator with a plan to move to the mortuary. After 20 minutes of declaring the patient dead, spontaneous circulation and breathing were noted by the operating room (OR) staff. The patient's mean arterial blood pressure was noted to be 60 mmHg without any vasopressor agents and heart rate was 62 bpm, sinus rhythm with spontaneous respiration at a rate of 12 breaths per minute. She had an oxygen saturation of 88-90% on room air with a temperature of 98.2 Fahrenheit. Surgery was immediately resumed, and the patient underwent reexploration. The patient was found to have infarcted distal ileum and right colon secondary to scarred adhesion and inflammatory response involving VP shunt.\r\nSurgery was concluded, and the patient was transferred to the intensive care unit. Postoperatively, the patient was on 3 vasopressors. By postoperative day 2, the patient was off the vasopressor, and by postoperative day 3, the patient was extubated. On postoperative day 4, the patient was transferred to a regular room on the 2 L nasal cannula. Considering the patient's poor prognosis, the patient was provided comfort care and died on postoperative day 7.","counts":{"Case":1,"Condition":2,"Treatment":2,"Symptom":1,"Exam":3}},{"case_id":"PMC7718649_01","article_id":"PMC7718649","title":"A case of SLE with COVID-19 and multiple infections","age":"65.0","gender":"Female","text":"The patient is a 65-year-old woman with well-controlled SLE. Her long-term treatment for SLE is prednisone (10 mg p.o., once daily) and hydroxychloroquine (0.2 g p.o., twice daily). She lived 6 miles away from Huanan Seafood Wholesale Market where was the earliest epidemic focus of COVID-19 in Wuhan. She had neither been to the market nor closely contacted with confirmed or suspected COVID-19 patients.\r\nOn January 22, 2020, the patient presented fever (peak value: 39 C) with chills, rigor, muscular soreness and fatigue. She coughed with small amount of white sputum occasionally. Sometimes, she felt suffocated after movements. The next day, she developed nausea, anorexia, heartburn and diarrhea (liquid stool, three times per day). On January 25, she visited the clinic for the first time and was given oral medicines (oseltamivir 75 mg twice daily, arbidol 0.3 g twice daily, moxifloxacin 0.4 g once daily and Lianhuaqingwen capsules 1.4 g three times daily). The dosage of prednisone and hydroxychloroquine remained the same as her usually used.\r\nAfter taking the aforementioned drugs for 7 days, the patients' symptoms did not improve and returned to the clinic. The outpatient doctor took nasopharyngeal swabs to test SARS-CoV-2 and influenza A virus by real-time reverse transcription polymerase chain reaction (rRT-PCR), both of which were positive. At the same time, her thoracic CT showed bilateral patchy ground-glass opacities (according to the medical records, images not available). Hence, human immunoglobulin was given intravenously (IVIg, 5 g once daily) with the aforementioned oral medicines and increased dose of prednisone (25 mg once daily) for 5 days since February 4. Intravenous immunoglobulin is immunoglobulin G made from healthy human plasma, and low dose of IVIg was used for nonspecific and wide-spectrum antiviral and antibacterial therapies.\r\nOn February 8, the patient' symptoms were relieved partially, but the second thoracic CT showed pulmonary lesions extension (according to the medical records, images not available). Laboratory tests found leucocytosis (11.09 x 109/L), neutrophilic leucocytosis (9.46 x 109/L) and normal lymphocyte count (1.33 x 109/L) (Table 1). Then, the patient was admitted to fever ward of Sino-French New City Branch of Tongji Hospital, a designated hospital for diagnosis and treatment of COVID-19 in Wuhan.\r\nOn admission, the patient presented with mild coughing. Physical examination revealed that the conscious of the patient was clear, temperature was 37.1 C, blood pressure was 136/74 mmHg, pulse rate was 77 beats per minute, respiratory rate was 18 breaths per minute and peripheral oxygen saturation under oxygen inhalation (3 L/min) through nasal catheter was 98%. The results of laboratory examinations were presented in Table 1. White blood cell count, neutrophilic granulocyte count and lymphocyte count were normal. Several inflammatory indicators were high. Mild injuries of kidney, myocardium, liver and coagulation function were observed. M. pneumoniae infection was found by serology (Figure 1). Glycosylated hemoglobin was 7.1%, and postprandial blood sugar was higher than 11.1 mmol/L. Routine tests of stool and urine samples were normal.\r\nThe patient was diagnosed of SLE combined with COVID-19, influenza A, M. pneumoniae infection and diabetes mellitus. Prednisone (25 mg p.o., once daily) and hydroxychloroquine (0.2 g p.o., twice daily) were given to cover the concurrence of SLE and COVID-19. Pantoprazole (40 mg p.o., once daily) was used to prevent gastric mucosal injury caused by prednisone. Levofloxacin (0.5 g p.o., once daily) was given to deal with bacterial and M. pneumoniae infection. Then, acarbose (50 mg before lunch and dinner daily) was applied to control the blood glucose.\r\nOn the 6th day of hospitalization, the symptoms of the patient eased. Thoracic CT (February 14, 2020) showed bilateral ground-glass, patchy and cord-like shadows (Figure 2a), which was better than the second CT (February 8, 2020) before admission (according to the medical records). On the 8th day of hospitalization, some laboratory examinations were retested, and most of which were improved (Table 1). Dosage of prednisone was reduced to 15 mg once daily as pneumonia improved.\r\nOn day 15 of hospitalization, laboratory tests revealed that most of the values were better than previous tests (Table 1). Inflammatory indicators such as serum ferritin, high-sensitivity C-reactive protein (hsCRP), erythrocyte sedimentation rate (ESR) and interleukin-6 were lower. Subgroup typing of lymphocytes represented elevation of CD4+ T cells (1517/muL) and reduction of CD8+ T cell (252/muL). The ratio of helper T cell versus suppressor T cell was elevated (6.01). The thoracic CT (February 23, 2020) showed a modest upturn in the lesions (Figure 2b). The dosage of prednisone was then reduced to 10 mg once daily as pneumonia improved. Nasopharyngeal swabs were collected for rRT-PCR of SARS-CoV-2 on day 16 and 18, both of which were negative. Two days later (day 20), the patient developed wrist pain, and loxoprofen (60 mg p.o., twice daily) was used to alleviate it.\r\nOn day 22 of hospitalization, no symptoms of the patient were observed. Laboratory findings (Table 1) and thoracic CT (Figure 2c) indicated improvement relative to last time. The rRT-PCR of SARS-CoV-2 of the third nasopharyngeal swab was still negative. Serum immunoglobulin M (IgM) and immunoglobulin G (IgG) of SARS-CoV-2 were 33.73 AU/mL (normal range: <=10 AU/mL) and 198.77 AU/mL (normal range: <=10 AU/mL), respectively. Since the patient met the criteria of discharge (temperature came back to normal for over 3 days, respiratory symptoms significantly improved, thoracic radiology showed obvious improvement in acute exudative lesions and negative results of rRT-PCR of SARS-CoV-2 for two nasal pharyngeal swabs over 24 h), she was discharged on March 4, 2020. She has been in good health without any symptoms after discharge.\r\n Ethical statements: This study was approved by the Ethics Committee of Tongji hospital, Huazhong University of Science and Technology. All the materials of the patient were anonymous and written informed consent was waived by the ethics committee.","counts":{"Case":1,"Condition":14,"Treatment":20,"Symptom":12,"Exam":15}},{"case_id":"PMC8627357_01","article_id":"PMC8627357","title":"Septic Pulmonary Embolism Causing Recurrent Pneumothorax in an Intravenous Drug User without Right-Sided Valvular Vegetation in Infective Endocarditis","age":"36.0","gender":"Male","text":"A 36-year-old HIV-negative male with a history of methamphetamine and intravenous heroin use initially presented to an outside facility with left upper extremity cellulitis and dyspnea one week prior to admission. At the outside facility, a computed tomography (CT) of the left upper extremity revealed cellulitic changes with concerns for gas formation. He was transferred due to the need for a higher level of care. Upon arrival, a physical exam revealed the patient in mild distress with bilateral rhonchial breath sounds, extensive edema, and erythema of the left upper extremity without crepitus. Initial laboratory analysis was remarkable for WBC 15.07 k/mm3, a urine drug screen positive for amphetamines and opiates, and methicillin-resistant Staphylococcus aureus growth in the blood cultures. Repeat CT of the left upper extremity revealed soft tissue swelling without gaseous formations. Chest X-ray revealed bilateral diffuse infiltrates. Intravenous vancomycin, clindamycin, and piperacillin-tazobactam were initiated. However, due to increasing respiratory distress and acute hypoxia to 88% via pulse oximetry, the patient was intubated and placed on ventilator support. A CT chest without contrast revealed diffuse consolidative processes, cavitation foci, diffuse mediastinal and axillary lymphadenopathy, pleural effusions, and areas concerning for septic emboli (see Figure 1).\r\nOrthopedic surgery was consulted for debridement of the left upper extremity; however, debridement was delayed due to patient instability. Transthoracic echocardiogram revealed no valvular vegetations. A transesophageal echocardiogram was performed that revealed no valvular abnormalities as well (see Figure 2). Upon culture and sensitivity results, the antibiotics were changed to ceftaroline, gentamicin, and linezolid for presumed IE according to Duke's criteria in the absence of valvular vegetations.\r\nIn the following days, the patient had a secondary spontaneous PTX (see Figure 3) requiring surgical chest tube placement, paralytic usage in addition to renal replacement therapy due to worsening acidosis and uremia. Following the initial placement of the surgical chest tube, a subsequent PTX (see Figure 3) occurred, requiring an additional surgical chest tube to be placed with the resolution of the PTX. Two days following the removal of the first chest tube, the patient spontaneously had the development of large subcutaneous emphysema spreading of the anterior thorax that was improved with increasing the wall suction of the existing chest tube (see Figure 4). After a course of hemodialysis, lung-protective ventilation, neuromuscular blockade, and antibiotic management, a tracheostomy and percutaneous endoscopic gastrostomy were performed, and the patient was downgraded from the intensive care unit to a step-down unit with chest tubes to water seal. The patient was subsequently discharged to a rehabilitation facility.","counts":{"Case":1,"Condition":1,"Symptom":2,"Exam":6,"Treatment":2}},{"case_id":"PMC9387390_01","article_id":"PMC9387390","title":"Palliative Endoscopic Salvage of a Functionally Obstructed Gastrojejunostomy - Report of Technique","age":"57.0","gender":"Male","text":"A 57-year-old man with no significant past medical or surgical history initially presented with postprandial abdominal fullness and diarrhea. Computed tomography (CT) imaging showed nonspecific mesenteric edema. An upper gastrointestinal (UGI) contrast study and barium enema were unremarkable. Approximately three months later, a repeat CT of the abdomen demonstrated a central mesenteric mass abutting the pancreas, encasing the superior mesenteric vessels, causing extrinsic narrowing of the second portion of the duodenum.\r\nThe patient underwent CT guided biopsy of the mass; this was consistent with invasive moderately to poorly differentiated adenocarcinoma, thought to have arisen from the upper gastrointestinal tract and/or pancreaticobiliary tract. Given his locally advanced disease, he was nonoperable and started on chemotherapy. Approximately 11 months after the initiation of chemotherapy, he presented to the hospital with nausea, emesis, and abdominal distention. His imaging was consistent with gastroduodenal outlet obstruction secondary to the pancreatic mass (Figure 1).\r\nThe patient underwent laparoscopic gastrojejunostomy (GJ) for palliative bypass by an outside surgeon. This was complicated by an anastomotic leak on postoperative day (POD) 7 and he underwent relaparoscopy. Sutures placed at the GJ were noted to be loose; these were reinforced, intra-abdominal abscesses were drained, and a surgical drain was left in place.\r\nAn UGI study performed on POD 11 (4 days after the re-operation) showed no leak; however, no contrast was noted to empty from the GJ. There was slow emptying of contrast into the duodenum and proximal jejunum. A follow-up CT on POD 14 (7 days after the second operation) revealed distension of the stomach and proximal small intestine, with otherwise improved findings. His nasogastric (NG) tube was replaced with subsequent drainage of > 3 liters of fluid. On POD 16, esophagogastroduodenoscopy (EGD) was performed; per report, the GJ was widely patent without evidence of stricture. Bilious fluid was noted in the stomach.\r\nWith his failure of progression, the patient was then referred to our service for further management. Given clinical suspicion of delayed gastric emptying secondary to long-standing malignant obstruction, a gastrojejunal tube was placed by interventional radiology (POD 21) to allow for long term gastric decompression and possible distal jejunal feeds. The jejunal limb was unable to be placed through the surgically created GJ; it was placed post pyloric into the proximal jejunum. The patient was discharged two days post-procedure (POD 23).\r\nThe patient had two subsequent readmissions for high gastrostomy tube output. A UGI study revealed preferential drainage of contrast into the duodenum; no contrast was seen traversing the GJ. Given our concerns about the location of the jejunal extension, we proceeded with endoscopic placement of a nasojejunal (NJ) tube into the efferent limb of the GJ to allow for complete gastric decompression. EGD (Figure 2) demonstrated a widely patient afferent limb; push enteroscopy showed the jejunal limb of the gastrojejunal tube in the proximal jejunum. The efferent limb was subsequently intubated, and a NJ tube was placed. It was noted to be sharply angulated which was thought to be contributing to a functional obstruction and delayed gastric emptying. The patient was discharged with gastric decompression and NJ feeds.\r\nHe required replacement of this NJ tube multiple times, and due to the findings noted on endoscopy, we considered stent placement into the efferent limb in an attempt to encourage preferential drainage. An AXIOS  stent (20 mm x 10 mm, Boston Scientific, Natick, MA) was placed. After initial symptomatic improvement, recurrent symptoms of delayed gastric emptying prompted a repeat UGI study which showed stent migration. We then placed a through the scope uncovered WallFlex  colonic stent (25 mm x 90 mm, Boston Scientific, Natick, MA) (Figure 3). Four days later, a repeat CT showed a small amount of extraluminal air abutting the stent. A repeat UGI study (Figure 4) revealed markedly improved gastric emptying into the efferent limb through the stent. The patient was discharged home, tolerating gastric tube feeds and oral liquids. He was subsequently ultimately transitioned to hospice care.","counts":{"Case":1,"Symptom":4,"Exam":14,"Treatment":9,"Condition":3}},{"case_id":"PMC9532611_01","article_id":"PMC9532611","title":"Case report: 17α- hydroxylase deficiency due to a hotspot variant and a novel compound heterozygous variant in the CYP 17 A 1 gene of five Chinese patients","age":"12.0","gender":"Female","text":"In the first family, the index patient (patient 1) was a 12-year-old female-phenotype patient who presented with hypokalemic (1.8 mmol/l) weakness that was accompanied by hypertension (138/94 mmHg). She was born after an uneventful pregnancy and was the first child in the family. Her height was 142 cm and her weight was 44 kg. She had Tanner stage 1 breasts, pubic hair, and no axillary hair. Her external genitalia were female type, but with infantilism. She had three younger siblings, all with female external genitalia. All siblings of the index case were asymptomatic and no other family member had a similar history of hypertension and periodic paralysis. But, the third (karyotype 46, XY, patient 2) and fourth (karyotype 46, XX, patient 3) children were twins and had hypertension on examination (Table 1). At the age of 4 years, the proband had undergone surgery at the local hospital for an inguinal hernia on the left side. Regrettably, no pathological analysis of these tissues was performed.","counts":{"Case":1,"Symptom":1,"Condition":2}},{"case_id":"PMC9532611_02","article_id":"PMC9532611","title":"Case report: 17α- hydroxylase deficiency due to a hotspot variant and a novel compound heterozygous variant in the CYP 17 A 1 gene of five Chinese patients","age":"6.0","gender":"Female","text":"In the second kindred, a 6-year-old child (patient 4) with female phenotype presented for incidentally diagnosed increased blood pressure during a school health check. Her weight and height were 49 kg (3 SDs above the mean) and 136 cm (2 SDs above the mean), respectively. The bone age of patient 4 was approximately 6 years. In kindred 3 (patient 5), the parents noted that the child had with a vulva, but no vagina. However, testicular masses were palpable in the respective inguinal regions. The child underwent surgical exploration, which revealed that a vagina was absent and right and left masses were confirmed to be testes.\r\nBlood tests were performed according to standard methods. Blood hormone, Adrenocorticotropic hormone (ACTH), plasma renin activity (PRA), aldosterone (ALD), 17alpha-hydroxyprogesterone (17OHP) AMH (anti-Mullerian hormone), and inhibin B (INB) were measured by chemiluminescence; cortisol (F) was measured by electrochemiluminescence; dihydrotestosterone (DHT), and androstenedione (AD) were measured by liquid chromatography-mass spectrometry; dehydroepiandrosterone (DHEA), luteinizing hormone (LH), follicle-stimulating hormone (FSH), estradiol (E2), testosterone (T), progesterone (P), and prolactin (PRL) levels were measured by enzyme-linked immunosorbent assay (Table 1).\r\nWith the consent of the patient's parents, we collected the peripheral blood of the patients and their parents in three families. In addition, in family 1, peripheral blood of the proband's sister was collected. Later, DNA was extracted, next-generation sequencing (NGS) sequencing was performed for the probands. The observed variants in the probands were confirmed and the family members were screened for the respective variants by Sanger's method. A minimum of 3 mug DNA was used to prepare indexed Illumina libraries (MyGenostics, Beijing, China), according to the manufacturer's protocol. The exons of genes associated with congenital adrenal hyperplasia (all the genes including ABCD1 AIRE ARMC5 CDKN1C CYP11A1 CYP11B1 CYP11B2 CYP17A1 CYP21A2 DHCR7 GK GK2 GLCCI1 GNAS H6PD HESX1 HSD11B1 HSD3B2 LHX4 MC2R MCM4 MEN1 MKS1 MRAP NNT NR0B1 NR3C1 NR5A1 PCSK1 PDE11A PDE8B POMC POR PRKACA PRKAR1A PROP1 REN RXRA RXRB SOX3 STAR TBX19 TP53 TXNRD2) were targeted via a gene capture strategy, using the GenCap custom enrichment kit (MyGenostics), according to the manufacturer's protocol. The enriched libraries were sequenced on a NextSeq 500 sequencer (Illumina, San Diego, CA, USA) to generate paired-end reads of 150 bp. Single-nucleotide polymorphisms, insertions, and deletions were identified using Genome Analysis Toolkit software.","counts":{"Case":1,"Exam":1}},{"case_id":"PMC9650410_01","article_id":"PMC9650410","title":"A MacIntyrean account of chronic moral injury: Assessing the implications of bad management and marginalized practices at work","age":"67.0","gender":"Female","text":"Many in organization studies and business ethics will be familiar with the rise and fall of Theranos:a biotech company started by Elizabeth Holmes that hit a 9-billion-dollar valuation just before leadership was indicted on charges of fraud. The story is one that obviously demonstrates several important lessons regarding deception in Silicon Valley, transparency in leadership, and the corrupting power of greed. We believe there is also a story of CH-MI here9. Though there are dozens of individual cases we could explore, the most glaring is that of Ian Gibbons, the late biochemist and chief scientist at Theranos. We argue that Gibbons was a good chemist. In striving to maintain the standards of his practice within a vicious institution, he met his untimely death. As we trace the Theranos story, it is worth noting that we will be primarily using the reporting and narrative of Carreyrou at The Wall Street Journal. Carreyrou published dozens of articles on Theranos between 2014 and 2019, including the original expose that ousted the company. He is also the author of Bad Blood: Secrets and Lies in a Silicon Valley Startup Carreyrou, which presents the entire Theranos story from inception to collapse.\r\nThe idea for Theranos began with CEO and founder, Elizabeth Holmes in 2003. She dropped out of Stanford to pursue the dream of revolutionizing healthcare by using small fingerpricks of blood to run hundreds of diagnostic tests on a portable machine. By 2010, Holmes was able to secure nearly 100 million dollars in venture capital and built an impressive board of directors. She was able to do so because she presented an inspiring mission. Her product would, she claimed, make preventive care affordable and accessible to the masses. Holmes championed Theranos in this way:as an agent for health equity. As she explained in an interview with Bill Clinton,\r\nOur work is in the belief that the access to healthcare information is a basic human right. [...] Health data needs to be accessible to people before they get sick. [...] Our work is in being able to make lab testing accessible in time for therapy to be effected and to do that in a way where every person irrespective of their insurance status, irrespective of where they live, can afford the ability to get a test done (Holmes,).\r\nTheranos supposedly existed for this purpose:to expand access to needed health care. Though this purpose was communicated in interviews and pitches, Theranos was never actually a company that principally sought to expand access to health. In truth, Holmes had a very different mission:to be a billionaire (Carreyrou,, p. 11). This is where the vicious formation of the institution began:at the beginning and with the wrong end. She sought exponential growth over and above actually developing an innovative product in biotechnology that would contribute to human flourishing and the common good.\r\nThis end:becoming a billionaire:colored the way Holmes led and managed everything at Theranos. This is, after all, the usefulness of final ends (Frankfurt,). They inform, guide, and direct our actions, and they do so regardless of whether the appropriate final ends are pursued. Holmes made extraordinary claims about the capabilities and possibilities of the technology that could not be supported by her chemists or engineers. She carefully created silos to ensure that employees did not understand the full scope of the project's development. She held outrageous expectations for her workers, sometimes demanding departments to run 24/7. She treated employees as disposable linchpins, quickly discarding those who did not fall in line. Even worse, she would punish those who challenged the morality of her actions by firing them, demoting them, or ceasing to give them pertinent information. \"She was so laser-focused on achieving her goals that she seemed oblivious to the practical implications of her decisions\" (Carreyrou,, p. 26). Indeed, Holmes would pursue whatever means necessary to make her billionaire vision a reality. Vice was not merely excused. It was expected.\r\nMoreover, Holmes's myopic billionaire vision effectively marginalized the two \"core\" practices vital to the success of her project:biochemistry and engineering. She hired excellent scientists who were trained at Cambridge and Ivy League institutions. However, Holmes did not want them to be excellent scientists. She wanted technocrats to create her product for the sake of maximizing profitability. Holmes insisted that \"the Edison\":the machine that Theranos was working on to conduct the blood tests:had to be portable and had to use only a small droplet of blood. She was uncompromising in these demands because she already promised them to investors. She did this without really understanding whether they were scientifically possible. When the evidence repeatedly showed that more than a droplet of blood was needed to conduct the tests, she barreled forward with more vigor. It was as if she hoped to yield a successful test by sheer force of will. When her teams did not produce the desired answers, she shrouded their results in secrecy. She kept moving things forward:scheduling clinical trials and seeking partnerships with drug stores:though the technology was not ready or working accurately. Holmes settled for the guise of success in the lab, not excellent science.\r\nIt was within this highly vicious structure at Theranos that Ian Gibbons worked as the Director of Chemistry. Carreyrou develops an exceptional character sketch of Gibbons during his time at Theranos, explaining that Gibbons was known for his dedication to and love of his craft (p. 281). \"He was passionate about the science of blood testing and loved to teach it. In the company's early years, he would sometimes hold little lectures to educate the rest of the staff about the fundamentals of biochemistry\" (Carreyrou,, p. 281). Most importantly, Gibbons had high standards of excellence. He was uncompromising in not making concessions or cutting corners that would somehow endanger the veracity of test results and subordinate concern for patients to the product itself. He was tireless in his conviction that things \"must be done right\" (Carreyrou,, p. 202). Gibbons was, in fact, a chemist who pursued excellence in his practice, and he was beloved by his coworkers and his dear wife.\r\nAs a result, many things at Theranos troubled him. He was open about his frustrations with Holmes's management, particularly the intentional silos she created, the secrecy, and the exaggerations about the technology's readiness. He expressed frustration to a co-worker when Theranos moved forward with pursuing a partnership with Walgreens, implementing Theranos clinics at their neighborhood pharmacies. The technology was not ready; it did not work. Gibbons's willingness to vocalize the truth about the science threatened the secrecy Holmes worked hard to maintain. She did not want his expert opinion, even though his job was to do precisely that:to provide his expert opinion. When Holmes caught wind that Gibbons was discussing these realities with coworkers, she attempted to fire him. However, his expertise proved invaluable, and he was offered another role at the company without the same access to information and authority in his craft. He took the demotion, hoping he could continue doing what he loved in some worthwhile capacity.\r\nWhen Gibbons was re-hired and demoted at Theranos, he was effectively silenced and removed from the lab. He started working from home as a mere technical consultant, remaining steadfast in his commitment to excellence. The new Director of Chemistry was much more willing to compromise in places where Gibbons would not relent. However, Gibbons was still committed to the task, arguing for hours over the phone about the importance of accurate testing and how anything less than excellent results would negatively impact patient wellbeing. His unwavering pursuit of standards rendered him a defunct chemist at a company he knew to be deceitful.\r\nThe circumstances were horrible, so why didn't he just leave? At this point, Gibbons was 67 years old, he had recently been diagnosed with cancer, and he was battling undiagnosed depression. As Carreyrou explains, he felt it was unlikely that he would be able to secure another job as a chemist if he left Theranos (p. 204). Things just kept getting worse from here for Gibbons. He was called to a deposition in a case regarding several Theranos patents, and this forced him into a corner. He had two choices: lie and perjure himself about the nature and origin of the patents, or break an NDA with Theranos and face Holmes's wrath. It was a heavy moral and existential predicament, and Gibbons saw no way out. Theranos attorneys kept pressuring him to lie, to push back the deposition, to use his cancer as an excuse to evade court, and so on. But this did not mesh with Gibbons's character. He was not a liar, but if he were to go on, he also needed a job and health insurance. This acute MI at the end of his long chronic struggle at Theranos weighed on Gibbons heavily. Linking this instance to Figure 1, it is worth emphasizing here that this is a case of experiencing CH-MI and A-MI in tandem. In the midst of this painful dilemma, Gibbons tragically took his own life. Theranos leadership barely spoke of it after he had been with the company for 10 years and produced most of the patents that they had secured. Rather than conveying her remorse to his wife, Holmes told her that Gibbons's laptop and corporate documents belonged to Theranos and that she needed to return them to the company promptly.\r\nIn looking at the story of Ian Gibbons and his time at Theranos, it is easy to see the marginalization of practices on display. Holmes vigorously pursued a billion-dollar valuation at the expense of scientific integrity. She hired particularly excellent scientists and demanded that they sacrifice their commitment to excellence for the sake of Theranos and its feigned success. Chemists and engineers at Theranos were expected to betray the standards of the scientific community. In fact, they were expected to not care about them at all. One could argue that Gibbons was so deeply habituated as an excellent chemist that he could not simply betray those standards for Theranos. His virtuous desires could not be deformed by the Weberian manager. Instead, during his last few years at Theranos, Gibbons was forced into a position of silent protest, enduring the stress of significant cognitive dissonance. There is a particular sort of pain when someone like Gibbons:a practitioner committed to excellence in his practice:is pressured to comply with vice as a worker in a poorly formed institution. We describe this pain as CH-MI.\r\nIt is easy look at this case study and draw the conclusion that such circumstances are rare:to hold up the example of Elizabeth Holmes as a fanatical egomaniac. Likewise, it is easy to hold up the example of Theranos as an exceptionally disingenuous start-up. Following MacIntyre's critique, perhaps this isn't so. Perhaps there are more lawyers being thwarted the opportunity to work for justice, doctors being thwarted the opportunity to work for health, and chemists being thwarted the opportunity to uphold the standards of scientific method than we are comfortable knowing. Holmes's persona and the structure she implemented at Theranos were, after all, openly borrowed from Steve Jobs. She captivated Silicon Valley because she was familiar:tenacious, cold, and obsessed with success. The secrecy and results-driven demands that characterized the Theranos culture were easily dismissed and excused because of how closely they mirrored the norm. Thus, we conclude that the setting ripe for CH-MI is common and pervasive.","counts":{"Case":1,"Exam":1}},{"case_id":"PMC9815523_01","article_id":"PMC9815523","title":"Current treatment strategies for primary upper extremity deep venous thrombosis; a retrospective observational multicenter case series","age":"40.0","gender":"Unknown","text":"A total of 115 patients with pUEDVT were included and divided into three distinct treatment strategies; A conservative treatment group (group 1, N = 35), an invasive treatment group (Group 2, N = 53) and a cross-over group of patients treated surgically after a first period of conservative therapy (Group 3, N = 27). The mean ages among all three groups were between 30 and 40 years old. The side of the affected arm and the percentage of patients with effort induced thrombosis (Paget-Schroetter syndrome) were similar in all groups. The median follow-up was between 36, 26, 22 months for groups 1-3 respectively (Table 1).\r\nTen patients (22.2%) received additional diagnostic imaging (CTv, MRv or angiography) besides duplex scanning to determine the etiology of the thrombosis. Six patients (13.3%) were diagnosed with vTOS, four (8.9%) with idiopathic thrombosis. In the remaining 35 patients (77.8%) no additional imaging of the thoracic outlet was performed and thus no distinction in pUEDVT etiology could be made. However, we ensured that no factors for sUEDVT such as indwelling vascular devices, malignancies or limb immobilization were present in these patients. Forty-four patients (97.8%) were treated with antithrombotics; 25 DOAC, 18 vitamin K antagonist, one antiplatelet therapy. One patient only received physical therapy focused on posture improvement without additional medicinal therapy (Table 1). There was a wide variation in duration of antithrombotic therapy ranging from six weeks to 94 months with a median length of six months (IQR 23.5 months). Sixteen patients (35.6%) were symptom free at last follow-up (median 36 months), the remaining 29 patients had persisting or recurrent symptoms (N = 22) or recurrent thrombosis (N = 7). Ten of these patients were eventually treated surgically and were included as cross-over patients of group 3 for the postoperative follow-up. Three patients suffered bleeding complications under DOAC usage; one patient had frequent but mild epistaxis (Grade 1), one had severe menorrhagia (Grade 2) and ceased anticoagulation therapy, the third patient required a blood transfusion due to severe vaginal blood loss (Grade 3) but continued anticoagulation therapy afterwards. The only patient who required a reintervention was the patient treated with physical therapy. Because of persisting symptoms a TOD and PTA was performed leading to full symptom resolution.\r\nIn group 2, five treatment categories could be distinguished. The majority of patients were treated with surgery; 31 patients (58%) with CDT followed by TOD, 14 patients (26%) with anticoagulant therapy followed by staged TOD, and five patients (9%) with TOD only. Three patients did not primarily undergo surgery but received intravenous stent placement (N = 2; 4%) or CDT only (N = 1; 2%). Additionally, 44 patients (83%) received some form of post procedural anticoagulation therapy for a median duration of six months (IQR 10.5 months); 22 patients with DOACs, 19 with vitamin K antagonists, one with low-molecular weight heparin, and two with antiplatelet therapy.\r\nAfter primary treatment, 24 patients were symptom free and 29 patients had recurrent or persisting symptoms. Seven patients suffered an ipsilateral recurrent thrombosis, the remaining 22 patients were symptomatic without recurrent thrombosis (Table 2). In 14 of these symptomatic patients a total of 23 reinterventions were performed leading to symptom resolution in an additional five patients (Table 3). The majority of reinterventions were PTA's for symptomatic recurrent stenosis (N = 10, 12 PTA's). Three patients underwent a redo TOD; two because of an insufficiently removed first rib and one because of an accidental second rib removal during primary intervention. The patient primarily treated with CDT was relieved of symptoms after TOD. The two primarily stented patients both suffered a stent fracture and were treated with TOD and PTA leading to full symptom resolution. Finally, in three patients with PTA resistant stenosis stents were placed, leading to full symptom resolution in two. The third patient was additionally treated with a pectoralis minor release and finally a subclavian vein bypass, but remained symptomatic. Two patients (4%) suffered postoperative bleeding complications (Grade 2 & 3). Both were surgical explored without finding a clear bleeding focus. Six additional surgery related complications occurred in five patients, none led to long-term morbidity (Table 4).\r\nGroup 3 contained 10 cross-over patients previously mentioned under group 1 and 17 patients with recurrent symptoms who were referred to our hospitals for further analysis of VTOS. All 27 patients were originally treated conservatively with anticoagulants but experienced either persisting or recurrent symptoms. Thirteen patients suffered a recurrent thrombosis, (five while under anticoagulation therapy) and 14 patients had persisting or recurrent symptoms without thrombosis. Twenty-one patients were treated with vitamin K antagonists and six with a DOAC, for a median duration of 13 months prior to surgical intervention. All patients underwent dedicated diagnostic imaging (CTv, MRv or angiography) to confirm VTOS, after which TOD was performed. Eighteen patients received postoperative anticoagulation therapy for a median duration of 2 months (Table 1). Eleven patients remained symptom free after primary surgical intervention, but 16 patients had persisting symptoms (N = 12) or suffered recurrent thrombosis (N = 4) (Table 2). Six of these patients underwent additional reinterventions leading to full symptom resolution in two patients, and 13 symptom free patients in total (48.1%) at last follow-up. Bleeding complications occurred in five patients; One patient had a bleeding complication after CDT (Grade 2) and four patients suffered a haematothorax (three grade 2, one Grade 3) of which three required surgical exploration and one was treated with a chest drain. Finally, one patient developed a pneumonia that required antibiotic treatment (Table 4).","counts":{"Case":1,"Treatment":3,"Condition":1}},{"case_id":"PMC9969157_01","article_id":"PMC9969157","title":"A case report of necrotizing enterocolitis in a moderately preterm neonate with LCHADD-A call to focus on the basics while utilizing advanced new therapies","age":"7.0","gender":"Male","text":"This baby boy was born at 33 2/7 weeks gestational age to a 36-year-old gravida 3, para 3 mother with negative serologies, except for Group B Streptococcus unknown, whose pregnancy was complicated by medication-controlled gestational diabetes and gestational hypertension, and a family history significant for a sibling with LCHADD. The patient was delivered by cesarean section at an outside facility due to concern for serious maternal morbidity associated with preeclampsia, specifically HELLP syndrome. Neonatal resuscitation was unremarkable and the Appearance, Pulse, Grimace, Activity, and Respiration (APGAR)s were 8 and 9 at 1 and 5 min, respectively. The birth weight was 2.46 kg, length 47.5 cm, and head circumference 32.5 cm, which were all appropriate for gestational age. The patient was admitted to the level III NICU at the birth facility. A peripheral intravenous line was placed and 10% dextrose fluids at 150 ml/kg/day were initiated. At six hours of life, based on the significant family history and the maternal HELLP syndrome frequently seen in mothers with gestations complicated by LCHADD, our patient was transported to our level IV NICU for metabolic consultation and further evaluation and management. On admission, serum acylcarnitine profile was consistent with LCHADD given elevation of C16-OH and C18-OH levels with the ultimate diagnosis based on perinatal and family history in conjunction with biochemical and molecular studies (Table 1). Echocardiogram shortly after arrival showed a small patent ductus arteriosus and patent foramen ovale. Enteral nutrition with donor human milk was initiated at 12 h of life. Triheptanoin was initiated at 14 h of life at a dose of 0.5 g/kg/day and advanced 0.5 g/kg every 5-7 days. As feeds were advanced by unit standard of 20 ml/kg/day, he was limited to 23 ml/kg/day of human milk with the remainder of his enteral diet consisting of Enfaport (Chicago, IL, United States), SolCarb (Westbury, NY, United States), and Similac liquid protein fortifier (Abbott Park, IL, United States) formulas (Table 2). His feeds were fortified to 24 kcal/oz on day of life 6. On day 7 of life, the patient started to have new bradycardia and desaturation episodes with two small emeses but a reassuring abdominal examination. Enteral nutrition was continued. On day 9 of life, he had one episode of emesis and then hematochezia. An abdominal x-ray (Figure 1) demonstrated pneumatosis intestinalis and he was subsequently diagnosed with NEC (modified Bell Stage IIa). He was managed conservatively with bowel rest, ampicillin-sulbactam and gentamicin for 7 days, and bowel decompression for 5 days. He was maintained on total parental nutrition (TPN) with 4 g/kg/day TrophAmine, glucose infusion rate ~15 mg/kg/min, and 2 g/kg/day 20% Intralipid. Diet following re-initiation of enteral nutrition consisted of a combination of skimmed and full fat maternal and donor human milk, Enfaport, MCT oil instead of triheptanoin (per parental request), SolCarb, and Similac liquid protein fortifier (Figure 2). He recovered uneventfully and was discharged home on day 33 of life.","counts":{"Case":1,"Treatment":11,"Exam":3,"Condition":3,"Symptom":3}}],"overview":{"nodes":[{"id":"agg:Exam:computed tomography","type":"Exam","label":"computed tomography","count":43,"cases":["PMC5137649_01","PMC9387390_01","PMC3437073_01","PMC7102447_01","PMC8627357_01","PMC3917415_01","PMC7718649_01","PMC5875137_01","PMC6949661_01","PMC10405809_01","PMC7519975_01","PMC10434843_01","PMC4073451_01","PMC3859158_01","PMC5804616_01","PMC3897989_01","PMC11420039_01","PMC12215201_01","PMC12832199_01"],"aggregate":true,"attrs":{}},{"id":"agg:Treatment:stent","type":"Treatment","label":"stent","count":18,"cases":["PMC9387390_01","PMC6343374_01","PMC9815523_01"],"aggregate":true,"attrs":{}},{"id":"agg:Exam:magnetic resonance imaging","type":"Exam","label":"magnetic resonance imaging","count":12,"cases":["PMC10434843_01","PMC4828947_01","PMC3897989_01","PMC11420039_01","PMC11345641_01"],"aggregate":true,"attrs":{}},{"id":"agg:Treatment:prednisone","type":"Treatment","label":"prednisone","count":12,"cases":["PMC7718649_01","PMC6134951_01","PMC10488652_01"],"aggregate":true,"attrs":{}},{"id":"agg:Exam:biopsy","type":"Exam","label":"biopsy","count":11,"cases":["PMC9387390_01","PMC6134951_01","PMC10405809_01","PMC4073451_01","PMC3897989_01","PMC10488652_01","PMC11345641_01","PMC11783470_01","PMC12215201_01"],"aggregate":true,"attrs":{}},{"id":"agg:Exam:physica const nodeById = new Map(DATA.nodes.map((node) => [node.id, node]));
const edgeById = new Map(DATA.edges.map((edge) => [edge.id, edge]));
